services:
  - type: web
    name: pdf-report-converter
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      pip install dashscope
      apt-get update && apt-get install -y chromium
    startCommand: python app.py
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: PORT
        fromEnvVar: PORT