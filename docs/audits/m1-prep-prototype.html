<title>M1 会前准备 Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Y4 platform shell (dark rail + work area) with a right-hand design-notes column. A stepper (资料 → 生成 → 审阅定稿) drives the flow; the review step is "the document is the editor": an A4 page beside one control panel. Tokens mirror static/admin_v2.css and the First Touch 3.0 prototype. */
:root {
  --bg: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-soft: #F1F2F4;
  --ink: #18181B; --muted: #71717A; --faint: #A1A1AA;
  --brand: #D24949; --brand-deep: #B33A3A; --brand-soft: #FAEEEE; --brand-ring: rgba(210,73,73,.32);
  --ok: #15803D; --ok-soft: #F0FDF4; --warn: #B45309; --warn-soft: #FEF6E7; --danger: #DC2626; --danger-soft: #FEF2F2;
  --info: #1D4ED8; --info-soft: #EFF4FF;
  --side: #16130F; --side-text: #A8A29E; --side-strong: #FAFAF9; --side-active: rgba(255,255,255,.09);
  --note-bg: #FFFBEB; --note-line: #F3E3B5; --note-ink: #57400F;
  --on-brand: #FFFFFF; --scrim: rgba(17,17,20,.45);
  /* the A4 document keeps its paper look in both themes, like a printed page */
  --paper: #FFFFFF; --paper-ink: #37352F; --paper-muted: #787774; --paper-line: #E9E9E7; --paper-head: #F7F6F3; --paper-red: #D44C47; --call-gray: #F1F1EF; --call-brown: #F4EEEE; --desk: #E9E6E1;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --r: 8px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121214; --surface: #1B1B1F; --line: #2C2C32; --line-soft: #232328;
  --ink: #F4F4F5; --muted: #A1A1AA; --faint: #71717A;
  --brand: #E05A5A; --brand-deep: #F07A7A; --brand-soft: #3A1F1F; --brand-ring: rgba(224,90,90,.4);
  --ok: #4ADE80; --ok-soft: #13291B; --warn: #FBBF24; --warn-soft: #2E2410; --danger: #F87171; --danger-soft: #331717;
  --info: #93B4FF; --info-soft: #18223A;
  --side: #0B0A09; --side-active: rgba(255,255,255,.08);
  --note-bg: #26210F; --note-line: #4A3F1A; --note-ink: #F1DFA6; --scrim: rgba(0,0,0,.6); --desk: #26262B;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1B1B1F; --line: #2C2C32; --line-soft: #232328;
  --ink: #F4F4F5; --muted: #A1A1AA; --faint: #71717A;
  --brand: #E05A5A; --brand-deep: #F07A7A; --brand-soft: #3A1F1F; --brand-ring: rgba(224,90,90,.4);
  --ok: #4ADE80; --ok-soft: #13291B; --warn: #FBBF24; --warn-soft: #2E2410; --danger: #F87171; --danger-soft: #331717;
  --info: #93B4FF; --info-soft: #18223A;
  --side: #0B0A09; --side-active: rgba(255,255,255,.08);
  --note-bg: #26210F; --note-line: #4A3F1A; --note-ink: #F1DFA6; --scrim: rgba(0,0,0,.6); --desk: #26262B;
  color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.55 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-ring); border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
h1, h2, h3, h4 { text-wrap: balance; }

/* prototype bar */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; max-width: 1500px; margin: 0 auto; }
.proto-name { font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
.proto-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.proto-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.proto-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted); }
.proto-tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.proto label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

/* shell */
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 184px minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
.wrap.no-notes { grid-template-columns: 184px minmax(0, 1fr); }
.wrap.no-notes .notes { display: none; }
.rail { background: var(--side); color: var(--side-text); border-radius: var(--r); padding: 14px 10px; position: sticky; top: 64px; }
.rail .brand { color: var(--side-strong); font-weight: 650; padding: 0 8px 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
.rail .brand small { display: block; color: var(--side-text); font-weight: 400; font-size: 11px; }
.rail .grp { font-size: 11px; letter-spacing: .06em; padding: 10px 8px 4px; }
.rail a { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; color: var(--side-text); text-decoration: none; font-size: 12.5px; }
.rail a.on { background: var(--side-active); color: var(--side-strong); }
.rail a .new { font-size: 10px; background: var(--brand); color: var(--on-brand); border-radius: 999px; padding: 0 6px; }
.main { min-width: 0; display: grid; gap: 16px; }
.notes { position: sticky; top: 64px; background: var(--note-bg); border: 1px solid var(--note-line); color: var(--note-ink); border-radius: var(--r); padding: 14px 16px; font-size: 12.5px; }
.notes h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; }
.notes h4 { margin: 12px 0 4px; font-size: 12.5px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes p { margin: 0; }
.notes .btn { margin-top: 10px; }
@media (max-width: 1180px) { .wrap, .wrap.no-notes { grid-template-columns: minmax(0, 1fr) 260px; } .wrap.no-notes { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } .notes { position: static; } }

/* components */
.surface { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 2px rgba(24,24,27,.04); min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; }
.sp { flex: 1; }
.body { padding: 14px 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; font-size: 12.5px; font-weight: 500; white-space: nowrap; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--faint); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.pri:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 13.5px; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--line-soft); color: var(--muted); white-space: nowrap; font-weight: 500; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.brand { background: var(--brand-soft); color: var(--brand-deep); } .pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 11.5px; color: var(--muted); }
.inp { height: 32px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 0 10px; min-width: 0; width: 100%; }
textarea.inp { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 30px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.hint { font-size: 11.5px; color: var(--muted); }
.hint.auto { color: var(--info); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 999px; font-size: 12.5px; z-index: 80; max-width: calc(100% - 32px); }

/* page header + stepper */
.page-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.page-h h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.crumb { font-size: 12px; color: var(--muted); }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.step { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border: 0; background: transparent; text-align: left; border-right: 1px solid var(--line); min-width: 0; }
.step:last-child { border-right: 0; }
.step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 650; background: var(--line-soft); color: var(--muted); }
.step b { display: block; font-size: 13px; font-weight: 600; }
.step small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.on { background: var(--brand-soft); }
.step.on .n { background: var(--brand); color: var(--on-brand); }
.step.done .n { background: var(--ok-soft); color: var(--ok); }
.step[disabled] { cursor: default; }
@media (max-width: 640px) { .step small { display: none; } .step { padding: 10px; } }

/* home list */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 500; padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.click { cursor: pointer; } .table tr.click:hover td { background: var(--line-soft); }
.who b { font-weight: 600; } .who small { display: block; color: var(--muted); font-size: 11.5px; }
.scroll-x { overflow-x: auto; }
.scroll-x .table { min-width: 620px; }
.empty-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; }

/* sources */
.infobar { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto 1.4fr; gap: 12px 16px; align-items: start; }
@media (max-width: 1280px) { .infobar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .infobar { grid-template-columns: minmax(0, 1fr); } }
.static-v { height: 32px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.people { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 32px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; background: var(--line-soft); border-radius: 999px; padding: 2px 9px; }
.tag button { border: 0; background: none; padding: 0; color: var(--faint); }
.chip { border: 1px dashed var(--faint); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip:hover { border-color: var(--brand); color: var(--brand-deep); }
.src-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .src-grid { grid-template-columns: minmax(0, 1fr); } }
.src { display: grid; grid-template-rows: auto 1fr; }
.src .head { border-bottom: 1px solid var(--line-soft); }
.src .how { font-size: 11.5px; color: var(--muted); }
.src .body { display: grid; gap: 10px; align-content: start; }
.facts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.facts li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; font-size: 12.5px; }
.facts li::before { content: "·"; color: var(--faint); text-align: center; }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; }
.file .nm { font-weight: 500; overflow-wrap: anywhere; }
.file .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.file .meta select, .file .meta input { height: 26px; font-size: 12px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
.file .sum { grid-column: 1 / -1; font-size: 12px; color: var(--ink); background: var(--line-soft); border-radius: 5px; padding: 6px 8px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r-sm); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.drop:hover { border-color: var(--faint); }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); }
.qrow:last-child { border-bottom: 0; }
.derived { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; font-size: 12px; color: var(--muted); }
.gen-bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; }
.gen-bar .sum { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { width: min(760px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal .head { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal .foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.miss { margin: 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 12.5px; }

/* generating */
.gen { display: grid; gap: 4px; max-width: 620px; }
.gen-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.gen-row .ic { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.gen-row.run .ic { border-color: var(--brand); border-right-color: transparent; animation: spin .8s linear infinite; }
.gen-row.ok .ic { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 3px var(--surface); }
.gen-row small { display: block; color: var(--muted); font-size: 11.5px; }
@keyframes spin { to { transform: rotate(360deg); } }
.meter { height: 6px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .4s ease; }

/* review */
.review { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1380px) { .wrap:not(.no-notes) .review { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 980px) { .review { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; }
.saved { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.saved .dot { color: var(--ok); }
.panel { position: sticky; top: 64px; display: grid; gap: 12px; max-height: calc(100vh - 80px); overflow: auto; }
.panel .surface .body { display: grid; gap: 8px; }
.ab { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); }
.ab input { margin: 2px 0 0; accent-color: var(--brand); }
.ab b { font-weight: 600; font-size: 12.5px; }
.ab small { display: block; color: var(--muted); font-size: 11.5px; }
.ab.off { opacity: .6; }
.warnline { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 8px; font-size: 12px; align-items: start; }
.warnline .dot { margin-top: 6px; }
.warnline.w .dot { color: var(--warn); } .warnline.i .dot { color: var(--info); } .warnline.d .dot { color: var(--danger); }
.sync { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; }
.sync .row { display: flex; gap: 6px; flex-wrap: wrap; }
.safety { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--danger); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; }
.safety b { font-weight: 650; }
.lockbar { background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; }

/* the A4 document: mirrors the Notion export of 《M1 FM会前准备框架》 */
.desk { background: var(--desk); border-radius: var(--r); padding: 20px; overflow-x: auto; }
.a4 { position: relative; background: var(--paper); color: var(--paper-ink); width: 100%; max-width: 820px; margin: 0 auto; padding: 56px 64px 40px; box-shadow: 0 2px 10px rgba(0,0,0,.12); font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; }
@media (max-width: 640px) { .desk { padding: 8px; } .a4 { padding: 28px 16px 24px; } }
.a4 .icon { font-size: 44px; line-height: 1; margin-bottom: 14px; }
.a4 .title { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; line-height: 1.25; }
.a4 .props { color: var(--paper-muted); font-size: 12.5px; margin-bottom: 8px; }
.a4 h2 { font-size: 22px; font-weight: 600; margin: 34px 0 8px; line-height: 1.3; }
.a4 h3 { font-size: 17px; font-weight: 600; margin: 22px 0 6px; line-height: 1.35; }
.a4 h3.red { color: var(--paper-red); }
.a4 .lbl { font-weight: 600; margin: 12px 0 4px; }
.a4 p { margin: 4px 0; }
.a4 .t { width: 100%; border-collapse: collapse; margin: 6px 0 8px; font-size: 12px; line-height: 1.5; }
.a4 .t th { background: var(--paper-head); color: var(--paper-muted); text-align: left; font-weight: 400; padding: 7px 8px; border: 1px solid var(--paper-line); vertical-align: top; }
.a4 .t td { padding: 7px 8px; border: 1px solid var(--paper-line); vertical-align: top; }
.a4 .call { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; border-radius: 6px; padding: 14px 16px 14px 12px; margin: 10px 0; background: var(--call-brown); }
.a4 .call.gray { background: var(--call-gray); }
.a4 .call .e { font-size: 20px; line-height: 1.2; }
.a4 .call b { font-weight: 600; }
.a4 .insuf { color: var(--paper-muted); }
.a4 ol { margin: 0; padding-left: 16px; }
.a4 b.k { font-weight: 600; }
.a4 .foot { display: flex; justify-content: space-between; margin-top: 36px; color: var(--paper-muted); font-size: 10.5px; }
.blk { position: relative; border-radius: 3px; outline: 1px dashed transparent; outline-offset: 2px; }

function go(s) { S.screen = s; render(); window.scrollTo({ top: 0 }); }
function render() {
  const m = $('#main');
  m.innerHTML = { home: screenHome, sources: screenSources, gen: screenGen, review: screenReview }[S.screen]();
  $('#notes').innerHTML = NOTES[S.screen];
  document.querySelectorAll('.proto-tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.go === S.screen));
  if (S.screen === 'gen') runGen();
}

let genTimer = null;
function runGen() {
  clearTimeout(genTimer);
  const rows = [...document.querySelectorAll('.gen-row')];
  let i = 0;
  const tick = () => {
    if (S.screen !== 'gen') return;
    rows.forEach((r, k) => { r.className = 'gen-row' + (k < i ? ' ok' : k === i ? ' run' : ''); if (k < i) r.querySelector('[data-t]').textContent = ['0.3 秒', '0.2 秒', '18 秒', '41 秒', '9 秒', '22 秒', '1 秒'][k]; });
    $('#meter').style.width = Math.round(i / rows.length * 100) + '%';
    if (i < rows.length) { i++; genTimer = setTimeout(tick, 650); }
    else { genTimer = setTimeout(() => { if (S.screen === 'gen') { S.genDone = true; go('review'); toast('AI 初稿已生成'); } }, 700); }
  };
  tick();
}

  $('#pvClose').onclick = () => pv.remove();
  $('#pvPrint').onclick = () => toast('平台中这里会打开浏览器打印，选择“存储为 PDF”即可（和 E4 相同）');
  $('#pvClose').focus();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, tr.click, [data-go]');
  if (!t) return;
  if (t.dataset.go && !t.disabled) return go(t.dataset.go);
  if (t.matches('tr.click')) { if (t.dataset.status === 'final') return openPreview(); return go(t.dataset.open === '1' ? 'review' : 'sources'); }
  switch (t.id) {
    case 'newPrep': return pickModal();
    case 'addP': S.people.push('王老师（Case Review）'); return render();
    case 'toConfirm': document.body.insertAdjacentHTML('beforeend', confirmModal()); return $('#cfGo').focus();
    case 'cfBack': return $('#scrim').remove();
    case 'cfGo': $('#scrim').remove(); return go('gen');
    case 'preview': return openPreview();
    case 'finalize': S.final = true; S.sync = null; render(); return toast('已定稿 v2，可以下载 PDF 用于会议');
    case 'unlock': S.final = false; render(); return toast('已基于 v2 新建草稿 v3，v2 仍保留在历史版本中');
    case 'ackSafety': S.safetyAck = true; return render();
    case 'demoSafety': S.safety = true; S.safetyAck = false; S.final = false; go('review'); return;
    case 'syncYes': S.p3 = S.p3.filter(x => x !== S.sync.c); S.sync = null; render(); return toast('已从 Part 3 移除相关追问');
    case 'syncNo': S.sync = null; return render();
    case 'addQ': {
      const q = $('#myQ').value.trim(); if (!q) { $('#myQ').focus(); return toast('先写下想问的问题'); }
      S.mine.push({ q, c: $('#myQab').value }); render(); return toast('已加入 3.3 备用提问');
    }
  }
  if (t.dataset.dur) { S.duration = +t.dataset.dur; return render(); }
  if (t.dataset.rmp) { S.people.splice(+t.dataset.rmp, 1); return render(); }
  if (t.dataset.del) { S.uploads = S.uploads.filter(u => u.id !== t.dataset.del); return render(); }
  if (t.dataset.up) {
    const id = 'u' + Date.now(), cat = t.dataset.up;
    S.uploads.push({ id, cat, name: cat === 'case' ? '2026-10-27 Case Review 补充记录.pdf' : '班主任观察记录.docx', date: '', status: 'reading', sum: '' });
    render();
    setTimeout(() => { const u = S.uploads.find(x => x.id === id); if (!u) return; Object.assign(u, { status: 'ok', date: cat === 'case' ? '2026-10-27' : '2026-10-16', sum: cat === 'case' ? '补充讨论：建议会议中先从考试经历切入；无新增课堂观察。' : '班主任：课间多与固定两位同学在一起，小组活动中常承担记录工作（教师观察）。' }); if (S.screen === 'sources') render(); }, 1400);
    return;
  }
  if (t.dataset.pickname) { $('#scrim').remove(); return go(t.dataset.pickname === '林晓雨' ? 'review' : 'sources'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'notesToggle') return $('#wrap').classList.toggle('no-notes', !t.checked);
  if (t.dataset.pri) {
    const c = t.dataset.pri; S.priority = S.priority.filter(x => x !== c);
    S.sync = S.p3.includes(c) ? { c, msg: `Part 3 中仍有关于 ${c} ${ab(c).n} 的追问。要一并移除吗？` } : null;
    return render();
  }
  if (t.id === 'addAb' && t.value) { S.priority.push(t.value); if (!S.p3.includes(t.value)) S.p3.push(t.value); S.sync = null; render(); return toast(`已添加 ${t.value}，3.3 已补上对应的备用问题`); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'parentText') { S.parentText = t.value; return; }
  const blk = t.closest && t.closest('.blk');
  if (blk) {
    const clone = blk.cloneNode(true); clone.querySelector('.mk')?.remove();
    S.edits[blk.dataset.b] = clone.innerHTML;
    const mk = blk.querySelector('.mk'); if (mk) { mk.className = 'mk ed'; mk.textContent = '已修改'; }
    const sv = document.querySelector('.saved'); if (sv) sv.innerHTML = '<span class="dot"></span>已自动保存 · 刚刚';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#pv')?.remove(); $('#scrim')?.remove(); } });

function pickModal() {
  document.body.insertAdjacentHTML('beforeend', `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pkH" style="width:min(520px,100%)">
    <div class="head"><h2 id="pkH">为哪位学生准备？</h2></div>
    <div class="body" style="display:grid;gap:10px"><input class="inp" placeholder="搜索姓名或 Y4 编号" aria-label="搜索学生" id="pkS">
    ${PICK.map(p => `<button class="file" style="text-align:left;background:var(--surface)" ${p.y4 ? `data-pickname="${p.name}"` : 'disabled'}><span class="nm">${p.name} <span class="sub">${p.meta}</span></span>${p.y4 ? (p.note ? `<span class="pill warn">${p.note}</span>` : '<span class="pill ok">Y4 已完成</span>') : '<span class="pill">不可开始</span>'}${p.y4 ? '' : `<span class="meta">${p.note}</span>`}</button>`).join('')}
    </div><div class="foot"><button class="btn" id="cfBack">取消</button></div></div></div>`);
  $('#pkS').focus();
}

const start = location.hash.slice(1);
if (['home', 'sources', 'gen', 'review'].includes(start)) S.screen = start;
render();
</script>
