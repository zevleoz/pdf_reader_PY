# HTTP -> HTTPS 跳转 + Let's Encrypt 证书续期验证
server {
    listen 80;
    server_name report.p4learning-ark.app;

    # certbot 续期验证用，必须保留
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求全部跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name report.p4learning-ark.app;

    # Let's Encrypt 证书（certbot 自动填充，请勿手改路径）
    ssl_certificate     /etc/letsencrypt/live/report.p4learning-ark.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.p4learning-ark.app/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;

    location / {
        proxy_pass http://unix:/tmp/y4_report.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
