{% extends "student/base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<div class="s-card" style="margin-top:48px; text-align:center">
  <div style="font-size:46px; font-weight:700; color:var(--s-brand); letter-spacing:.02em">{{ code }}</div>
  <div class="s-h1" style="margin-top:6px">{{ title }}</div>
  <p class="s-muted" style="font-size:13.5px; margin-top:10px">{{ message }}</p>
  <div style="margin-top:20px">
    <a class="s-btn s-btn-primary" href="/">返回首页</a>
  </div>
</div>
{% endblock %}
