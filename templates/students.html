<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>学生档案 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    .btn-danger {
      background: var(--white);
      color: var(--red);
      border: 1.5px solid var(--line);
    }
    .btn-danger:hover:not(:disabled) {
      border-color: var(--red);
      background: #FEF2F2;
    }
    .action-cell { display: flex; gap: 8px; align-items: center; }
    .action-link {
      color: var(--red);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: color .2s var(--ease);
    }
    .action-link:hover { color: var(--red-deep); }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; }
    .report-list { margin-top: 24px; }
    .report-list h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .y4-done { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #E8F5E9; color: #2E7D32; }
    .y4-pending { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--paper-2); color: var(--muted); }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">凭远教育</span>
      <span class="brand-name" style="font-size:13px;font-weight:500;">Y4<span style="color:var(--red)">测评</span></span>
    </div>
    <nav class="topbar-nav">
      <a href="/">← 主页</a>
      <a href="/admin/bookings">预约管理</a>
      <a href="/booking">预约</a>
      <a href="/generate">报告生成</a>
    </nav>
  </header>
  <div class="container">
    <h1 class="page-title">学生档案</h1>
    <p class="page-subtitle">所有已生成报告的学生记录。点击学生查看历史报告。</p>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="window.location.href='/api/export'">导出 CSV</button>
      <button class="btn btn-secondary" onclick="loadStudents()">刷新</button>
    </div>
    <div id="studentList"></div>
    <div id="reportList" class="report-list" style="display:none"></div>
  </div>
  <script>
    async function loadStudents() {
      const resp = await fetch('/api/students');
      const data = await resp.json();
      const el = document.getElementById('studentList');
      if (!data.students || data.students.length === 0) {
        el.innerHTML = '<div class="empty">暂无学生记录</div>';
        return;
      }
      let html = '<table><thead><tr><th>ID</th><th>姓名</th><th>顾问</th><th>学校</th><th>年级</th><th>Y4 状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
      for (const s of data.students) {
        const y4Status = s.report_count > 0
          ? '<span class="y4-done">✓ 已完成' + (s.latest_report_date ? ' (' + s.latest_report_date + ')' : '') + '</span>'
          : '<span class="y4-pending">未测评</span>';
        html += `<tr>
          <td>${s.id}</td>
          <td><strong>${s.name}</strong></td>
          <td>${s.advisor_name || '-'}</td>
          <td>${s.school || '-'}</td>
          <td>${s.grade || '-'}</td>
          <td>${y4Status}</td>
          <td>${s.created_at ? new Date(s.created_at).toLocaleString('zh-CN') : '-'}</td>
          <td><div class="action-cell">
            <a class="action-link" href="#" onclick="showReports(${s.id});return false;">查看报告</a>
            <button class="btn btn-sm btn-danger" onclick="deleteStudent(${s.id}, '${s.name}')">删除</button>
          </div></td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    async function showReports(studentId) {
      const resp = await fetch(`/api/students/${studentId}/reports`);
      const data = await resp.json();
      const el = document.getElementById('reportList');
      if (!data.reports || data.reports.length === 0) {
        el.innerHTML = '<h3>该学生暂无报告</h3>';
        el.style.display = 'block';
        return;
      }
      let html = '<h3>历史报告</h3><table><thead><tr><th>日期</th><th>PDF 文件</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
      for (const r of data.reports) {
        html += `<tr>
          <td>${r.report_date || '-'}</td>
          <td><a href="/output/${r.pdf_path.split('/').pop()}" target="_blank">查看 PDF</a></td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '-'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteReport(${r.id})">删除</button></td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteStudent(id, name) {
      if (!confirm(`确认删除学生「${name}」及其所有报告？此操作不可撤销。`)) return;
      const resp = await fetch(`/api/students/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        loadStudents();
        document.getElementById('reportList').style.display = 'none';
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    async function deleteReport(id) {
      if (!confirm('确认删除此报告？')) return;
      const resp = await fetch(`/api/reports/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        alert('已删除');
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    loadStudents();
  </script>
</body>
</html>
