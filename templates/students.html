<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>学生档案 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/app_shell.css" />
  <style>
    .btn-danger {
      background: var(--white);
      color: var(--red);
      border: 1.5px solid var(--line);
    }
    .btn-danger:hover:not(:disabled) {
      border-color: var(--red);
      background: #FEF2F2;
    }
    .action-cell { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .action-link {
      color: var(--red);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: color .2s var(--ease);
    }
    .action-link:hover { color: var(--red-deep); }
    .btn-minutes {
      background: var(--white);
      color: var(--red);
      border: 1px solid var(--red);
      font-weight: 500;
    }
    .btn-minutes:hover:not(:disabled) {
      background: #FEF2F2;
    }
    .btn-minutes:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .report-list { margin-top: 24px; }
    .report-list h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .y4-done { display: inline-flex; align-items: center; white-space: nowrap; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #E8F5E9; color: #2E7D32; }
    .yd-date {
      font-weight: 400;
      margin-left: 7px;
      padding-left: 7px;
      border-left: 1px solid rgba(46, 125, 50, .28);
      opacity: .82;
      font-variant-numeric: tabular-nums;
    }
    .y4-pending { display: inline-flex; align-items: center; white-space: nowrap; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--paper-2); color: var(--muted); }
    .minutes-count {
      display: inline-flex; align-items: center; white-space: nowrap; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: #FFF4E5; color: #B45309;
      border: 1px solid #FBD38D;
    }
    .interp-card {
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 24px 28px;
      margin-top: 8px;
    }
    .interp-content { line-height: 1.75; font-size: 14px; color: var(--ink); }
    .interp-content h1, .interp-content h2, .interp-content h3 {
      font-family: "Noto Serif SC", serif;
      color: var(--ink);
      margin: 14px 0 6px;
    }
    .interp-content ul { margin: 6px 0; padding-left: 20px; }
    .interp-loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }

    /* Minutes history block */
    .minutes-history {
      margin-top: 24px;
    }
    .minutes-history h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .minutes-item {
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: border-color .2s;
    }
    .minutes-item:hover { border-color: var(--red); }
    .minutes-item .mi-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .minutes-item .mi-date {
      font-family: "Noto Serif SC", serif;
      font-size: 14px; font-weight: 600; color: var(--ink);
    }
    .minutes-item .mi-report {
      font-size: 12px; color: var(--muted);
    }
    .minutes-item .mi-preview {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .minutes-item .mi-actions {
      margin-top: 10px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .minutes-empty {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--paper-2);
      border: 1px dashed var(--line-soft);
      border-radius: 10px;
      padding: 20px;
    }

    /* 学生列表 — 对齐列 */
    .stu-table-head, .student-card {
      display: grid;
      grid-template-columns: minmax(140px, 1.05fr) minmax(0, 1.25fr) minmax(110px, .7fr) minmax(196px, 224px) 264px;
      gap: 14px;
      align-items: center;
    }
    .stu-table-head {
      height: 30px;
      margin-bottom: 6px;
      padding: 0 16px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .4px;
    }
    .stu-table-head span:last-child { text-align: right; }
    .student-card {
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 6px;
      min-height: 62px;
      transition: background .15s var(--ease), border-color .2s var(--ease);
    }
    .student-card:hover {
      background: var(--paper-2);
      border-color: var(--line);
    }
    .sc-name-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .sc-name {
      font-family: "Noto Serif SC", serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sc-grade-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--paper-2);
      border: 1px solid var(--line-soft);
      border-radius: 5px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sc-school, .sc-advisor {
      font-size: 13px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sc-school { color: var(--ink); }
    .sc-advisor { color: var(--ink-2); }
    .sc-school.is-empty, .sc-advisor.is-empty { color: var(--muted); }
    .sc-badges { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; }
    .sc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .sc-actions .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }
    .sc-actions .btn-minutes { min-width: 70px; justify-content: center; }
    .sc-actions .sc-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
    }
    .sc-actions .sc-ghost:hover {
      color: var(--ink);
      background: var(--white);
      border-color: var(--line);
    }
    .sc-actions .sc-ghost.sc-danger:hover {
      color: var(--red);
      border-color: var(--red);
      background: #FEF2F2;
    }
    .sc-rename {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px;
      border-top: 1px dashed var(--line-soft);
      margin-top: 4px;
    }
    .rename-input {
      flex: 1;
      min-width: 180px;
      padding: 7px 12px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-family: "Inter", "Noto Serif SC", sans-serif;
      color: var(--ink);
      background: var(--white);
      outline: none;
      transition: border-color .2s var(--ease);
    }
    .rename-input:focus { border-color: var(--red); }
    @media (max-width: 860px) {
      .stu-table-head { display: none; }
      .student-card { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
      .sc-name-cell { flex: 1 1 auto; }
      .sc-badges { margin-left: auto; }
      .sc-school, .sc-advisor { flex-basis: 100%; }
      .sc-school { order: 3; }
      .sc-advisor { order: 4; }
      .sc-actions { order: 5; flex-basis: 100%; justify-content: flex-start; }
    }
    /* 学生列表搜索与筛选 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .st-filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 320px;
      flex-wrap: wrap;
    }
    .st-search-wrap {
      position: relative;
      flex: 1;
      max-width: 380px;
      min-width: 200px;
    }
    .st-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      display: flex;
      transition: color .2s var(--ease);
    }
    .st-search-wrap:focus-within .st-search-icon { color: var(--red); }
    .st-search {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1.5px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      color: var(--ink);
      background: var(--paper-2);
      outline: none;
      transition: background .2s var(--ease), border-color .2s var(--ease);
      font-family: inherit;
    }
    .st-search:focus {
      background: var(--white);
      border-color: var(--red);
    }
    .st-search::placeholder { color: var(--muted); }
    .st-seg {
      display: flex;
      align-items: center;
      background: var(--paper-2);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .st-seg-item {
      padding: 6px 12px;
      border: none;
      border-radius: 7px;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: color .18s var(--ease), background .18s var(--ease);
    }
    .st-seg-item:hover:not(.active) { color: var(--ink); }
    .st-seg-item.active {
      background: var(--ink);
      color: var(--white);
      font-weight: 500;
    }
    .st-seg-item .seg-count {
      font-size: 10.5px;
      font-weight: 600;
      opacity: .6;
    }
    .st-result-count {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .st-actions { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div data-app-shell></div>
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">学生档案</h1>
      <p class="page-subtitle">所有已生成报告的学生记录。点击学生查看历史报告，或直接「新建议程」开始撰写解读会会议记录。</p>
    </div>
    <div class="toolbar">
      <div class="st-filter-group">
        <div class="st-search-wrap">
          <span class="st-search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input class="st-search" id="studentSearch" placeholder="搜索姓名、年级、学校、顾问…" oninput="filterStudents()">
        </div>
        <div class="st-seg" id="statusSeg">
          <button type="button" class="st-seg-item active" data-status="all" onclick="setStatusFilter('all')">全部 <span class="seg-count" id="cntAll"></span></button>
          <button type="button" class="st-seg-item" data-status="done" onclick="setStatusFilter('done')">已完成 Y4 <span class="seg-count" id="cntDone"></span></button>
          <button type="button" class="st-seg-item" data-status="pending" onclick="setStatusFilter('pending')">未测评 <span class="seg-count" id="cntPending"></span></button>
        </div>
      </div>
      <div class="st-actions">
        <span class="st-result-count" id="resultCount"></span>
        <button class="btn btn-secondary" onclick="window.location.href='/api/export'">导出 CSV</button>
        <button class="btn btn-secondary" onclick="loadStudents()">刷新</button>
      </div>
    </div>
    <div id="studentList"></div>
    <div id="reportList" class="report-list" style="display:none"></div>
    <div id="minutesHistory" class="minutes-history" style="display:none"></div>
  </div>
  <script>
    let currentReports = [];
    let currentStudentId = null;
    let currentStudentName = '';

    let allStudents = [];
    let currentStatus = 'all';

    function setStatusFilter(v) {
      currentStatus = v;
      document.querySelectorAll('#statusSeg .st-seg-item').forEach(b => {
        b.classList.toggle('active', b.dataset.status === v);
      });
      filterStudents();
    }

    async function loadStudents() {
      const resp = await fetch('/api/students');
      const data = await resp.json();
      allStudents = data.students || [];
      filterStudents();
    }

    function filterStudents() {
      const q = (document.getElementById('studentSearch').value || '').trim().toLowerCase();
      let list = allStudents;
      if (q) {
        list = list.filter(s => {
          return (s.name || '').toLowerCase().includes(q) ||
                 (s.grade || '').toLowerCase().includes(q) ||
                 (s.school || '').toLowerCase().includes(q) ||
                 (s.advisor_name || '').toLowerCase().includes(q);
        });
      }
      if (currentStatus === 'done') list = list.filter(s => s.report_count > 0);
      else if (currentStatus === 'pending') list = list.filter(s => s.report_count === 0);
      renderStudents(list);
    }

    function renderStudents(students) {
      const el = document.getElementById('studentList');
      const doneCount = allStudents.filter(s => s.report_count > 0).length;
      document.getElementById('cntAll').textContent = allStudents.length;
      document.getElementById('cntDone').textContent = doneCount;
      document.getElementById('cntPending').textContent = allStudents.length - doneCount;
      document.getElementById('resultCount').textContent = students.length === allStudents.length
        ? '共 ' + students.length + ' 位学生'
        : students.length + ' / ' + allStudents.length + ' 位学生';
      if (!students || students.length === 0) {
        el.innerHTML = '<div class="empty">暂无匹配的学生记录</div>';
        return;
      }
      let html = '<div class="stu-table-head"><span>学生</span><span>学校</span><span>顾问</span><span>状态</span><span>操作</span></div>';
      for (const s of students) {
        const y4Status = s.report_count > 0
          ? '<span class="y4-done">已完成' + (s.latest_report_date ? '<span class="yd-date">' + s.latest_report_date + '</span>' : '') + '</span>'
          : '<span class="y4-pending">未测评</span>';
        const minutesBadge = s.minutes_count > 0 ? `<span class="minutes-count" title="该学生已有解读会纪要条数">纪要 ${s.minutes_count}</span>` : '';
        const canMinutes = s.report_count > 0;
        const nameJson = JSON.stringify(s.name).replace(/"/g, '&quot;');
        const created = s.created_at ? new Date(s.created_at).toLocaleString('zh-CN') : '-';
        const gradeTag = s.grade ? '<span class="sc-grade-tag">' + escapeHtml(s.grade) + '</span>' : '';
        const schoolHtml = s.school
          ? escapeHtml(s.school)
          : '<span class="is-empty">—</span>';
        const advisorHtml = s.advisor_name
          ? escapeHtml(s.advisor_name)
          : '<span class="is-empty">—</span>';
        html += `<div class="student-card" data-id="${s.id}" title="创建于 ${created}">
          <div class="sc-name-cell">
            <span class="sc-name" id="name-${s.id}">${escapeHtml(s.name)}</span>
            ${gradeTag}
          </div>
          <div class="sc-school" title="${escapeHtml(s.school || '')}">${schoolHtml}</div>
          <div class="sc-advisor" title="${escapeHtml(s.advisor_name || '')}">${advisorHtml}</div>
          <div class="sc-badges">${y4Status}${minutesBadge}</div>
          <div class="sc-actions">
            <a class="action-link" href="#" onclick="showReports(${s.id}, ${nameJson});return false;">查看报告</a>
            <button class="btn btn-sm btn-minutes" onclick="newMinutesForStudent(${s.id})" ${canMinutes ? '' : 'disabled title="先生成测评报告后再做解读会纪要"'}>${canMinutes ? '新建议程' : '无报告'}</button>
            <button class="btn btn-sm sc-ghost" onclick="startRename(${s.id})">重命名</button>
            <button class="btn btn-sm sc-ghost sc-danger" onclick="deleteStudent(${s.id}, ${nameJson})">删除</button>
          </div>
          <div class="sc-rename" id="rename-${s.id}" style="display:none">
            <input type="text" class="rename-input" id="rename-input-${s.id}" value="${escapeHtml(s.name)}"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRename(${s.id})}else if(event.key==='Escape'){cancelRename(${s.id})}" />
            <button class="btn btn-sm btn-primary" onclick="confirmRename(${s.id})">确认</button>
            <button class="btn btn-sm btn-secondary" onclick="cancelRename(${s.id})">取消</button>
          </div>
        </div>`;
      }
      el.innerHTML = html;
    }

    function newMinutesForStudent(studentId) {
      window.open(`/transcript?student_id=${studentId}`, '_blank');
    }

    function newMinutesForReport(studentId, reportId) {
      window.open(`/transcript?student_id=${studentId}&report_id=${reportId}`, '_blank');
    }

    async function showReports(studentId, studentName) {
      currentStudentId = studentId;
      currentStudentName = studentName || '';
      const resp = await fetch(`/api/students/${studentId}/reports`);
      const data = await resp.json();
      const el = document.getElementById('reportList');
      currentReports = data.reports || [];
      document.getElementById('minutesHistory').style.display = 'none';
      if (currentReports.length === 0) {
        el.innerHTML = '<h3>该学生暂无报告</h3>';
        el.style.display = 'block';
        loadMinutesHistory(studentId, studentName);  // still show minutes even if no reports
        el.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      let html = '<h3>历史报告</h3><table><thead><tr><th>日期</th><th>PDF 文件</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
      for (const r of currentReports) {
        const interpLabel = r.interpretation ? 'AI 解读 ✓' : 'AI 解读';
        const minutesUrl = `/transcript?student_id=${studentId}&report_id=${r.id}`;
        html += `<tr>
          <td>${r.report_date || '-'}</td>
          <td><a href="/output/${r.pdf_path.split('/').pop()}" target="_blank">查看 PDF</a></td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '-'}</td>
          <td>
            <button class="btn btn-sm btn-secondary" onclick="showInterpretation(${r.id})">${interpLabel}</button>
            <button class="btn btn-sm btn-minutes" onclick="window.open('${minutesUrl}', '_blank')">✎ 解读会纪要</button>
            <button class="btn btn-sm btn-secondary" onclick="showRawData(${r.id})">原始数据</button>
            <a class="btn btn-sm btn-secondary" href="/api/reports/${r.id}/raw?download=1" download>下载 JSON</a>
            <a class="btn btn-sm btn-secondary" href="/api/reports/${r.id}/evaluation" download>下载 有效评价</a>
            <button class="btn btn-sm btn-danger" onclick="deleteReport(${r.id})">删除</button>
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
      el.style.display = 'block';
      // Load student minutes history
      loadMinutesHistory(studentId, studentName);
      el.scrollIntoView({ behavior: 'smooth' });
    }

    async function showRawData(reportId) {
      const resp = await fetch(`/api/reports/${reportId}/raw`);
      const data = await resp.json();
      const el = document.getElementById('reportList');
      if (!data.ok) { alert(data.error || '加载失败'); return; }
      const schemaItems = (data.raw.schema_124 || []);
      const student = data.raw.student || {};
      let html = `<h3>原始数据 — ${data.student_name || ''}（报告 #${data.report_id}）</h3>`;
      html += `<p class="page-subtitle">学生：${student.name || '-'} ｜ 年级：${student.grade || '-'} ｜ 学校：${student.school || '-'} ｜ 测评日期：${student.test_date || '-'} ｜ 共 ${schemaItems.length} 个数据点</p>`;
      html += '<div style="max-height:480px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:10px;"><table><thead><tr><th>编号</th><th>指标</th><th>数值</th><th>来源</th></tr></thead><tbody>';
      for (const it of schemaItems) {
        html += `<tr><td>${it.code || '-'}</td><td>${it.label || '-'}</td><td><b>${it.value ?? '—'}</b></td><td>${it.source_pdf || '-'}</td></tr>`;
      }
      html += '</tbody></table></div>';
      html += `<div style="margin-top:12px;"><button class="btn btn-sm btn-secondary" onclick="showReportsFromCache()">← 返回报告列表</button></div>`;
      el.innerHTML = html;
      el.scrollIntoView({ behavior: 'smooth' });
    }

    function renderMd(text) {
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.+<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function findReport(reportId) {
      return currentReports.find(r => r.id === reportId);
    }

    function renderInterpCard(r) {
      const el = document.getElementById('reportList');
      let html = `<h3>AI 解读 — 报告 #${r.id}（${r.report_date || '-'}）</h3>`;
      if (r.interpretation) {
        html += `<div class="interp-card"><div class="interp-content">${renderMd(r.interpretation)}</div></div>`;
      } else {
        html += `<div class="interp-card"><div class="interp-loading" id="interpLoading">AI 解读生成中，约需 10–30 秒，请勿关闭页面…</div></div>`;
      }
      html += `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm btn-primary" id="reInterpBtn" onclick="runInterpret(${r.id})">重新解读</button>
        <button class="btn btn-sm btn-minutes" onclick="window.open('/transcript?student_id=${currentStudentId}&report_id=${r.id}', '_blank')">✎ 撰写解读会纪要</button>
        <button class="btn btn-sm btn-secondary" onclick="showReportsFromCache()">← 返回报告列表</button>
      </div>`;
      el.innerHTML = html;
      el.scrollIntoView({ behavior: 'smooth' });
    }

    async function showInterpretation(reportId) {
      const r = findReport(reportId);
      if (!r) return;
      if (r.interpretation) {
        renderInterpCard(r);
      } else {
        renderInterpCard(r);   // 显示加载态
        await runInterpret(reportId);
      }
    }

    async function runInterpret(reportId) {
      const btn = document.getElementById('reInterpBtn');
      if (btn) { btn.disabled = true; btn.textContent = '解读中...'; }
      const loadingEl = document.getElementById('interpLoading');
      const r = findReport(reportId);
      if (!r) return;
      if (!loadingEl && r.interpretation) {
        const card = document.querySelector('.interp-card');
        if (card) card.insertAdjacentHTML('afterbegin',
          '<div class="interp-loading" id="interpLoading">AI 正在重新解读，约需 10–30 秒…</div>');
      }
      try {
        const resp = await fetch(`/api/reports/${reportId}/interpret`, { method: 'POST' });
        const data = await resp.json();
        if (data.ok) {
          r.interpretation = data.reply;
          renderInterpCard(r);
          loadStudents();   // 刷新学生列表
        } else {
          alert('解读失败：' + (data.error || '未知错误'));
          renderInterpCard(r);
        }
      } catch (e) {
        alert('网络错误');
        renderInterpCard(r);
      }
    }

    function backToReports() {
      showReportsFromCache();
    }

    function showReportsFromCache() {
      const el = document.getElementById('reportList');
      let html = '<h3>历史报告</h3><table><thead><tr><th>日期</th><th>PDF 文件</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
      for (const r of currentReports) {
        const interpLabel = r.interpretation ? 'AI 解读 ✓' : 'AI 解读';
        html += `<tr>
          <td>${r.report_date || '-'}</td>
          <td><a href="/output/${r.pdf_path.split('/').pop()}" target="_blank">查看 PDF</a></td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '-'}</td>
          <td>
            <button class="btn btn-sm btn-secondary" onclick="showInterpretation(${r.id})">${interpLabel}</button>
            <button class="btn btn-sm btn-minutes" onclick="window.open('/transcript?student_id=${currentStudentId}&report_id=${r.id}', '_blank')">✎ 解读会纪要</button>
            <button class="btn btn-sm btn-secondary" onclick="showRawData(${r.id})">原始数据</button>
            <a class="btn btn-sm btn-secondary" href="/api/reports/${r.id}/raw?download=1" download>下载 JSON</a>
            <a class="btn btn-sm btn-secondary" href="/api/reports/${r.id}/evaluation" download>下载 有效评价</a>
            <button class="btn btn-sm btn-danger" onclick="deleteReport(${r.id})">删除</button>
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
      el.style.display = 'block';
      // Re-show minutes history after returning from detail
      if (currentStudentId) loadMinutesHistory(currentStudentId, currentStudentName);
      el.scrollIntoView({ behavior: 'smooth' });
    }

    // -------------------- Minutes history --------------------
    async function loadMinutesHistory(studentId, studentName) {
      const wrap = document.getElementById('minutesHistory');
      try {
        const resp = await fetch(`/api/students/${studentId}/minutes`);
        const data = await resp.json();
        if (!data.ok || !data.minutes || data.minutes.length === 0) {
          wrap.innerHTML = `
            <h3>历史解读会纪要</h3>
            <div class="minutes-empty">
              该学生暂无历史解读会纪要。&nbsp;&nbsp;
              <a href="/transcript?student_id=${studentId}" target="_blank"
                 style="color:var(--red);font-weight:600;">立即新建第一条 →</a>
            </div>`;
          wrap.style.display = 'block';
          return;
        }
        let html = `<h3>历史解读会纪要（共 ${data.minutes.length} 条）</h3>`;
        for (const m of data.minutes) {
          const created = m.created_at ? new Date(m.created_at).toLocaleString('zh-CN') : '—';
          const reportTag = m.report_date ? `关联报告：${m.report_date}` : '未绑定报告';
          html += `<div class="minutes-item" data-id="${m.id}">
            <div class="mi-head">
              <span class="mi-date">${created}</span>
              <span class="mi-report">${reportTag}</span>
            </div>
            <div class="mi-preview">${escapeHtml(m.preview || '（无预览）')}</div>
            <div class="mi-actions">
              <a class="btn btn-sm btn-secondary" href="/transcript?student_id=${studentId}#m${m.id}" target="_blank">查看完整内容</a>
              <button class="btn btn-sm btn-primary" onclick="downloadMinutesDocx(${m.id})">下载 DOCX</button>
              <button class="btn btn-sm btn-danger" style="background:var(--white);color:var(--red);border:1.5px solid var(--line);"
                onclick="deleteMinutes(${m.id})">删除</button>
            </div>
          </div>`;
        }
        wrap.innerHTML = html;
        wrap.style.display = 'block';
      } catch (e) {
        console.warn(e);
      }
    }

    async function downloadMinutesDocx(minutesId) {
      try {
        const resp = await fetch('/api/transcript/docx', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ minutes_id: minutesId }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || '生成失败');
        }
        const blob = await resp.blob();
        const disp = resp.headers.get('Content-Disposition') || '';
        let filename = '凭远Y4解读会纪要.docx';
        const m = disp.match(/filename\*=UTF-8''([^;]+)/);
        if (m) { try { filename = decodeURIComponent(m[1]); } catch {} }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('下载失败：' + e.message);
      }
    }

    async function deleteMinutes(id) {
      if (!confirm('确认删除这条纪要？此操作不可撤销。')) return;
      try {
        const resp = await fetch(`/api/minutes/${id}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.ok) {
          if (currentStudentId) loadMinutesHistory(currentStudentId, currentStudentName);
          loadStudents();
        } else alert(data.error || '删除失败');
      } catch (e) { alert('删除失败：' + e.message); }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    async function deleteStudent(id, name) {
      if (!confirm(`确认删除学生「${name}」及其所有报告、纪要？此操作不可撤销。`)) return;
      const resp = await fetch(`/api/students/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        loadStudents();
        document.getElementById('reportList').style.display = 'none';
        document.getElementById('minutesHistory').style.display = 'none';
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    function startRename(studentId) {
      const editor = document.getElementById('rename-' + studentId);
      if (!editor) return;
      editor.style.display = 'flex';
      const input = document.getElementById('rename-input-' + studentId);
      if (input) { input.focus(); input.select(); }
    }

    function cancelRename(studentId) {
      const editor = document.getElementById('rename-' + studentId);
      if (!editor) return;
      editor.style.display = 'none';
      const input = document.getElementById('rename-input-' + studentId);
      const nameEl = document.getElementById('name-' + studentId);
      if (input && nameEl) input.value = nameEl.textContent.trim();
    }

    async function confirmRename(studentId) {
      const input = document.getElementById('rename-input-' + studentId);
      if (!input) return;
      const newName = (input.value || '').trim();
      if (!newName) { alert('姓名不能为空'); return; }
      try {
        const resp = await fetch(`/api/students/${studentId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });
        const data = await resp.json();
        if (data.ok) {
          loadStudents();
        } else {
          alert('重命名失败：' + (data.error || '未知错误'));
        }
      } catch (e) {
        alert('重命名失败：' + e.message);
      }
    }

    async function deleteReport(id) {
      if (!confirm('确认删除此报告？')) return;
      const resp = await fetch(`/api/reports/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        alert('已删除');
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    loadStudents();
  </script>
  <script src="/app_shell.js" defer></script>
</body>
</html>
