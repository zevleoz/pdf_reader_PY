<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>预约测评 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    .calendly-layout { display: grid; grid-template-columns: 5fr 7fr; gap: 40px; align-items: start; }
    .calendly-panel { background: var(--white); border: 1px solid var(--line-soft); border-radius: 14px; padding: 32px; }
    .calendly-panel h3 { font-family: "Noto Serif SC", serif; font-size: 17px; font-weight: 600; margin-bottom: 20px; color: var(--ink); }
    .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 16px; }
    .date-cell { aspect-ratio: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid var(--line-soft); border-radius: 10px; cursor: pointer; transition: all .2s var(--ease); background: var(--paper); }
    .date-cell:hover:not(.disabled) { border-color: var(--ink); transform: translateY(-1px); }
    .date-cell.selected { border-color: var(--red); background: var(--red); color: var(--white); }
    .date-cell.disabled { opacity: .3; cursor: not-allowed; }
    .date-cell .day { font-size: 18px; font-weight: 600; font-family: "Inter", sans-serif; }
    .date-cell.selected .day { opacity: 1; }
    .dow-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 10px; }
    .dow-header div { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .time-slot-btn { padding: 16px 8px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); cursor: pointer; transition: all .2s var(--ease); text-align: center; font-family: "Inter", sans-serif; font-weight: 500; font-size: 16px; position: relative; }
    .time-slot-btn:hover:not(.disabled) { border-color: var(--red); color: var(--red); transform: translateY(-1px); }
    .time-slot-btn.selected { border-color: var(--red); background: var(--red); color: var(--white); }
    .time-slot-btn.disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
    .time-slot-btn .slot-count { display: block; font-size: 11px; font-weight: 600; margin-top: 4px; opacity: .8; color: var(--red); }
    .time-slot-btn.selected .slot-count { opacity: 1; color: var(--white); }
    .time-slot-btn.disabled .slot-count, .time-slot-btn.full .slot-count { color: var(--muted); }
    .time-slot-btn.has-bookings { border-color: var(--red); border-width: 2px; }
    .time-slot-btn.has-bookings.selected { border-color: var(--red); }
    .time-slot-btn.full { border-color: var(--line); background: var(--paper-2); color: var(--muted); cursor: not-allowed; opacity: .5; }
    .no-slots { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
    .form-section { margin-top: 28px; display: none; }
    .form-section.visible { display: block; animation: slideUp .4s var(--ease); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .summary-bar { display: flex; align-items: center; gap: 32px; padding: 18px 24px; background: var(--paper-2); border-radius: 10px; margin-bottom: 24px; }
    .summary-bar .label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
    .summary-bar .value { font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 600; color: var(--ink); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .success-page { text-align: center; padding: 48px 32px; }
    .success-icon { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 32px; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .month-label { font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 600; }
    .nav-btn { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s var(--ease); font-size: 18px; color: var(--ink-2); flex-shrink: 0; }
    .nav-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
    .timezone-note { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center; }

    /* ─── Mobile responsive ─── */
    @media (max-width: 900px) {
      .calendly-layout { grid-template-columns: 1fr; gap: 24px; }
      .form-row { grid-template-columns: 1fr; }
      .time-grid { grid-template-columns: repeat(2, 1fr); }
      .calendly-panel { padding: 20px; }
      .summary-bar { gap: 20px; padding: 14px 16px; flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      .calendly-panel { padding: 16px; border-radius: 10px; }
      .date-grid { gap: 4px; }
      .dow-header { gap: 4px; }
      .date-cell { border-radius: 6px; }
      .date-cell .day { font-size: 16px; }
      .time-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .time-slot-btn { padding: 12px 6px; font-size: 14px; }
      .summary-bar { gap: 12px; padding: 12px; }
      .summary-bar .value { font-size: 14px; }
      .page-title { font-size: 22px; }
      .container { padding: 20px 16px; }
      .nav-btn { width: 32px; height: 32px; font-size: 16px; }
      .month-label { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">凭远教育</span>
      <span class="brand-name" style="font-size:13px;font-weight:500;">Y4<span style="color:var(--red)">测评</span></span>
    </div>
    <nav class="topbar-nav">
      <a href="/" data-path="/">← 主页</a>
      <a href="/students" data-path="/students">学生档案</a>
      <a href="/generate" data-path="/generate">报告生成</a>
    </nav>
  </header>

  <main class="container">
    <div id="bookingView">
      <h1 class="page-title">预约 Y4 测评</h1>
      <p class="page-subtitle">选择合适的日期与时间，为学生预约一次 Y4 综合测评。</p>
      <div class="hint" style="margin-bottom:24px;">需提前一天预约。每时段最多 4 人，所有时段默认开放。</div>

      <div class="calendly-layout">
        <!-- 左栏：日期选择 -->
        <div class="calendly-panel">
          <h3>选择日期</h3>
          <div class="month-nav">
            <button class="nav-btn" id="prevMonth" onclick="changeMonth(-1)">‹</button>
            <span class="month-label" id="monthLabel"></span>
            <button class="nav-btn" id="nextMonth" onclick="changeMonth(1)">›</button>
          </div>
          <div class="dow-header">
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
          </div>
          <div class="date-grid" id="dateGrid"></div>
          <div class="timezone-note">时区：中国标准时间 (UTC+8) · 可选未来 30 天</div>
        </div>

        <!-- 右栏：时间段 + 表单 -->
        <div class="calendly-panel">
          <h3 id="timePanelTitle">选择时间</h3>
          <div id="timeContent">
            <div class="no-slots">请先在左侧选择一个日期</div>
          </div>

          <div class="form-section" id="formSection">
            <div class="summary-bar">
              <div>
                <div class="label">日期</div>
                <div class="value" id="summaryDate">-</div>
              </div>
              <div>
                <div class="label">时间</div>
                <div class="value" id="summaryTime">-</div>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="studentName">学生姓名 <span class="required">*</span></label>
              <input type="text" id="studentName" placeholder="请输入学生姓名" />
            </div>
            <div class="form-row">
              <div class="field">
                <label class="field-label" for="advisorName">顾问名字</label>
                <input type="text" id="advisorName" placeholder="请输入顾问名字" />
              </div>
              <div class="field">
                <label class="field-label" for="school">学校</label>
                <input type="text" id="school" placeholder="请输入学校名称" />
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="notes">备注</label>
              <textarea id="notes" rows="2" placeholder="如有特殊要求请说明"></textarea>
            </div>
            <div class="field">
              <div class="checkbox-row">
                <input type="checkbox" id="singleParent" />
                <label for="singleParent">单亲家庭/离异</label>
              </div>
            </div>
            <button class="btn btn-primary btn-lg" id="submitBtn" onclick="submitBooking()" style="width:100%;margin-top:8px;">确认预约</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 成功页 -->
    <div id="successView" style="display:none;">
      <div class="calendly-panel success-page">
        <div class="success-icon">✓</div>
        <h2 style="font-family:'Noto Serif SC',serif;font-size:24px;font-weight:600;margin-bottom:8px;">预约成功</h2>
        <p style="color:var(--muted);margin-bottom:28px;">学生档案已自动创建，Y4 报告生成后可在档案页查看。</p>
        <div style="background:var(--paper-2);border-radius:10px;padding:24px;text-align:left;margin-bottom:28px;max-width:420px;margin-left:auto;margin-right:auto;">
          <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
            <span style="color:var(--muted);font-size:13px;">学生</span>
            <strong id="successName" style="font-size:14px;">-</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
            <span style="color:var(--muted);font-size:13px;">时间</span>
            <strong id="successTime" style="font-size:14px;">-</strong>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="color:var(--muted);font-size:13px;">顾问</span>
            <strong id="successAdvisor" style="font-size:14px;">-</strong>
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="/students" class="btn btn-secondary">查看学生档案</a>
          <button class="btn btn-primary" onclick="resetBooking()">再预约一个</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const TIME_SLOTS = ['09:00', '09:30', '10:00', '10:30', '11:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00'];
    const SLOT_CAPACITY = 4;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    // Rule: must book at least 1 day in advance; window = 30 days
    const minDate = new Date(today);
    minDate.setDate(minDate.getDate() + 1);
    const maxDate = new Date(today);
    maxDate.setDate(maxDate.getDate() + 29);

    let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDate = null;
    let selectedTime = null;
    let slotData = []; // full slot data from API

    const dateGridEl = document.getElementById('dateGrid');
    const monthLabelEl = document.getElementById('monthLabel');
    const timeContentEl = document.getElementById('timeContent');
    const formSectionEl = document.getElementById('formSection');
    const timePanelTitle = document.getElementById('timePanelTitle');

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function dateToStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      monthLabelEl.textContent = year + '年 ' + monthNames[month];

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      let startDay = firstDay.getDay();
      if (startDay === 0) startDay = 7;
      startDay -= 1;

      dateGridEl.innerHTML = '';

      for (let i = 0; i < startDay; i++) {
        const empty = document.createElement('div');
        empty.style.visibility = 'hidden';
        dateGridEl.appendChild(empty);
      }

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const cellDate = new Date(year, month, d);
        cellDate.setHours(0, 0, 0, 0);
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        cell.innerHTML = '<span class="day">' + d + '</span>';

        if (cellDate < minDate || cellDate > maxDate) {
          cell.classList.add('disabled');
        } else {
          cell.onclick = function() { selectDate(cellDate, cell); };
        }

        if (selectedDate && isSameDay(cellDate, selectedDate)) {
          cell.classList.add('selected');
        }

        dateGridEl.appendChild(cell);
      }

      // Enable prev month nav if minDate is in an earlier month
      const minMonth = minDate.getFullYear() * 12 + minDate.getMonth();
      const curMonth = year * 12 + month;
      document.getElementById('prevMonth').disabled = (curMonth <= minMonth);
      // Enable next month nav if maxDate is in a later month
      const maxMonth = maxDate.getFullYear() * 12 + maxDate.getMonth();
      document.getElementById('nextMonth').disabled = (curMonth >= maxMonth);
    }

    function changeMonth(delta) {
      currentMonth.setMonth(currentMonth.getMonth() + delta);
      renderCalendar();
    }

    async function selectDate(d, cellEl) {
      document.querySelectorAll('.date-cell').forEach(function(c) { c.classList.remove('selected'); });
      cellEl.classList.add('selected');
      selectedDate = d;
      selectedTime = null;
      formSectionEl.classList.remove('visible');
      sessionStorage.setItem('booking_date', dateToStr(d));

      timePanelTitle.textContent = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });
      timeContentEl.innerHTML = '<div class="no-slots">加载中…</div>';

      try {
        const resp = await fetch('/api/availability?date=' + dateToStr(d));
        const data = await resp.json();
        slotData = [];
        if (data.ok && data.slots) {
          slotData = data.slots;
        }
        renderTimeSlots();
      } catch (e) {
        timeContentEl.innerHTML = '<div class="no-slots">加载失败，请重试</div>';
      }
    }

    function renderTimeSlots() {
      const openSlots = slotData.filter(function(s) { return s.is_open; });
      if (openSlots.length === 0) {
        timeContentEl.innerHTML = '<div class="no-slots">该日暂无可预约时间<br><span style="font-size:12px;">请联系管理员开放时段</span></div>';
        return;
      }

      let html = '<div class="time-grid">';
      slotData.forEach(function(s) {
        const ts = s.time_slot;
        const isOpen = s.is_open;
        const isFull = s.booked_count >= s.capacity;
        const hasBookings = s.booked_count > 0;

        let cls = 'time-slot-btn';
        let click = '';
        if (!isOpen) {
          cls += ' disabled';
        } else if (isFull) {
          cls += ' full';
        } else {
          click = ' onclick="selectTime(\'' + ts + '\')"';
          if (selectedTime === ts) cls += ' selected';
        }
        if (hasBookings && !cls.includes('selected')) cls += ' has-bookings';

        const countLabel = isOpen ? (s.booked_count + '/' + s.capacity + ' 已约') : '关闭';
        html += '<div class="' + cls + '" data-time="' + ts + '"' + click + '>' + ts + '<span class="slot-count">' + countLabel + '</span></div>';
      });
      html += '</div>';
      timeContentEl.innerHTML = html;
    }

    function selectTime(t) {
      document.querySelectorAll('.time-slot-btn').forEach(function(b) { b.classList.remove('selected'); });
      const btn = document.querySelector('.time-slot-btn[data-time="' + t + '"]');
      if (btn) btn.classList.add('selected');
      selectedTime = t;
      sessionStorage.setItem('booking_time', t);

      document.getElementById('summaryDate').textContent = selectedDate.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      document.getElementById('summaryTime').textContent = t;
      formSectionEl.classList.add('visible');
      formSectionEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function submitBooking() {
      const name = document.getElementById('studentName').value.trim();
      const notes = document.getElementById('notes').value.trim();
      const advisorName = document.getElementById('advisorName').value.trim();
      const school = document.getElementById('school').value.trim();
      const singleParent = document.getElementById('singleParent').checked;

      if (!name) { alert('请填写学生姓名'); return; }
      if (!selectedDate) { alert('请选择日期'); return; }
      if (!selectedTime) { alert('请选择时间'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>提交中...';

      const apptTime = dateToStr(selectedDate) + 'T' + selectedTime + ':00';

      try {
        const resp = await fetch('/api/booking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_name: name,
            appointment_time: apptTime,
            notes: notes,
            advisor_name: advisorName,
            school: school,
            single_parent: singleParent,
          }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '提交失败');

        document.getElementById('successName').textContent = name;
        document.getElementById('successTime').textContent = selectedDate.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' }) + ' ' + selectedTime;
        document.getElementById('successAdvisor').textContent = advisorName || '-';

        document.getElementById('bookingView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';

        sessionStorage.removeItem('booking_date');
        sessionStorage.removeItem('booking_time');
      } catch (e) {
        alert('提交失败：' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '确认预约';
      }
    }

    function resetBooking() {
      document.getElementById('successView').style.display = 'none';
      document.getElementById('bookingView').style.display = 'block';
      document.getElementById('studentName').value = '';
      document.getElementById('advisorName').value = '';
      document.getElementById('school').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('singleParent').checked = false;
      selectedDate = null;
      selectedTime = null;
      formSectionEl.classList.remove('visible');
      timeContentEl.innerHTML = '<div class="no-slots">请先在左侧选择一个日期</div>';
      timePanelTitle.textContent = '选择时间';
      renderCalendar();
    }

    (function initNav() {
      const path = window.location.pathname;
      document.querySelectorAll('.topbar-nav a').forEach(function(a) {
        if (a.dataset.path === path) a.classList.add('active');
      });
    })();

    renderCalendar();
  </script>
</body>
</html>
