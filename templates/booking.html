<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预约测评 · 凭远 APP·ARK</title>
  <style>
    :root { --red:#E2001A; --ink:#111; --ink2:#333; --mute:#6B6B6B; --line:#E4E4E4; --sunk:#F4F4F4; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:#fff; color:var(--ink);
      font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
      font-size:15px; line-height:1.5; }
    button, input, textarea { font:inherit; color:inherit; border-radius:0; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

    .bar { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:2px solid var(--ink); }
    .crest { width:32px; height:32px; background:var(--red); flex:none; display:flex; align-items:center; justify-content:center; }
    .crest img { width:24px; height:24px; display:block; }
    .bar b { font-size:15px; font-weight:800; letter-spacing:.02em; }
    .bar .loc { margin-left:auto; font-size:13px; font-weight:600; color:var(--ink2); }

    .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
    h1 { margin:0 0 4px; font-size:26px; font-weight:800; letter-spacing:-.01em; line-height:1.2; }
    h2 { margin:20px 0 8px; font-size:13px; font-weight:700; color:var(--mute); letter-spacing:.04em; }
    .sub { margin:0 0 16px; color:var(--mute); font-size:13px; }
    .back { background:none; border:0; padding:8px 0; margin:0 0 4px; font-size:13px; font-weight:600; color:var(--ink2); min-height:44px; }

    .opts { display:grid; gap:8px; margin-top:12px; }
    .opt { display:flex; align-items:center; justify-content:space-between; min-height:56px; padding:0 14px; background:#fff;
      border:1px solid var(--ink); font-size:17px; font-weight:700; text-align:left; }
    .opt:hover { background:var(--sunk); }

    .dstrip { display:flex; gap:4px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
    .dstrip button { flex:none; width:54px; min-height:64px; padding:6px 0; background:#fff; border:1px solid var(--line);
      text-align:center; font-size:12px; line-height:1.25; color:var(--mute); scroll-snap-align:start; }
    .dstrip b { display:block; font-size:18px; color:var(--ink); font-weight:700; }
    .dstrip small { display:block; font-size:12px; min-height:15px; color:var(--mute); }
    .dstrip button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
    .dstrip button.on b, .dstrip button.on small { color:#fff; }
    .dstrip button[disabled] { opacity:.35; cursor:not-allowed; }

    .tms { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; }
    .tms button { min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px;
      background:#fff; border:1px solid var(--ink); font-size:15px; font-weight:700; line-height:1.2; }
    .tms small { font-size:12px; font-weight:400; color:var(--mute); }
    .tms button:hover:not([disabled]) { background:var(--sunk); }
    .tms button.on { background:var(--red); border-color:var(--red); color:#fff; }
    .tms button.on small { color:#fff; }
    .tms button[disabled] { cursor:not-allowed; border-color:var(--line); color:var(--mute); background:#fff; }
    .tms button.off[disabled] { background:repeating-linear-gradient(135deg, var(--line) 0 2px, #fff 2px 7px); }
    .none { padding:20px 0; color:var(--mute); font-size:13px; }

    .go { width:100%; min-height:50px; margin-top:18px; border:0; background:var(--red); color:#fff; font-size:16px; font-weight:700; }
    .go[disabled] { opacity:.4; cursor:not-allowed; }

    .sum { padding:12px 14px; margin:0 0 16px; border:1px solid var(--ink); font-weight:700; }
    .sum small { display:block; font-weight:400; color:var(--mute); font-size:13px; }
    label.f { display:block; margin:0 0 14px; font-size:13px; font-weight:600; color:var(--ink2); }
    label.f input[type=text], label.f textarea { display:block; width:100%; margin-top:5px; padding:10px 12px; border:1px solid var(--ink);
      background:#fff; font-size:16px; font-weight:400; color:var(--ink); }
    label.f input[type=text] { min-height:46px; }
    .req { color:var(--red); }
    .chk { display:flex; align-items:center; gap:10px; min-height:44px; margin:0 0 14px; font-size:15px; }
    .chk input { width:20px; height:20px; margin:0; accent-color:var(--red); }
    .msg { margin:12px 0 0; padding:10px 12px; border:1px solid #F5C8C8; background:#FDECEC; color:#B3001B; font-size:13px; }

    .ok { border-top:4px solid var(--red); padding-top:18px; }
    .ok h1 { font-size:32px; }
    .ok dl { margin:16px 0; border-top:1px solid var(--ink); }
    .ok dl div { display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); }
    .ok dt { color:var(--mute); font-size:13px; }
    .ok dd { margin:0; font-weight:700; text-align:right; }
    .ghost { width:100%; min-height:48px; background:#fff; border:1px solid var(--ink); font-size:15px; font-weight:700; }

    @media (min-width:640px) {
      .wrap { padding-top:36px; }
      h1 { font-size:32px; }
      .tms { grid-template-columns:repeat(4, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <header class="bar">
    <span class="crest"><img src="/m1/assets/login_crest_white.png" alt="" onerror="this.style.display='none'"></span>
    <b>凭远 APP·ARK</b>
    <span class="loc" id="locName"></span>
  </header>

  <main class="wrap" id="app" aria-live="polite"></main>

  <script>
    (function () {
      var TIMES = ['09:00','09:30','10:00','10:30','11:00','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00'];
      var WD = ['周日','周一','周二','周三','周四','周五','周六'];
      var app = document.getElementById('app');
      var locNameEl = document.getElementById('locName');
      var S = { offices: [], loc: null, fixedLoc: false, step: 'office', date: null, time: null,
                slots: null, monthOk: {}, error: '', busy: false, done: null };

      function esc(v) { var d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
      function human(k) { var d = parseKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WD[d.getDay()]; }
      function locName() { return S.loc ? S.loc.name : ''; }
      function getJSON(url) { return fetch(url).then(function (r) { return r.json().then(function (j) { return { ok: r.ok && j.ok, data: j }; }); }); }

      function days() {
        var out = [], t = new Date(); t.setHours(0, 0, 0, 0);
        for (var i = 1; i <= 29; i++) { var d = new Date(t); d.setDate(t.getDate() + i); out.push(d); }
        return out;
      }

      function setStep(step) { S.step = step; S.error = ''; render(); window.scrollTo(0, 0); }

      function loadMonth() {
        return getJSON('/api/availability/month?loc=' + S.loc.id).then(function (r) {
          S.monthOk = {};
          if (!r.ok) { return; }
          var data = r.data.data || {}, booked = r.data.bookings || {};
          days().forEach(function (d) {
            var k = dkey(d), rec = {};
            (data[k] || []).forEach(function (e) { rec[e.time_slot] = e.is_available; });
            S.monthOk[k] = TIMES.some(function (t) {
              var open = rec[t] === undefined ? true : rec[t];
              return open && ((booked[k] || {})[t] || 0) < 4;
            });
          });
        });
      }

      function loadSlots() {
        S.slots = null; render();
        var k = S.date;
        getJSON('/api/availability?date=' + k + '&loc=' + S.loc.id).then(function (r) {
          if (S.date !== k) { return; }
          if (!r.ok) { S.slots = []; S.error = (r.data && r.data.error) || '加载失败，请重试'; }
          else { S.slots = r.data.slots || []; }
          render();
        }).catch(function () { if (S.date === k) { S.slots = []; S.error = '加载失败，请重试'; render(); } });
      }

      function chooseLoc(loc) {
        S.loc = loc; S.date = null; S.time = null; S.slots = null;
        locNameEl.textContent = loc.name;
        loadMonth().then(function () { setStep('pick'); });
      }

      function viewOffice() {
        return '<h1>预约测评</h1><p class="sub">请选择办公室。</p><div class="opts">' +
          S.offices.map(function (o) { return '<button class="opt" data-act="loc" data-id="' + o.id + '">' + esc(o.name) + '<span aria-hidden="true">›</span></button>'; }).join('') +
          '</div>';
      }

      function viewPick() {
        var strip = days().map(function (d, i) {
          var k = dkey(d), ok = S.monthOk[k] !== false;
          var m = (i === 0 || d.getDate() === 1) ? (d.getMonth() + 1) + '月' : '';
          return '<button data-act="date" data-k="' + k + '"' + (ok ? '' : ' disabled') + (S.date === k ? ' class="on"' : '') + '>' +
            '<small>' + m + '</small>' + WD[d.getDay()] + '<b>' + d.getDate() + '</b></button>';
        }).join('');
        var times;
        if (!S.date) { times = '<p class="none">请先选择日期。</p>'; }
        else if (S.slots === null) { times = '<p class="none">加载中…</p>'; }
        else if (!S.slots.length) { times = '<p class="none">当天没有可显示的时段。</p>'; }
        else {
          times = '<div class="tms">' + S.slots.map(function (s) {
            var t = s.time_slot, full = s.is_open && s.booked_count >= s.capacity;
            if (!s.is_open) { return '<button class="off" disabled>' + t + '<small>未开放</small></button>'; }
            if (full) { return '<button disabled>' + t + '<small>已满</small></button>'; }
            return '<button data-act="time" data-t="' + t + '"' + (S.time === t ? ' class="on"' : '') + '>' + t + '</button>';
          }).join('') + '</div>';
        }
        return (S.fixedLoc ? '' : '<button class="back" data-act="toOffice">‹ 更换办公室</button>') +
          '<h1>选择日期和时间</h1><p class="sub">需提前一天预约，可选未来 30 天。</p>' +
          '<h2>日期</h2><div class="dstrip">' + strip + '</div><h2>时间</h2>' + times +
          (S.error ? '<p class="msg" role="alert">' + esc(S.error) + '</p>' : '') +
          '<button class="go" data-act="toForm"' + (S.date && S.time ? '' : ' disabled') + '>下一步</button>';
      }

      function viewForm() {
        return '<button class="back" data-act="toPick">‹ 返回</button><h1>填写信息</h1>' +
          '<p class="sum">' + esc(human(S.date)) + ' ' + esc(S.time) + '<small>' + esc(locName()) + '</small></p>' +
          '<form id="f" novalidate>' +
          '<label class="f" for="fName">学生姓名 <span class="req">*</span><input type="text" id="fName" autocomplete="off" maxlength="100"></label>' +
          '<label class="f" for="fSchool">学校<input type="text" id="fSchool" autocomplete="off" maxlength="200"></label>' +
          '<label class="f" for="fAdv">顾问<input type="text" id="fAdv" autocomplete="off" maxlength="100"></label>' +
          '<label class="chk" for="fSingle"><input type="checkbox" id="fSingle"> 单亲家庭/离异</label>' +
          '<label class="f" for="fNotes">备注<textarea id="fNotes" rows="2"></textarea></label>' +
          (S.error ? '<p class="msg" role="alert">' + esc(S.error) + '</p>' : '') +
          '<button class="go" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '提交中…' : '确认预约') + '</button></form>';
      }

      function viewDone() {
        var d = S.done;
        return '<div class="ok"><h1>已预约</h1><dl>' +
          '<div><dt>办公室</dt><dd>' + esc(d.loc) + '</dd></div>' +
          '<div><dt>日期</dt><dd>' + esc(human(d.date)) + '</dd></div>' +
          '<div><dt>时间</dt><dd>' + esc(d.time) + '</dd></div>' +
          '<div><dt>学生</dt><dd>' + esc(d.name) + '</dd></div></dl>' +
          '<button class="ghost" data-act="again">再预约一位</button></div>';
      }

      function render() {
        var keep = {};
        ['fName', 'fSchool', 'fAdv', 'fNotes'].forEach(function (id) { var el = document.getElementById(id); if (el) { keep[id] = el.value; } });
        var sg = document.getElementById('fSingle'); if (sg) { keep.fSingle = sg.checked; }
        app.innerHTML = S.step === 'office' ? viewOffice() : S.step === 'pick' ? viewPick() : S.step === 'form' ? viewForm() : viewDone();
        Object.keys(keep).forEach(function (id) { var el = document.getElementById(id); if (el) { if (id === 'fSingle') { el.checked = keep[id]; } else { el.value = keep[id]; } } });
        var f = document.getElementById('f');
        if (f) { f.addEventListener('submit', submit); }
      }

      function submit(e) {
        e.preventDefault();
        if (S.busy) { return; }
        var name = document.getElementById('fName').value.trim();
        if (!name) { S.error = '请填写学生姓名'; render(); return; }
        var body = { student_name: name, school: document.getElementById('fSchool').value.trim(),
          advisor_name: document.getElementById('fAdv').value.trim(), notes: document.getElementById('fNotes').value.trim(),
          single_parent: document.getElementById('fSingle').checked, location_id: S.loc.id,
          appointment_time: S.date + 'T' + S.time + ':00' };
        S.busy = true; S.error = ''; render();
        fetch('/api/booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok && j.ok, data: j }; }); })
          .then(function (r) {
            S.busy = false;
            if (!r.ok) {
              S.error = (r.data && r.data.error) || '提交失败，请重试';
              if (/已满|已关闭/.test(S.error)) { S.time = null; S.step = 'pick'; loadMonth().then(loadSlots); return; }
              render(); return;
            }
            S.done = { loc: locName(), date: S.date, time: S.time, name: name };
            S.step = 'done'; render(); window.scrollTo(0, 0);
          })
          .catch(function () { S.busy = false; S.error = '网络错误，请重试'; render(); });
      }

      app.addEventListener('click', function (e) {
        var el = e.target.closest('[data-act]'); if (!el || el.disabled) { return; }
        var a = el.getAttribute('data-act');
        if (a === 'loc') {
          var id = +el.getAttribute('data-id');
          chooseLoc(S.offices.filter(function (o) { return o.id === id; })[0]);
        } else if (a === 'date') { S.date = el.getAttribute('data-k'); S.time = null; S.error = ''; loadSlots(); }
        else if (a === 'time') { S.time = el.getAttribute('data-t'); render(); }
        else if (a === 'toForm') { setStep('form'); }
        else if (a === 'toPick') { setStep('pick'); }
        else if (a === 'toOffice') { S.loc = null; locNameEl.textContent = ''; setStep('office'); }
        else if (a === 'again') {
          S.date = null; S.time = null; S.slots = null; S.done = null;
          loadMonth().then(function () { setStep('pick'); });
        }
      });

      var want = new URLSearchParams(location.search).get('loc');
      getJSON('/api/locations').then(function (r) {
        S.offices = (r.ok && r.data.locations) || [];
        if (!S.offices.length) { app.innerHTML = '<h1>预约测评</h1><p class="sub">暂时无法预约。</p>'; return; }
        var pre = want ? S.offices.filter(function (o) { return String(o.id) === want; })[0] : null;
        if (pre) { S.fixedLoc = true; chooseLoc(pre); }
        else if (S.offices.length === 1) { S.fixedLoc = true; chooseLoc(S.offices[0]); }
        else { render(); }
      }).catch(function () { app.innerHTML = '<h1>预约测评</h1><p class="sub">加载失败，请刷新重试。</p>'; });
    })();
  </script>
</body>
</html>
