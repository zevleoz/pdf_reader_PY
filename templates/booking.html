<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>预约测评 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">凭远教育</span>
      <span class="brand-name" style="font-size:13px;font-weight:500;">Y4<span style="color:var(--red)">测评</span></span>
    </div>
    <nav class="topbar-nav">
      <a href="/" data-path="/">← 主页</a>
      <a href="/admin/bookings" data-path="/admin/bookings">预约管理</a>
      <a href="/students" data-path="/students">学生档案</a>
      <a href="/generate" data-path="/generate">报告生成</a>
    </nav>
  </header>

  <main class="container container-narrow">
    <h1 class="page-title">预约 Y4 测评</h1>
    <p class="page-subtitle">请填写以下信息为学生预约一个测评时间。</p>

    <div class="hint">
      完成预约后，学生的信息将自动录入系统。学生完成测评后，上传 4 份 PDF 即可自动生成报告并归档。
    </div>

    <div class="card" id="bookingCard">
      <div class="field">
        <label class="field-label" for="studentName">学生姓名 <span class="required">*</span></label>
        <input type="text" id="studentName" placeholder="请输入学生姓名" />
      </div>
      <div class="field">
        <label class="field-label" for="advisorName">顾问名字</label>
        <input type="text" id="advisorName" placeholder="请输入顾问名字" />
      </div>
      <div class="field">
        <label class="field-label" for="school">学校</label>
        <input type="text" id="school" placeholder="请输入学校名称" />
      </div>
      <div class="field">
        <label class="field-label" for="studentEmail">联系邮箱</label>
        <input type="email" id="studentEmail" placeholder="家长或学生邮箱" />
      </div>
      <div class="field">
        <label class="field-label" for="studentPhone">联系电话</label>
        <input type="tel" id="studentPhone" placeholder="联系电话" />
      </div>
      <div class="field">
        <label class="field-label" for="apptDate">预约日期 <span class="required">*</span></label>
        <input type="date" id="apptDate" />
      </div>
      <div class="field">
        <label class="field-label">预约时间 <span class="required">*</span></label>
        <div class="time-slots" id="timeSlots"></div>
      </div>
      <div class="field">
        <label class="field-label" for="notes">备注</label>
        <textarea id="notes" rows="2" placeholder="如有特殊要求请说明"></textarea>
      </div>
      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="singleParent" />
          <label for="singleParent">单亲家庭/离异</label>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" id="submitBtn" onclick="submitBooking()">提交预约</button>
    </div>

    <div id="result"></div>
  </main>

  <script>
    const TIME_SLOTS = ['09:00', '09:30', '10:00', '10:30', '11:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00'];
    let selectedTime = null;

    const todayStr = new Date().toISOString().split('T')[0];
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    const dateInput = document.getElementById('apptDate');
    dateInput.min = todayStr;

    const savedDate = sessionStorage.getItem('booking_date');
    if (savedDate) {
      dateInput.value = savedDate;
    } else {
      dateInput.value = tomorrowStr;
    }

    const savedTime = sessionStorage.getItem('booking_time');
    if (savedTime) {
      selectedTime = savedTime;
    }

    const slotsEl = document.getElementById('timeSlots');

    function renderTimeSlots(disabledSet) {
      slotsEl.innerHTML = '';
      TIME_SLOTS.forEach(function(t) {
        const div = document.createElement('div');
        div.className = 'time-slot';
        div.textContent = t;

        if (disabledSet && disabledSet.has(t)) {
          div.classList.add('disabled');
        }

        if (selectedTime === t) {
          div.classList.add('selected');
        }

        div.onclick = function() {
          if (div.classList.contains('disabled')) return;
          document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
          div.classList.add('selected');
          selectedTime = t;
          sessionStorage.setItem('booking_time', t);
        };
        slotsEl.appendChild(div);
      });
    }

    async function fetchAvailability(date) {
      try {
        const resp = await fetch('/api/availability?date=' + date);
        if (!resp.ok) return null;
        const data = await resp.json();
        if (data && Array.isArray(data.available)) {
          const disabledSlots = TIME_SLOTS.filter(function(t) { return !data.available.includes(t); });
          return new Set(disabledSlots);
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function loadAvailabilityAndRender() {
      const date = dateInput.value;
      const disabledSet = await fetchAvailability(date);
      renderTimeSlots(disabledSet);
    }

    dateInput.addEventListener('change', function() {
      const date = dateInput.value;
      sessionStorage.setItem('booking_date', date);
      selectedTime = null;
      sessionStorage.removeItem('booking_time');
      loadAvailabilityAndRender();
    });

    loadAvailabilityAndRender();

    async function submitBooking() {
      const name = document.getElementById('studentName').value.trim();
      const date = document.getElementById('apptDate').value;
      const email = document.getElementById('studentEmail').value.trim();
      const phone = document.getElementById('studentPhone').value.trim();
      const notes = document.getElementById('notes').value.trim();
      const advisorName = document.getElementById('advisorName').value.trim();
      const school = document.getElementById('school').value.trim();
      const singleParent = document.getElementById('singleParent').checked;
      const resultEl = document.getElementById('result');

      if (!name) { alert('请填写学生姓名'); return; }
      if (!date) { alert('请选择日期'); return; }
      if (!selectedTime) { alert('请选择时间'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>提交中...';

      const apptTime = date + 'T' + selectedTime + ':00';

      try {
        const resp = await fetch('/api/booking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_name: name,
            student_email: email,
            student_phone: phone,
            appointment_time: apptTime,
            notes: notes,
            advisor_name: advisorName,
            school: school,
            single_parent: singleParent,
          }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '提交失败');

        resultEl.innerHTML = '<div class="success">✓ 预约成功！<br><br>学生：<strong>' + name + '</strong><br>时间：' + date + ' ' + selectedTime + '<br><br>可将此页面分享给家长，学生完成测评后即可上传 PDF 生成报告。</div>';
        document.getElementById('bookingCard').style.display = 'none';

        sessionStorage.removeItem('booking_date');
        sessionStorage.removeItem('booking_time');
      } catch (e) {
        alert('提交失败：' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '提交预约';
      }
    }

    (function initNav() {
      const path = window.location.pathname;
      document.querySelectorAll('.topbar-nav a').forEach(function(a) {
        if (a.dataset.path === path) {
          a.classList.add('active');
        }
      });
    })();
  </script>
</body>
</html>
