<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内部下载 — Y4 综合测评系统</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app_shell.css">
  <style>
    /* —— 纵向全宽堆叠布局 —— */
    .lab-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 18px 20px;
      max-width: 1680px;
      margin: 0 auto;
    }
    .lab-section {
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .lab-sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px 10px;
      flex-wrap: wrap;
    }
    .lab-sec-title-wrap { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .lab-sec-head h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
    }
    .prompt-textarea {
      width: 100%;
      height: 100%;
      min-height: 400px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      background: var(--paper);
      color: var(--ink);
    }
    .prompt-textarea:focus {
      outline: 2px solid var(--red);
      outline-offset: -1px;
    }
    .output-content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink);
    }
    .output-content h1, .output-content h2, .output-content h3 {
      color: var(--red-deep);
      margin: 12px 0 6px;
    }
    .output-content strong { color: var(--ink); }
    .output-content ul, .output-content ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .output-content li { margin: 4px 0; }
    .output-content p { margin: 8px 0; }
    .output-meta {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 12px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      gap: 16px;
    }
    .output-meta span { white-space: nowrap; }
    .star-rating {
      display: flex;
      gap: 4px;
      font-size: 24px;
      cursor: pointer;
    }
    .star {
      color: var(--line);
      transition: color 0.2s;
      user-select: none;
    }
    .star.active { color: var(--red); }
    .star:hover { color: var(--red-deep); }
    .feedback-textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
    }
    .feedback-textarea:focus {
      outline: 2px solid var(--red);
      outline-offset: -1px;
    }
    .diff-box {
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink-2);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .history-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 6px 0;
    }
    .history-tab {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      transition: all 0.2s;
    }
    .history-tab.active {
      background: var(--red);
      color: var(--white);
      border-color: var(--red);
    }
    .history-tab:hover:not(.active) {
      border-color: var(--red);
      color: var(--red);
    }
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 14px;
    }
    .lab-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .lab-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .lab-topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .lab-topbar-divider { width: 1px; height: 22px; background: var(--line-soft); }
    .lab-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin-right: 4px;
    }
    /* 学生选择器（combobox） */
    .stu-picker { position: relative; }
    .stu-picker-btn {
      display: flex; align-items: center; gap: 8px;
      border: 1.5px solid var(--line); background: var(--white); color: var(--ink);
      font-family: inherit; font-size: 13px; padding: 8px 14px; border-radius: 9px;
      cursor: pointer; min-width: 150px;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .stu-picker-btn:hover, .stu-picker-btn.has-value { border-color: var(--ink); }
    .stu-picker-btn:focus-visible {
      outline: none; border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(179, 58, 58, .12);
    }
    .stu-picker-btn .stu-picker-label { flex: 1; text-align: left; font-weight: 600; white-space: nowrap; }
    .stu-picker-btn svg { color: var(--muted); flex-shrink: 0; }
    .stu-picker-btn .stu-caret { transition: transform .2s var(--ease); }
    .stu-picker.open .stu-caret { transform: rotate(180deg); }
    .stu-picker-panel {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
      width: 320px; max-width: 86vw;
      background: var(--white); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
      display: none; overflow: hidden;
    }
    .stu-picker-panel.open { display: block; }
    .stu-picker-panel .stu-picker-search {
      width: 100%; border: none; border-bottom: 1px solid var(--line-soft);
      padding: 10px 14px; font-size: 13px; outline: none; font-family: inherit;
      color: var(--ink); background: var(--paper-2); box-sizing: border-box;
    }
    .stu-picker-list { max-height: 300px; overflow-y: auto; padding: 6px; }
    .stu-option {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      width: 100%; border: none; background: transparent; text-align: left;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
      transition: background .15s var(--ease);
    }
    .stu-option:hover { background: var(--paper-2); }
    .stu-option.active { background: #FEF2F2; }
    .stu-option-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .stu-option-meta { font-size: 11.5px; color: var(--muted); }
    .stu-picker-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 12px; }
    /* 报告切换 chip */
    .report-chip-wrap { position: relative; }
    .report-chip {
      display: flex; align-items: center; gap: 6px;
      border: 1px dashed var(--line); background: var(--paper-2); color: var(--ink-2);
      font-family: inherit; font-size: 12px; padding: 7px 12px;
      border-radius: 999px; cursor: pointer; white-space: nowrap;
      transition: border-color .2s var(--ease), color .2s var(--ease);
    }
    .report-chip:hover { border-color: var(--red); color: var(--red); }
    .report-menu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 230px;
      background: var(--white); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
      display: none; padding: 5px; max-height: 280px; overflow-y: auto;
    }
    .report-menu.open { display: block; }
    .report-option {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
      border: none; background: transparent; font-family: inherit; font-size: 12.5px; color: var(--ink);
      padding: 7px 10px; border-radius: 7px; cursor: pointer; text-align: left;
    }
    .report-option:hover { background: var(--paper-2); }
    .report-option.active { background: #FEF2F2; color: var(--red); font-weight: 600; }
    .report-latest {
      font-size: 10px; color: var(--red); border: 1px solid var(--red);
      border-radius: 4px; padding: 0 5px; flex-shrink: 0;
    }
    /* AI 解读动态 section */
    .ai-head {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px; cursor: pointer; user-select: none;
      transition: background .15s var(--ease);
    }
    .ai-head:hover { background: var(--paper-2); }
    .ai-head-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .ai-head-state { font-size: 12px; color: var(--muted); }
    .ai-head-state.is-running { color: var(--red); }
    .ai-head-arrow {
      margin-left: auto; color: var(--muted); font-size: 11px;
      transition: transform .2s var(--ease);
    }
    .ai-collapsed .ai-head-arrow { transform: rotate(-90deg); }
    .ai-body { border-top: 1px solid var(--line-soft); padding: 12px 16px; }
    .ai-collapsed .ai-body { display: none; }
    .ai-output { max-height: 46vh; overflow-y: auto; }
    .lab-version {
      font-size: 12px;
      color: var(--muted);
      padding: 2px 8px;
      background: var(--paper-2);
      border-radius: 4px;
    }
    .lab-status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    .lab-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .lab-status.idle .dot { background: var(--muted); }
    .lab-status.running .dot { background: var(--red); animation: pulse 1s ease-in-out infinite; }
    .lab-status.done .dot { background: #16A34A; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn-sm {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      transition: all 0.2s;
    }
    .btn-sm:hover { border-color: var(--red); color: var(--red); }
    .btn-sm.primary {
      background: var(--red);
      color: var(--white);
      border: 1.5px solid var(--red);
      box-shadow: 0 1px 2px rgba(140, 40, 40, .28);
    }
    .btn-sm.primary:hover:not(:disabled) {
      background: var(--red-deep);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(140, 40, 40, .22);
    }
    .btn-sm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .prompt-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      background: var(--paper);
      color: var(--ink);
      margin-bottom: 8px;
    }
    .prompt-input:focus {
      outline: 2px solid var(--red);
      outline-offset: -1px;
    }
    .label-sm {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(250, 247, 242, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 12px;
    }
    .loading-overlay span {
      font-size: 14px;
      color: var(--red);
    }
    /* 有效评价视图 — 单行控制条 */
    .eval-toolbar {
      border-top: 1px solid var(--line-soft);
    }
    .eval-toolbar-main {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 9px 16px;
    }
    .eval-search-wrap { position: relative; width: 240px; flex-shrink: 0; }
    .eval-search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--muted); display: flex; pointer-events: none;
    }
    .eval-search {
      width: 100%;
      border: 1.5px solid transparent; border-radius: 9px;
      padding: 7px 12px 7px 32px; font-size: 12.5px; background: var(--paper-2); color: var(--ink);
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
      outline: none; font-family: inherit;
    }
    .eval-search:focus { background: var(--white); border-color: var(--ink); }
    .eval-search::placeholder { color: var(--muted); }
    .eval-counts {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin-left: auto;
      font-size: 11px; color: var(--muted);
    }
    .eval-meta-item { white-space: nowrap; }
    .eval-meta-item b { color: var(--ink); font-weight: 700; margin-left: 3px; }
    .eval-meta-item.is-adjusted b { color: var(--red); }

    .eval-area { height: calc(100vh - 252px); min-height: 420px; overflow-y: auto; overflow-x: auto; padding: 10px 12px; }
    .eval-dim-group { margin-bottom: 4px; }
    .eval-dim-head {
      position: sticky; top: 0; background: var(--paper); padding: 8px 12px;
      font-size: 11px; font-weight: 700; color: var(--red-deep); letter-spacing: 0.3px;
      border-bottom: 1px solid var(--line-soft); z-index: 3; cursor: pointer;
      display: flex; align-items: center; gap: 6px; margin-top: 2px;
    }
    .eval-dim-head .arrow { font-size: 8px; transition: transform 0.25s var(--ease); display: inline-block; }
    .eval-dim-head.collapsed .arrow { transform: rotate(-90deg); }
    .eval-dim-count { color: var(--muted); font-weight: 500; font-size: 10px; margin-left: auto; }
    .eval-dim-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 6px; padding-top: 6px; align-items: start; }
    .eval-dim-group.dim-collapsed .eval-dim-body { display: none; }

    .eval-footer {
      padding: 8px 14px; border-top: 1px solid var(--line); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--white); flex-wrap: wrap;
    }
    .eval-checkbox { font-size: 11px; color: var(--ink); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .eval-checkbox input { width: 14px; height: 14px; accent-color: var(--ink); cursor: pointer; }
    .eval-dl-btn {
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      background: var(--ink); color: var(--white); border: none; cursor: pointer;
      transition: all 0.2s var(--ease); display: inline-flex; align-items: center; gap: 5px;
    }
    .eval-dl-btn:hover { background: var(--red); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(179,58,58,0.25); }
    .eval-dl-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .eval-filter-toggle {
      font-size: 11px; padding: 4px 12px; border-radius: 16px; cursor: pointer;
      border: 1px solid var(--line-soft); background: var(--white); color: var(--muted);
      transition: all 0.2s var(--ease); user-select: none;
    }
    .eval-filter-toggle.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .eval-filter-toggle:hover:not(.active) { border-color: var(--ink); color: var(--ink); }

    /* 视图切换 */
    .eval-view-toggle { display: flex; gap: 4px; }
    .eval-view-btn {
      padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--line-soft); background: var(--white);
      color: var(--muted); transition: all 0.2s var(--ease);
    }
    .eval-view-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .eval-view-btn:hover:not(.active) { border-color: var(--ink); color: var(--ink); }

    /* 卡片式行 — 固定列对齐 */
    .eval-card {
      background: var(--white); border: 1px solid var(--line-soft); border-radius: 8px;
      padding: 7px 12px; transition: all 0.2s var(--ease);
      border-left: 2.5px solid transparent;
    }
    .eval-card:hover { box-shadow: 0 2px 8px rgba(20,20,20,0.05); border-color: var(--line); }
    .eval-card.adjusted { border-left-color: var(--red); background: #fffbfb; }
    .eval-card.bias-high { border-left-color: #f59e0b; }
    .eval-card.bias-low { border-left-color: #6366f1; }
    /* 主行：编号 | 名称 | 来源 | 原始值 | 评价 | 操作 */
    .eval-card-main {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto 62px 84px auto;
      align-items: center;
      gap: 8px;
    }
    .eval-card-code {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
      background: var(--paper-2); padding: 2px 5px; border-radius: 3px;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .eval-card-label {
      font-size: 12.5px; color: var(--ink); font-weight: 500; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* E4 归属签：仅 E4 视图渲染，统一中性色 */
    .eval-card-e4row { display: flex; gap: 4px; flex-wrap: wrap; margin: 5px 0 0 62px; }
    .eval-card-e4row:empty { display: none; }
    .eval-card-e4tag {
      font-size: 9px; padding: 1px 7px; border-radius: 8px; font-weight: 600;
      background: rgba(15, 23, 42, .07); color: #475569; white-space: nowrap;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    }
    .eval-card-raw {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2);
      font-weight: 600; text-align: right; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .eval-card-eval {
      font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
      text-align: center; white-space: nowrap;
    }
    .eval-card-eval.高 { background: #d1fae5; color: #065f46; }
    .eval-card-eval.较好 { background: #d1fae5; color: #065f46; }
    .eval-card-eval.不低 { background: #e0e7ff; color: #3730a3; }
    .eval-card-eval.正常 { background: #e0e7ff; color: #3730a3; }
    .eval-card-eval.相对健康 { background: #d1fae5; color: #065f46; }
    .eval-card-eval.偏低 { background: #fef3c7; color: #92400e; }
    .eval-card-eval.需关注 { background: #fef3c7; color: #92400e; }
    .eval-card-eval.明显偏低 { background: #fee2e2; color: #991b1b; }
    .eval-card-eval.需特殊关注 { background: #fee2e2; color: #991b1b; }
    .eval-card-eval.严重偏低 { background: #fee2e2; color: #991b1b; }
    .eval-card-eval.待判定 { background: var(--paper-2); color: var(--muted); }
    /* 卡内评价值 chip 按钮（点击弹居中选择层） */
    .eval-chip-btn {
      font-size: 12px; padding: 3px 0; border-radius: 6px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--line); background: var(--white); color: var(--ink);
      transition: all 0.15s var(--ease); white-space: nowrap; font-family: inherit; appearance: none;
      position: relative; width: 100%;
    }
    .eval-chip-btn:hover { border-color: var(--red); box-shadow: 0 0 0 2px rgba(179,58,58,0.12); }
    .eval-chip-btn.adjusted { border-color: var(--red); }
    .eval-chip-btn.高, .eval-chip-btn.较好, .eval-chip-btn.相对健康 { background: #d1fae5; color: #065f46; }
    .eval-chip-btn.不低, .eval-chip-btn.正常 { background: #e0e7ff; color: #3730a3; }
    .eval-chip-btn.偏低, .eval-chip-btn.需关注 { background: #fef3c7; color: #92400e; }
    .eval-chip-btn.明显偏低, .eval-chip-btn.需特殊关注, .eval-chip-btn.严重偏低 { background: #fee2e2; color: #991b1b; }
    .eval-chip-btn.待判定 { background: var(--paper-2); color: var(--muted); border-style: dashed; }
    .eval-chip-btn::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--white); padding: 4px 8px; border-radius: 4px; font-size: 10px;
      white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10;
    }
    .eval-chip-btn:hover::after { opacity: 1; }
    /* 来源签：统一中性灰，不做彩色区分；固定宽度保证列对齐 */
    .src-tag {
      font-size: 9px; padding: 2px 0; width: 42px; text-align: center;
      border-radius: 10px; white-space: nowrap; font-weight: 600;
      background: var(--paper-2); color: var(--muted);
    }
    .src-tag.pending { background: transparent; border: 1px dashed var(--line); }
    .eval-card-actions { display: flex; align-items: center; gap: 3px; justify-self: end; white-space: nowrap; }
    /* 带 tooltip 的操作按钮 — 默认弱化，仅 active/hover 显色 */
    .act-btn {
      position: relative; font-size: 10px; padding: 3px 7px; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--line-soft); background: var(--white); color: var(--muted);
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 3px;
    }
    .act-btn:hover { border-color: var(--ink); color: var(--ink); }
    .act-btn::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--white); padding: 4px 8px; border-radius: 4px; font-size: 10px;
      white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10;
    }
    .act-btn:hover::after { opacity: 1; }
    .act-btn.bias-high.active { background: #fffbeb; color: #b45309; border-color: #f59e0b; }
    .act-btn.bias-low.active { background: #eff6ff; color: #1d4ed8; border-color: #6366f1; }
    .act-btn.bias-normal.active { background: #f0fdf4; color: #15803d; border-color: #22c55e; }
    .act-btn.observation { background: #fffbeb; color: #b45309; border-color: #f59e0b; }
    .act-btn.problem-confirmed { background: transparent; color: var(--muted); border-color: var(--line-soft); }
    .eval-note-row {
      margin-top: 8px; display: flex; gap: 8px;
      animation: noteSlide 0.2s var(--ease);
    }
    .eval-note-row:not(.expanded) { display: none; }
    @keyframes noteSlide { from { opacity:0; transform: translateY(-4px) } to { opacity:1; transform: translateY(0) } }
    .eval-note-input {
      flex: 1; border: 1px solid var(--line-soft); border-radius: 6px;
      padding: 6px 10px; font-size: 11px; background: var(--paper); color: var(--ink);
      font-family: 'Inter', sans-serif; transition: border 0.2s var(--ease);
    }
    .eval-note-input:focus { outline: none; border-color: var(--ink); }
    .eval-note-input::placeholder { color: var(--muted); }
    .eval-note-toggle {
      font-size: 10px; color: var(--muted); cursor: pointer; padding: 4px 8px;
      border-radius: 4px; transition: all 0.15s; user-select: none; align-self: center;
    }
    .eval-note-toggle:hover { background: var(--paper-2); color: var(--ink); }
    .eval-note-toggle.has-note { color: var(--red); font-weight: 600; }

    /* ── 居中弹层系统（视口居中、完整可见） ─────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(20,20,20,0.4);
      display: none; align-items: center; justify-content: center; z-index: 200;
      padding: 24px; backdrop-filter: blur(2px);
    }
    .modal-backdrop.open { display: flex; animation: modalFade 0.15s var(--ease); }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--white); border-radius: 14px;
      box-shadow: 0 24px 64px rgba(20,20,20,0.28);
      width: 100%; max-height: calc(100vh - 48px);
      display: flex; flex-direction: column; overflow: hidden;
      animation: modalIn 0.18s var(--ease);
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
    .modal-head {
      padding: 14px 18px; border-bottom: 1px solid var(--line-soft);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .modal-title { font-size: 14px; font-weight: 700; color: var(--ink); }
    .modal-sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .modal-close {
      width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--paper-2); color: var(--muted); font-size: 14px; line-height: 1;
      transition: all 0.15s var(--ease); flex-shrink: 0;
    }
    .modal-close:hover { background: var(--red); color: var(--white); }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; min-height: 0; }
    .modal-foot {
      padding: 12px 18px; border-top: 1px solid var(--line-soft); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }

    /* 评价选择弹层 */
    #evalPickerModal .modal { max-width: 440px; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .picker-chip {
      padding: 11px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--line); background: var(--white); color: var(--ink);
      transition: all 0.15s var(--ease); text-align: center; font-family: inherit;
    }
    .picker-chip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(20,20,20,0.08); border-color: var(--red); }
    .picker-chip.current { outline: 2px solid var(--ink); outline-offset: -2px; }
    .picker-chip.p高, .picker-chip.p较好, .picker-chip.p相对健康 { background: #d1fae5; color: #065f46; border-color: transparent; }
    .picker-chip.p不低, .picker-chip.p正常 { background: #e0e7ff; color: #3730a3; border-color: transparent; }
    .picker-chip.p偏低, .picker-chip.p需关注 { background: #fef3c7; color: #92400e; border-color: transparent; }
    .picker-chip.p明显偏低, .picker-chip.p需特殊关注, .picker-chip.p严重偏低 { background: #fee2e2; color: #991b1b; border-color: transparent; }
    .picker-chip.p待判定 { background: var(--paper-2); color: var(--muted); border-style: dashed; }
    .picker-reset {
      margin-top: 10px; width: 100%; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 600;
      border: 1px dashed var(--line); background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s var(--ease); font-family: inherit;
    }
    .picker-reset:hover { border-color: var(--ink); color: var(--ink); }

    /* E4 映射指认编辑器 */
    #mappingModal .modal { max-width: 880px; }
    .map-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .map-search {
      flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 12px; font-size: 12px; background: var(--paper); color: var(--ink);
    }
    .map-search:focus { outline: none; border-color: var(--ink); }
    .map-filter {
      font-size: 11px; padding: 5px 12px; border-radius: 16px; cursor: pointer;
      border: 1px solid var(--line-soft); background: var(--white); color: var(--muted);
      transition: all 0.15s var(--ease); user-select: none; font-weight: 600;
    }
    .map-filter.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .map-list { display: flex; flex-direction: column; gap: 6px; }
    .map-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border: 1px solid var(--line-soft); border-radius: 10px; background: var(--white);
      transition: border 0.15s var(--ease); flex-wrap: wrap;
    }
    .map-row.unmapped { border-style: dashed; background: #fffdf6; }
    .map-row:hover { border-color: var(--line); }
    .map-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); background: var(--paper-2); padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
    .map-label { flex: 1; min-width: 140px; font-size: 12.5px; color: var(--ink); font-weight: 500; }
    .map-dim-chips { display: flex; gap: 4px; flex-shrink: 0; }
    .map-dim-chip {
      font-size: 10px; padding: 4px 9px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--line); background: var(--white); color: var(--muted);
      font-weight: 700; transition: all 0.15s var(--ease); font-family: inherit;
    }
    .map-dim-chip:hover { border-color: var(--ink); color: var(--ink); }
    .map-dim-chip.on-E1 { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .map-dim-chip.on-E2 { background: #d1fae5; color: #065f46; border-color: #10b981; }
    .map-dim-chip.on-E3 { background: #dbeafe; color: #1e40af; border-color: #3b82f6; }
    .map-dim-chip.on-E4 { background: #e0e7ff; color: #3730a3; border-color: #6366f1; }
    .map-sub-select {
      font-size: 11px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--white); color: var(--ink); font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .map-sub-select:focus { outline: none; border-color: var(--ink); }
    .map-sub-select:disabled { opacity: 0.4; cursor: not-allowed; }
    .map-clear {
      width: 22px; height: 22px; border-radius: 6px; border: none; cursor: pointer;
      background: transparent; color: var(--muted); font-size: 12px; flex-shrink: 0;
      transition: all 0.15s; line-height: 1;
    }
    .map-clear:hover { background: #fee2e2; color: var(--red); }
    .map-empty-group { font-size: 11px; color: var(--muted); padding: 10px 4px; text-align: center; }

    /* E4 三步工作流 */
    #e4WorkflowModal .modal { max-width: 720px; }
    .e4-steps { display: flex; align-items: center; margin-bottom: 16px; }
    .e4-step { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .e4-step-num {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
      background: var(--white); color: var(--muted); font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease);
    }
    .e4-step-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: color 0.2s; }
    .e4-step.running .e4-step-num { border-color: var(--red); color: var(--red); animation: pulse 1.1s ease-in-out infinite; }
    .e4-step.running .e4-step-label { color: var(--red); }
    .e4-step.done .e4-step-num { border-color: #16A34A; background: #16A34A; color: var(--white); }
    .e4-step.done .e4-step-label { color: var(--ink); }
    .e4-step.error .e4-step-num { border-color: var(--red); background: var(--red); color: var(--white); }
    .e4-step.error .e4-step-label { color: var(--red); }
    .e4-connector { flex: 1; height: 2px; background: var(--line-soft); margin: 0 10px; min-width: 16px; transition: background 0.3s; }
    .e4-connector.done { background: #16A34A; }
    .e4-detail {
      background: var(--paper); border: 1px solid var(--line-soft); border-radius: 10px;
      padding: 12px 14px; font-size: 12px; color: var(--ink-2); line-height: 1.7; min-height: 56px;
    }
    .e4-detail b { color: var(--ink); }
    .e4-detail .err { color: var(--red); }
    .e4-dim-status { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .e4-dim-chip {
      font-size: 11px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--white); color: var(--muted); font-weight: 600; transition: all 0.2s;
    }
    .e4-dim-chip.running { border-color: var(--red); color: var(--red); animation: pulse 1.1s ease-in-out infinite; }
    .e4-dim-chip.done { border-color: #16A34A; color: #15803d; background: #f0fdf4; }
    .e4-dim-chip.failed { border-color: var(--red); color: var(--red); background: #fef2f2; }
    .e4-overview {
      border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 16px;
      background: var(--paper); font-size: 13px; line-height: 1.7; max-height: 46vh;
    }
    .e4-overview h1, .e4-overview h2, .e4-overview h3 { color: var(--red-deep); margin: 10px 0 6px; font-size: 14px; }
    .e4-overview h1 { font-size: 16px; }
    .e4-overview strong { color: var(--ink); }

    .lab-meta-text { font-size: 11px; color: var(--muted); }
    .lab-count-accent { color: var(--red); }
    .eval-dl-section { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .eval-dl-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .eval-dl-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .eval-dl-btn.eval-dl-red { background: var(--red); }
    .eval-dl-btn.eval-dl-red:hover { background: var(--red-deep); }
    .map-filter-static { cursor: default; border-style: dashed; }

    /* 响应式 */
    @media (max-width: 900px) {
      .eval-dim-body { grid-template-columns: 1fr; }
      .eval-area { height: auto; min-height: 420px; }
    }
    /* 侧边栏抽屉模式（<1024px）：左上角悬浮汉堡按钮，内容下移让位 */
    @media (max-width: 1023px) {
      .lab-wrap { padding-top: 60px; }
    }
    @media (max-width: 480px) {
      .lab-wrap { padding: 60px 10px 16px; }
      .lab-topbar-right { width: 100%; }
    }
  </style>
</head>
<body>

<div data-app-shell></div>

<div class="lab-wrap">

  <div class="lab-topbar">
    <div class="lab-topbar-left">
      <span class="lab-title">内部下载</span>
      <div class="stu-picker" id="stuPicker">
        <button type="button" class="stu-picker-btn" id="stuPickerBtn" onclick="toggleStuPicker()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="stu-picker-label" id="stuPickerLabel">选择学生…</span>
          <svg class="stu-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="stu-picker-panel" id="stuPickerPanel">
          <input type="text" class="stu-picker-search" id="stuPickerSearch" placeholder="搜索姓名 / 学校 / 年级…" oninput="renderStuOptions()">
          <div class="stu-picker-list" id="stuPickerList"></div>
        </div>
      </div>
      <div class="report-chip-wrap" id="reportChipWrap" style="display:none">
        <button type="button" class="report-chip" id="reportChipBtn" onclick="toggleReportMenu()">
          <span id="reportChipLabel">报告 —</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="report-menu" id="reportMenu"></div>
      </div>
    </div>
    <div class="lab-topbar-right">
      <label class="eval-checkbox"><input type="checkbox" id="includeRaw" checked> 包含原始数据</label>
      <span class="lab-topbar-divider"></span>
      <button class="btn-sm" id="evalDownloadBtn" onclick="downloadEvalMd()">Y4 报告 MD</button>
      <button class="btn-sm" id="evalDownloadJsonBtn" onclick="downloadY4Json()">Y4 数据 JSON</button>
      <button class="btn-sm" id="evalDownloadE4Btn" onclick="runE4Workflow()">E4 协议</button>
      <span class="lab-topbar-divider"></span>
      <button class="btn-sm primary" id="runBtn" onclick="runInterpretation()" disabled>运行解读</button>
      <span class="lab-status idle" id="statusBar"><span class="dot"></span><span id="statusText">就绪</span></span>
    </div>
  </div>

  <!-- AI 解读（按内容动态显示） -->
  <section class="lab-section ai-collapsed" id="aiSection" style="display:none">
    <div class="ai-head" onclick="toggleAiCollapse()">
      <span class="ai-head-title">AI 解读</span>
      <span class="ai-head-state" id="aiStateText"></span>
      <span class="ai-head-arrow">▾</span>
    </div>
    <div class="ai-body">
      <div class="ai-output" id="outputArea">
        <div class="empty-state">请先选择学生和报告，然后点击「运行解读」</div>
      </div>
      <div class="output-meta" id="outputMetaBar" style="display: none;">
        <span id="metaTokens"></span>
        <span id="metaTime"></span>
      </div>
    </div>
  </section>

  <!-- 有效评价（全宽主区域） -->
  <section class="lab-section">
    <div class="lab-sec-head">
      <div class="lab-sec-title-wrap">
        <h3>有效评价</h3>
        <span class="lab-meta-text" id="evalContext"></span>
      </div>
      <div class="eval-view-toggle">
        <span class="eval-view-btn active" data-view="y4" onclick="switchEvalView('y4')">Y4 四维</span>
        <span class="eval-view-btn" data-view="e4" onclick="switchEvalView('e4')">E4 框架</span>
      </div>
    </div>
    <div class="eval-toolbar">
      <div class="eval-toolbar-main">
        <div class="eval-search-wrap">
          <span class="eval-search-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input class="eval-search" id="evalSearch" placeholder="搜索编号或指标…" oninput="filterEval(this.value)">
        </div>
        <span class="eval-filter-toggle" id="filterAdjustedToggle" onclick="toggleFilterAdjusted()">只看已调整</span>
        <span class="eval-filter-toggle" id="mappingToggle" onclick="openMappingModal()" data-tip="指认每个 Y4 指标属于哪个 E4 维度">E4 映射 <b id="mappingCount" class="lab-count-accent">…</b></span>
        <div class="eval-counts" id="evalCounts"></div>
      </div>
    </div>
    <div class="eval-area" id="evalArea">
      <div class="empty-state">选择报告后显示有效评价数据</div>
    </div>
  </section>

</div>

<!-- 评价选择弹层 -->
<div class="modal-backdrop" id="evalPickerModal" onclick="if(event.target===this)closeModal('evalPickerModal')">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="pickerTitle">选择评价</div>
        <div class="modal-sub" id="pickerSub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('evalPickerModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="picker-grid" id="pickerGrid"></div>
      <button class="picker-reset" id="pickerResetBtn" onclick="resetEvalFromPicker()">恢复默认档位</button>
    </div>
  </div>
</div>

<!-- E4 映射指认编辑器 -->
<div class="modal-backdrop" id="mappingModal" onclick="if(event.target===this)closeModal('mappingModal')">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">Y4 → E4 映射指认</div>
        <div class="modal-sub">Y4 报告的编号+名称是唯一权威命名；这里只是把每个指标<b>人工指认</b>到 E4 维度/子类别，未指认的会进入 OTHER_VARIABLES。</div>
      </div>
      <button class="modal-close" onclick="closeModal('mappingModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="map-toolbar">
        <input class="map-search" id="mapSearch" placeholder="搜索编号或指标…" oninput="renderMappingList()">
        <span class="map-filter" id="mapUnmappedFilter" onclick="toggleMapUnmappedFilter()">只看未指认</span>
        <span class="map-filter map-filter-static" id="mapProgress">已指认 0 / 0</span>
      </div>
      <div class="map-list" id="mapList"></div>
    </div>
    <div class="modal-foot">
      <span class="lab-meta-text">保存后立即生效，用于 E4 视图分组与 E4 协议生成</span>
      <button class="eval-dl-btn" id="mapSaveBtn" onclick="saveMapping()">保存映射</button>
    </div>
  </div>
</div>

<!-- E4 三步工作流 -->
<div class="modal-backdrop" id="e4WorkflowModal" onclick="if(event.target===this&&e4State.phase!=='running')closeModal('e4WorkflowModal')">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">E4 协议生成</div>
        <div class="modal-sub">每次现生成，不做储存。数据行全程保留 Y4 原始编号+名称。</div>
      </div>
      <button class="modal-close" id="e4CloseBtn" onclick="closeModal('e4WorkflowModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="e4-steps">
        <div class="e4-step" id="e4Step1">
          <span class="e4-step-num">1</span><span class="e4-step-label">数据整编</span>
        </div>
        <div class="e4-connector" id="e4Conn1"></div>
        <div class="e4-step" id="e4Step2">
          <span class="e4-step-num">2</span><span class="e4-step-label">E1-E4 分维度分析</span>
        </div>
        <div class="e4-connector" id="e4Conn2"></div>
        <div class="e4-step" id="e4Step3">
          <span class="e4-step-num">3</span><span class="e4-step-label">综合成文</span>
        </div>
      </div>
      <div class="e4-detail" id="e4Detail">等待开始…</div>
      <div class="e4-dim-status" id="e4DimStatus" style="display:none;"></div>
      <div id="e4OverviewWrap" style="display:none; margin-top:14px;">
        <span class="label-sm">协议总览（可直接下载）</span>
        <div class="e4-overview output-content" id="e4Overview"></div>
      </div>
    </div>
    <div class="modal-foot">
      <span class="lab-meta-text" id="e4FootNote"></span>
      <button class="eval-dl-btn" id="e4DownloadFinalBtn" style="display:none;" onclick="downloadE4Content()">下载 .md 文件</button>
    </div>
  </div>
</div>

<script>
  let lastOutput = '';
  let isRunning = false;
  let currentStudentId = '';
  let currentReportId = '';
  let currentReport = null;
  let evalItems = [];
  let perCodeEvalOptions = {};
  const FALLBACK_EVAL_OPTIONS = ["高","较好","不低","偏低","明显偏低","严重偏低","需关注","需特殊关注","相对健康","正常"];
  let evalLoaded = false;
  let evalFilter = '';
  let evalFilterAdjusted = false;
  let evalView = 'y4';
  let mappingDone = 0, mappingTotal = 0;
  let mapUnmappedOnly = false;
  // E4 框架常量（由 /api/prompt-lab/e4-mapping 返回）
  let e4Meta = {
    dims: ["E1","E2","E3","E4"],
    labels: {"E1":"E1 · Emotion（情绪）","E2":"E2 · Energy（精力管理）","E3":"E3 · Engine（引擎）","E4":"E4 · Engagement（参与投入）"},
    subcats: {"E1":["学习信心","学校融入度","亲子依恋","焦虑状态","自我概念"],"E2":["睡眠","饮食","运动"],"E3":["大脑引擎","动力引擎"],"E4":["学习策略","多元智能与自我认知","职业兴趣与价值观"]},
  };
  let e4State = { phase: 'idle', content_md: '', fname: 'E4评估_protocol.md' };

  // Esc 关闭最上层弹层
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    for (const id of ['evalPickerModal', 'mappingModal', 'e4WorkflowModal']) {
      const el = document.getElementById(id);
      if (el && el.classList.contains('open')) {
        if (id === 'e4WorkflowModal' && e4State.phase === 'running') return; // 运行中不误关
        closeModal(id);
        return;
      }
    }
  });

  let allStudents = [];
  let studentReports = [];

  loadE4Meta();
  loadStudents();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function loadStudents() {
    try {
      const resp = await fetch('/api/students');
      const data = await resp.json();
      if (data.ok && data.students) allStudents = data.students;
      renderStuOptions();
    } catch (e) { console.error('加载学生列表失败', e); }
  }

  // ── 学生选择器（combobox）──────────────────────────────────
  function renderStuOptions() {
    const list = document.getElementById('stuPickerList');
    if (!list) return;
    const q = (document.getElementById('stuPickerSearch').value || '').trim().toLowerCase();
    const items = allStudents.filter(s => !q ||
      (s.name || '').toLowerCase().includes(q) ||
      (s.school || '').toLowerCase().includes(q) ||
      (s.grade || '').toLowerCase().includes(q));
    if (!items.length) {
      list.innerHTML = '<div class="stu-picker-empty">无匹配学生</div>';
      return;
    }
    list.innerHTML = items.map(s => `
      <button type="button" class="stu-option${String(s.id) === String(currentStudentId) ? ' active' : ''}" onclick="pickStudent(${s.id})">
        <span class="stu-option-name">${escapeHtml(s.name)}</span>
        <span class="stu-option-meta">${escapeHtml([s.grade, s.school].filter(Boolean).join(' · '))}</span>
      </button>`).join('');
  }

  function toggleStuPicker() {
    const wrap = document.getElementById('stuPicker');
    const panel = document.getElementById('stuPickerPanel');
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    wrap.classList.toggle('open', open);
    if (open) {
      document.getElementById('stuPickerSearch').value = '';
      renderStuOptions();
      setTimeout(() => document.getElementById('stuPickerSearch').focus(), 30);
    }
  }

  function closeStuPicker() {
    document.getElementById('stuPickerPanel').classList.remove('open');
    document.getElementById('stuPicker').classList.remove('open');
  }

  async function pickStudent(sid) {
    closeStuPicker();
    await onStudentChange(String(sid));
  }

  function updatePickerLabel() {
    const s = allStudents.find(x => String(x.id) === String(currentStudentId));
    document.getElementById('stuPickerLabel').textContent =
      s ? (s.name + (s.grade ? ' · ' + s.grade : '')) : '选择学生…';
    document.getElementById('stuPickerBtn').classList.toggle('has-value', !!s);
  }

  // ── 报告 chip ──────────────────────────────────────────────
  function reportLabel(r) {
    return r.report_date || (r.created_at ? String(r.created_at).slice(0, 10) : ('#' + r.id));
  }

  function updateReportChip() {
    const wrap = document.getElementById('reportChipWrap');
    if (!currentStudentId || !studentReports.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const r = studentReports.find(x => String(x.id) === String(currentReportId));
    document.getElementById('reportChipLabel').textContent = r ? ('报告 ' + reportLabel(r)) : '选择报告…';
  }

  function toggleReportMenu() {
    const menu = document.getElementById('reportMenu');
    if (menu.classList.contains('open')) { menu.classList.remove('open'); return; }
    menu.innerHTML = studentReports.map((r, i) => `
      <button type="button" class="report-option${String(r.id) === String(currentReportId) ? ' active' : ''}" onclick="pickReport(${r.id})">
        <span>${escapeHtml(reportLabel(r))}</span>
        ${i === 0 ? '<span class="report-latest">最新</span>' : ''}
      </button>`).join('');
    menu.classList.add('open');
  }

  async function pickReport(rid) {
    document.getElementById('reportMenu').classList.remove('open');
    await onReportChange(String(rid));
  }

  // 点击面板外部时收起选择器 / 报告菜单
  document.addEventListener('click', e => {
    const sp = document.getElementById('stuPicker');
    const rw = document.getElementById('reportChipWrap');
    if (sp && !sp.contains(e.target)) closeStuPicker();
    if (rw && !rw.contains(e.target)) document.getElementById('reportMenu').classList.remove('open');
  });

  // ── 学生 / 报告切换 ────────────────────────────────────────
  function updateRunBtn() {
    const btn = document.getElementById('runBtn');
    btn.disabled = !currentReportId || isRunning;
    btn.textContent = (currentReport && currentReport.interpretation) ? '重新解读' : '运行解读';
  }

  async function onStudentChange(sid) {
    currentStudentId = sid || '';
    currentReportId = '';
    currentReport = null;
    evalItems = [];
    renderEvalCounts();
    renderEvalList();
    hideAiSection();
    updateRunBtn();
    updatePickerLabel();
    updateReportChip();
    if (!sid) { studentReports = []; return; }
    try {
      const resp = await fetch(`/api/students/${sid}/reports`);
      const data = await resp.json();
      studentReports = (data.ok && data.reports) ? data.reports.slice() : [];
      studentReports.sort((a, b) => (b.id || 0) - (a.id || 0));  // 最新在前
    } catch (e) {
      console.error('加载报告列表失败', e);
      studentReports = [];
    }
    updateReportChip();
    if (studentReports.length) {
      await onReportChange(String(studentReports[0].id));  // 自动选择最新报告
    }
  }

  async function onReportChange(rid) {
    currentReportId = rid || '';
    updateRunBtn();
    updateReportChip();
    if (!rid) { evalItems = []; renderEvalCounts(); renderEvalList(); return; }
    await loadEvaluation();
  }

  // ── AI 解读动态 section ────────────────────────────────────
  function setAiState(text, running) {
    const el = document.getElementById('aiStateText');
    el.textContent = text || '';
    el.classList.toggle('is-running', !!running);
  }

  function hideAiSection() {
    document.getElementById('aiSection').style.display = 'none';
    document.getElementById('aiSection').classList.add('ai-collapsed');
    lastOutput = '';
    setAiState('');
  }

  function showAiSection(stateText, opts) {
    const sec = document.getElementById('aiSection');
    sec.style.display = '';
    if (opts && opts.expand) sec.classList.remove('ai-collapsed');
    setAiState(stateText, opts && opts.running);
  }

  function toggleAiCollapse() {
    document.getElementById('aiSection').classList.toggle('ai-collapsed');
  }

  function updateEvalContext() {
    const el = document.getElementById('evalContext');
    if (!currentReport) { el.textContent = ''; return; }
    const parts = [currentReport.student_name, currentReport.report_date].filter(Boolean);
    el.textContent = parts.length ? '· ' + parts.join(' · ') : '';
  }

  async function loadE4Meta() {
    try {
      const resp = await fetch('/api/prompt-lab/e4-mapping');
      const data = await resp.json();
      if (data.ok && data.dims) {
        e4Meta = { dims: Object.keys(data.dims), labels: data.dims, subcats: data.subcats };
      }
    } catch (e) { console.error(e); }
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  // ── 有效评价视图（按报告加载） ───────────────────────────────
  async function loadEvaluation() {
    if (!currentReportId) return;
    setStatus('running', '加载有效评价…');
    try {
      const resp = await fetch(`/api/reports/${currentReportId}/qualification`);
      const data = await resp.json();
      if (data.ok) {
        evalItems = data.items.map(it => ({
          ...it,
          e4_dims: it.e4_dims || (it.e4_dim ? [{e4_dim: it.e4_dim, e4_sub: it.e4_sub || ''}] : []),
          original_eval: it.eval_value,
          adjusted: false,
          note: '',
          noteExpanded: false,
          data_bias: '正常',
          problem_status: 'CONFIRMED',
        }));
        if (data.per_code_eval_options) perCodeEvalOptions = data.per_code_eval_options;
        mappingDone = data.mapping_done || 0;
        mappingTotal = data.mapping_total || evalItems.length;
        updateMappingCount();
        evalLoaded = true;
        currentReport = data.report || null;
        // 已有解读则回填并显示 AI section，避免重复跑 AI
        if (currentReport && currentReport.interpretation) {
          lastOutput = currentReport.interpretation;
          document.getElementById('outputArea').innerHTML =
            `<div class="output-content">${renderMarkdown(currentReport.interpretation)}</div>`;
          showAiSection(`已有解读 · ${currentReport.interpretation.length} 字`);
        } else {
          hideAiSection();
        }
        updateEvalContext();
        updateRunBtn();
        renderEvalCounts();
        renderEvalList();
        setStatus('done', '就绪');
      } else {
        currentReport = null;
        hideAiSection();
        updateEvalContext();
        document.getElementById('evalCounts').textContent = '';
        document.getElementById('evalArea').innerHTML = '<div class="empty-state" style="color:var(--red);">' + (data.error||'加载失败') + '</div>';
        setStatus('idle', '错误');
      }
    } catch (e) {
      currentReport = null;
      hideAiSection();
      updateEvalContext();
      document.getElementById('evalArea').innerHTML = '<div class="empty-state" style="color:var(--red);">网络错误: ' + e.message + '</div>';
      setStatus('idle', '错误');
    }
  }

  function renderEvalCounts() {
    const total = evalItems.length;
    const adjusted = evalItems.filter(i => i.adjusted).length;
    const withEval = evalItems.filter(i => i.eval_value).length;
    const withNotes = evalItems.filter(i => i.note).length;
    const biased = evalItems.filter(i => i.data_bias !== '正常').length;
    const observations = evalItems.filter(i => i.problem_status === 'OBSERVATION').length;
    document.getElementById('evalCounts').innerHTML =
      `<span class="eval-meta-item">共<b>${total}</b></span>` +
      `<span class="eval-meta-item">已评价<b>${withEval}</b></span>` +
      `<span class="eval-meta-item ${adjusted?'is-adjusted':''}">已调整<b>${adjusted}</b></span>` +
      (biased ? `<span class="eval-meta-item">数据偏差<b>${biased}</b></span>` : '') +
      (observations ? `<span class="eval-meta-item">观望<b>${observations}</b></span>` : '') +
      (withNotes ? `<span class="eval-meta-item">备注<b>${withNotes}</b></span>` : '');
  }

  function getGrouping() {
    if (evalView === 'e4') {
      return {
        dims: ["E1","E2","E3","E4","__unmapped__"],
        labels: {...e4Meta.labels, "__unmapped__": "未指认 · 待人工映射"},
        // 多维度映射：一个 item 可归入多个 E4 组
        getKey: it => {
          const dims = (it.e4_dims || []).map(m => m.e4_dim).filter(d => e4Meta.dims.includes(d));
          return dims.length ? dims : ['__unmapped__'];
        },
        multi: true,
      };
    }
    return {
      dims: ["心力","精力","学习力","生涯力"],
      labels: {"心力":"心力 · 情绪与动力","精力":"精力 · 精力与身体健康","学习力":"学习力 · 学习系统","生涯力":"生涯力 · 专业与职业"},
      getKey: it => [it.dimension || '学习力'],
      multi: false,
    };
  }

  function renderEvalList() {
    const area = document.getElementById('evalArea');
    const g = getGrouping();
    let html = '';
    let shown = 0;
    for (const dim of g.dims) {
      // 多维度模式下，一个 item 可在多个组出现
      let items;
      if (g.multi) {
        items = evalItems.filter(it => g.getKey(it).includes(dim));
      } else {
        items = evalItems.filter(it => g.getKey(it)[0] === dim);
      }
      if (evalFilter) {
        const f = evalFilter.toLowerCase();
        items = items.filter(it => (it.code + ' ' + it.label).toLowerCase().includes(f));
      }
      if (evalFilterAdjusted) {
        items = items.filter(it => it.adjusted || it.note || it.data_bias !== '正常' || it.problem_status === 'OBSERVATION');
      }
      if (!items.length) continue;
      shown += items.length;
      html += `<div class="eval-dim-group" id="dim-${dim}">`;
      html += `<div class="eval-dim-head" onclick="toggleDim('${dim}')"><span class="arrow">▼</span>${g.labels[dim]}<span class="eval-dim-count">${items.length}</span></div>`;
      html += `<div class="eval-dim-body">`;
      for (const it of items) {
        html += renderEvalCard(it);
      }
      html += `</div></div>`;
    }
    area.innerHTML = shown ? html : '<div class="empty-state">无匹配项</div>';
  }

  function renderEvalCard(it) {
    const srcMap = {'档位字段':'dangwei','规则推导':'derived','原始排序':'order','参照值':'norm','待判定':'pending'};
    const srcClass = srcMap[it.eval_source] || 'pending';
    const srcLabel = {'档位字段':'档位','规则推导':'推导','原始排序':'排序','参照值':'参照','待判定':'待判定'}[it.eval_source] || '待判定';
    const isReadOnly = it.eval_source === '原始排序' || it.eval_source === '参照值';
    const evalDisplay = it.eval_value || '待判定';
    const cardClass = [
      'eval-card',
      it.adjusted ? 'adjusted' : '',
      it.data_bias === '高估' ? 'bias-high' : (it.data_bias === '低估' ? 'bias-low' : ''),
    ].filter(Boolean).join(' ');
    // E4 归属签仅在 E4 视图渲染，统一中性色
    const e4tags = evalView === 'e4'
      ? (it.e4_dims || []).map(m => {
          const full = m.e4_dim + (m.e4_sub ? ' · ' + m.e4_sub : '');
          return `<span class="eval-card-e4tag" title="${full}">${full}</span>`;
        }).join('')
      : '';
    const noteToggleClass = it.note ? 'eval-note-toggle has-note' : 'eval-note-toggle';
    const isObservation = it.problem_status === 'OBSERVATION';
    const rawText = `${it.raw_value}${it.unit||''}`;

    let html = `<div class="${cardClass}" data-code="${it.code}">`;
    html += `<div class="eval-card-main">`;
    html += `<span class="eval-card-code" title="${it.code}">${it.code}</span>`;
    html += `<span class="eval-card-label" title="${it.label}">${it.label}</span>`;
    html += `<span class="src-tag ${srcClass}" title="评价来源：${it.eval_source}">${srcLabel}</span>`;
    html += `<span class="eval-card-raw" title="${rawText}">${rawText}</span>`;
    if (isReadOnly) {
      html += `<span class="eval-card-eval ${evalDisplay}">${evalDisplay}</span>`;
    } else {
      // 当前值 chip，点击弹出居中选择层
      html += `<button class="eval-chip-btn ${evalDisplay} ${it.adjusted?'adjusted':''}" data-tip="点击选择档位" onclick="openEvalPicker('${it.code}')">${evalDisplay}</button>`;
    }
    html += `<div class="eval-card-actions">`;
    if (!isReadOnly) {
      html += `<button class="act-btn bias-normal ${it.data_bias==='正常'?'active':''}" data-tip="数据可信" onclick="setBias('${it.code}','正常',this)">正常</button>`;
      html += `<button class="act-btn bias-high ${it.data_bias==='高估'?'active':''}" data-tip="实测高估：真实水平更差（档位下移）" onclick="setBias('${it.code}','高估',this)">高估</button>`;
      html += `<button class="act-btn bias-low ${it.data_bias==='低估'?'active':''}" data-tip="实测低估：真实水平更好（档位上移）" onclick="setBias('${it.code}','低估',this)">低估</button>`;
      html += `<button class="act-btn ${isObservation?'observation':'problem-confirmed'}" data-tip="${isObservation?'假问题，待一表人才验证':'真问题，已确认'}" onclick="toggleProblem('${it.code}',this)">${isObservation?'观望':'已确认'}</button>`;
    }
    html += `<span class="${noteToggleClass}" onclick="expandNote('${it.code}', !getNoteExpanded('${it.code}'))">${it.note ? '有备注' : '备注'}</span>`;
    html += `</div>`;
    html += `</div>`;
    // E4 归属签行（仅 E4 视图有内容）
    html += `<div class="eval-card-e4row">${e4tags}</div>`;
    // Note row
    html += `<div class="eval-note-row ${it.noteExpanded?'expanded':''}" data-note-code="${it.code}">`;
    html += `<input class="eval-note-input" placeholder="补充说明：人工判断 / 上下文 / 异议原因 / 访谈发现…" value="${(it.note||'').replace(/"/g,'&quot;')}" oninput="setNote('${it.code}', this.value)" onfocus="expandNote('${it.code}', true)">`;
    html += `</div>`;
    html += `</div>`;
    return html;
  }

  function getNoteExpanded(code) {
    const it = evalItems.find(x => x.code === code);
    return it ? it.noteExpanded : false;
  }

  function expandNote(code, on) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    it.noteExpanded = on;
    const row = document.querySelector(`.eval-note-row[data-note-code="${code}"]`);
    if (row) row.classList.toggle('expanded', on);
  }

  function setNote(code, val) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    it.note = val;
    const card = document.querySelector(`.eval-card[data-code="${code}"]`);
    if (card) {
      const t = card.querySelector('.eval-note-toggle');
      t.textContent = val ? '有备注' : '备注';
      t.classList.toggle('has-note', !!val);
    }
    renderEvalCounts();
  }

  function setBias(code, bias, btn) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    it.data_bias = bias;
    const card = btn.closest('.eval-card');
    card.querySelectorAll('.act-btn.bias-normal, .act-btn.bias-high, .act-btn.bias-low').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    card.classList.remove('bias-high','bias-low');
    if (bias === '高估') card.classList.add('bias-high');
    if (bias === '低估') card.classList.add('bias-low');
    renderEvalCounts();
  }

  function toggleProblem(code, btn) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    it.problem_status = it.problem_status === 'OBSERVATION' ? 'CONFIRMED' : 'OBSERVATION';
    btn.textContent = it.problem_status === 'OBSERVATION' ? '观望' : '已确认';
    btn.classList.toggle('observation', it.problem_status === 'OBSERVATION');
    btn.classList.toggle('problem-confirmed', it.problem_status === 'CONFIRMED');
    btn.dataset.tip = it.problem_status === 'OBSERVATION' ? '假问题，待一表人才验证' : '真问题，已确认';
    renderEvalCounts();
  }

  function filterEval(v) { evalFilter = v.trim(); renderEvalList(); }

  function toggleFilterAdjusted() {
    evalFilterAdjusted = !evalFilterAdjusted;
    document.getElementById('filterAdjustedToggle').classList.toggle('active', evalFilterAdjusted);
    renderEvalList();
  }

  function switchEvalView(v) {
    evalView = v;
    document.querySelectorAll('.eval-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    renderEvalList();
  }

  function toggleDim(dim) {
    const g = document.getElementById('dim-' + dim);
    if (!g) return;
    g.classList.toggle('dim-collapsed');
    g.querySelector('.eval-dim-head').classList.toggle('collapsed');
  }

  // ── 评价选择弹层（视口居中） ──────────────────────────────────
  let pickerCode = null;

  function openEvalPicker(code) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    pickerCode = code;
    const opts = perCodeEvalOptions[code] || FALLBACK_EVAL_OPTIONS;
    document.getElementById('pickerTitle').textContent = `选择评价 · ${it.code}`;
    document.getElementById('pickerSub').textContent =
      `${it.label}｜原始值 ${it.raw_value}${it.unit || ''}｜默认档位 ${it.original_eval || '待判定'}`;
    document.getElementById('pickerGrid').innerHTML = opts.map(o =>
      `<button class="picker-chip p${o} ${o === it.eval_value ? 'current' : ''}" onclick="applyEvalFromPicker('${o}')">${o}</button>`
    ).join('');
    document.getElementById('pickerResetBtn').style.display = it.adjusted ? '' : 'none';
    openModal('evalPickerModal');
  }

  function applyEvalFromPicker(value) {
    const it = evalItems.find(x => x.code === pickerCode);
    if (!it) return;
    it.eval_value = value;
    it.adjusted = value !== it.original_eval;
    updateEvalChip(it);
    closeModal('evalPickerModal');
    renderEvalCounts();
  }

  function resetEvalFromPicker() {
    const it = evalItems.find(x => x.code === pickerCode);
    if (!it) return;
    it.eval_value = it.original_eval;
    it.adjusted = false;
    updateEvalChip(it);
    closeModal('evalPickerModal');
    renderEvalCounts();
  }

  function updateEvalChip(it) {
    const btn = document.querySelector(`.eval-card[data-code="${it.code}"] .eval-chip-btn`);
    if (!btn) return;
    const display = it.eval_value || '待判定';
    btn.textContent = display;
    btn.className = `eval-chip-btn ${display} ${it.adjusted ? 'adjusted' : ''}`;
  }

  // ── E4 映射指认编辑器（多维度 toggle） ───────────────────────
  function updateMappingCount() {
    document.getElementById('mappingCount').textContent = `${mappingDone}/${mappingTotal}`;
    document.getElementById('mapProgress').textContent = `已指认 ${mappingDone} / ${mappingTotal}`;
  }

  function openMappingModal() {
    mapUnmappedOnly = false;
    document.getElementById('mapUnmappedFilter').classList.remove('active');
    document.getElementById('mapSearch').value = '';
    renderMappingList();
    openModal('mappingModal');
  }

  function toggleMapUnmappedFilter() {
    mapUnmappedOnly = !mapUnmappedOnly;
    document.getElementById('mapUnmappedFilter').classList.toggle('active', mapUnmappedOnly);
    renderMappingList();
  }

  // it.e4_dims = [{e4_dim, e4_sub}, ...]（多维度）
  function getMapDims(it) {
    if (!it.e4_dims || !it.e4_dims.length) return [];
    return it.e4_dims;
  }
  function hasMapDim(it, d) {
    return getMapDims(it).some(m => m.e4_dim === d);
  }
  function getMapSub(it, d) {
    const m = getMapDims(it).find(x => x.e4_dim === d);
    return m ? (m.e4_sub || '') : '';
  }

  function renderMappingList() {
    const kw = (document.getElementById('mapSearch').value || '').trim().toLowerCase();
    let items = evalItems.filter(it => !kw || (it.code + ' ' + it.label).toLowerCase().includes(kw));
    if (mapUnmappedOnly) items = items.filter(it => !getMapDims(it).length);
    const list = document.getElementById('mapList');
    if (!items.length) {
      list.innerHTML = '<div class="map-empty-group">无匹配项</div>';
      return;
    }
    list.innerHTML = items.map(it => {
      const dims = getMapDims(it);
      const hasAny = dims.length > 0;
      // E1-E4 toggle chips（可多选）
      const dimChips = e4Meta.dims.map(d => {
        const on = hasMapDim(it, d);
        const sub = getMapSub(it, d);
        return `<button class="map-dim-chip ${on ? 'on-' + d : ''}" onclick="toggleMapDim('${it.code}','${d}')">${d}${sub ? ':' + sub.substring(0,4) : ''}</button>`;
      }).join('');
      // 子类别下拉（为每个已选维度各一个 select）
      let subSelects = '';
      for (const d of e4Meta.dims) {
        if (!hasMapDim(it, d)) continue;
        const currentSub = getMapSub(it, d);
        const opts = ['<option value="">（可选）子类别…</option>']
          .concat((e4Meta.subcats[d] || []).map(s => `<option value="${s}" ${s === currentSub ? 'selected' : ''}>${s}</option>`))
          .join('');
        subSelects += `<select class="map-sub-select" onchange="setMapSubFor('${it.code}','${d}', this.value)" title="${d} 子类别">${opts}</select>`;
      }
      return `<div class="map-row ${hasAny ? '' : 'unmapped'}" data-map-code="${it.code}">
        <span class="map-code">${it.code}</span>
        <span class="map-label">${it.label}</span>
        <span class="map-dim-chips">${dimChips}</span>
        ${subSelects || '<span style="font-size:10px;color:var(--muted);">点击维度按钮选择</span>'}
        <button class="map-clear" title="清除全部" onclick="clearMap('${it.code}')">✕</button>
      </div>`;
    }).join('');
  }

  function toggleMapDim(code, dim) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    if (!it.e4_dims) it.e4_dims = [];
    const idx = it.e4_dims.findIndex(m => m.e4_dim === dim);
    if (idx >= 0) {
      it.e4_dims.splice(idx, 1);
    } else {
      it.e4_dims.push({ e4_dim: dim, e4_sub: '' });
    }
    renderMappingList();
  }

  function setMapSubFor(code, dim, sub) {
    const it = evalItems.find(x => x.code === code);
    if (!it || !it.e4_dims) return;
    const m = it.e4_dims.find(x => x.e4_dim === dim);
    if (m) m.e4_sub = sub;
  }

  function clearMap(code) {
    const it = evalItems.find(x => x.code === code);
    if (!it) return;
    it.e4_dims = [];
    renderMappingList();
  }

  async function saveMapping() {
    const btn = document.getElementById('mapSaveBtn');
    const entries = evalItems
      .filter(it => getMapDims(it).length > 0)
      .map(it => ({ code: it.code, e4_dims: getMapDims(it) }));
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      const resp = await fetch('/api/prompt-lab/e4-mapping', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries }),
      });
      const data = await resp.json();
      if (data.ok) {
        const saved = data.mapping || {};
        for (const it of evalItems) {
          it.e4_dims = saved[it.code] || [];
          it.e4_dim = it.e4_dims.length ? it.e4_dims[0].e4_dim : null;
          it.e4_sub = it.e4_dims.length ? (it.e4_dims[0].e4_sub || '') : '';
        }
        mappingDone = evalItems.filter(it => getMapDims(it).length > 0).length;
        mappingTotal = evalItems.length;
        updateMappingCount();
        btn.textContent = '已保存 ✓';
        renderEvalList();
        setTimeout(() => {
          btn.textContent = '保存映射'; btn.disabled = false;
          closeModal('mappingModal');
        }, 600);
      } else {
        alert(data.error || '保存失败');
        btn.disabled = false; btn.textContent = '保存映射';
      }
    } catch (e) {
      alert('网络错误: ' + e.message);
      btn.disabled = false; btn.textContent = '保存映射';
    }
  }

  function collectEvalPayload() {
    return evalItems.map(it => ({
      code:it.code, label:it.label, raw_value:it.raw_value, eval_value:it.eval_value,
      dimension:it.dimension, unit:it.unit, eval_source:it.eval_source,
      e4_dims:it.e4_dims || [],
      e4_dim:it.e4_dim, e4_sub:it.e4_sub,
      rule_note:it.rule_note, adjusted:it.adjusted, original_eval:it.original_eval,
      note:it.note, data_bias:it.data_bias, problem_status:it.problem_status,
    }));
  }

  function downloadBlob(content, fname) {
    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(u);
  }

  // Y4 报告 MD：服务端直接生成下载
  async function downloadEvalMd() {
    const btn = document.getElementById('evalDownloadBtn');
    const includeRaw = document.getElementById('includeRaw').checked;
    btn.disabled = true; btn.textContent = '生成中…';
    try {
      const resp = await fetch(`/api/reports/${currentReportId}/protocol-md`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          items: collectEvalPayload(),
          include_raw: includeRaw, interpretation: lastOutput || '',
        }),
      });
      if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert(e.error||'下载失败'); return; }
      const blob = await resp.blob();
      const cd = resp.headers.get('Content-Disposition') || '';
      let fname = 'Y4报告.md';
      const m = decodeURIComponent(cd).match(/filename\*?=(?:UTF-8'')?(?:")?([^";]+)/);
      if (m) fname = m[1];
      downloadBlob(await blob.text(), fname);
    } catch (e) { alert('网络错误: ' + e.message); }
    btn.disabled = false; btn.textContent = '下载 Y4 报告 (MD)';
  }

  // Generalized Y4 JSON 导出（所有数据点 + AI 解读，非 E4）
  async function downloadY4Json() {
    const btn = document.getElementById('evalDownloadJsonBtn');
    btn.disabled = true; btn.textContent = '生成中…';
    try {
      const resp = await fetch(`/api/reports/${currentReportId}/y4-json`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          items: collectEvalPayload(),
          interpretation: lastOutput || '',
        }),
      });
      const data = await resp.json();
      if (!data.ok) { alert(data.error || '导出失败'); return; }
      const blob = new Blob([JSON.stringify(data.json, null, 2)], { type: 'application/json;charset=utf-8' });
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u; a.download = data.filename || 'Y4数据.json';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(u);
    } catch (e) { alert('网络错误: ' + e.message); }
    btn.disabled = false; btn.textContent = '下载 Y4 数据 (JSON)';
  }

  // ── E4 三步工作流（每次现生成，不落库） ──────────────────────
  function e4SetStep(n, state) {
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById('e4Step' + i);
      el.classList.remove('running', 'done', 'error');
      if (i === n) el.classList.add(state);
      else if (i < n) el.classList.add('done');
    }
    document.getElementById('e4Conn1').classList.toggle('done', n > 1);
    document.getElementById('e4Conn2').classList.toggle('done', n > 2);
  }

  function e4Detail(html) { document.getElementById('e4Detail').innerHTML = html; }

  function e4DimChips(stateMap) {
    const wrap = document.getElementById('e4DimStatus');
    wrap.style.display = 'flex';
    wrap.innerHTML = e4Meta.dims.map(d =>
      `<span class="e4-dim-chip ${stateMap[d] || ''}">${e4Meta.labels[d]}</span>`
    ).join('');
  }

  async function runE4Workflow() {
    if (e4State.phase === 'running') { openModal('e4WorkflowModal'); return; }
    if (!currentReportId) { alert('请先选择学生和报告'); return; }
    e4State = { phase: 'running', content_md: '', fname: 'E4评估_protocol.md' };
    const includeRaw = document.getElementById('includeRaw').checked;
    const btn = document.getElementById('evalDownloadE4Btn');
    btn.disabled = true; btn.textContent = '生成中…';
    document.getElementById('e4OverviewWrap').style.display = 'none';
    document.getElementById('e4DownloadFinalBtn').style.display = 'none';
    document.getElementById('e4FootNote').textContent = '';
    document.getElementById('e4DimStatus').style.display = 'none';
    openModal('e4WorkflowModal');

    const payloadItems = collectEvalPayload();
    try {
      // 一站式：后端串行跑 step1（数据整编）→ step2（跨维度分析）→ step3（总览成文）
      e4SetStep(1, 'running');
      e4Detail('按 E4 框架（维度→评估问题→指标）整编数据行 → 跨维度分析 → 总览成文（一站式，预计 30-60s）');
      const r = await fetch(`/api/reports/${currentReportId}/e4-protocol`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ items: payloadItems, include_raw: includeRaw, interpretation: lastOutput || '' }),
      }).then(r => r.json());
      if (!r.ok) throw new Error(r.error || 'E4 协议生成失败');

      // Step1 结果
      const s1 = r.step1 || {};
      const gc = s1.group_counts || {};
      const parts = e4Meta.dims.map(d => `${d}: <b>${gc[d] || 0}</b>`).join(' · ');
      e4Detail(`数据整编完成 — ${parts}｜框架外 OTHER: <b>${s1.unmapped_count || 0}</b>`);
      const lp = r.list_placement || {};
      if (lp.category) {
        let extra = '';
        if (lp.placement === '干预名单') {
          const ts = (lp.traits || []).join('；');
          if (ts) extra = `｜${ts}`;
        } else {
          const d = lp.detail || {};
          const segs = [];
          if (d.cog_total != null) segs.push(`认知能力百分位总 ${d.cog_total}（${d.cog_ok ? '≥95 达标' : '<95 未达标'}）`);
          if (d.exec_avg != null) segs.push(`执行功能平均 ${d.exec_avg.toFixed(1)}（${d.exec_ok ? '≥90 达标' : '<90 未达标'}）`);
          if (segs.length) extra = `｜${segs.join('｜')}`;
        }
        e4Detail(`问题判定完成 — 名单预览: <b>${lp.category}</b>${extra}`);
      }

      // Step2 结果
      e4SetStep(2, 'done');
      const st2 = (r.stats && r.stats.step2) || [];
      const tok2 = st2.reduce((a, s) => a + (s.tokens || 0), 0);
      const t2 = st2.reduce((a, s) => a + (s.time_ms || 0), 0);
      e4Detail(`跨维度分析完成 — Tokens: <b>${tok2}</b>｜耗时: <b>${(t2/1000).toFixed(1)}s</b>｜模型: ${st2[0]?.model || '-'}`);

      // Step3 结果
      e4SetStep(3, 'done');
      const s3 = (r.stats && r.stats.step3) || {};
      e4Detail(`完成 — 总览 Tokens: <b>${s3.tokens || 0}</b>｜耗时: <b>${((s3.time_ms || 0)/1000).toFixed(1)}s</b>｜模型: ${s3.model || '-'}`);
      e4State.phase = 'done';
      e4State.content_md = r.content_md;
      const sname = (r.student_name || '学生').replace(/\s+/g, '');
      e4State.fname = `${sname}_E4协议.md`;
      document.getElementById('e4Overview').innerHTML = renderMarkdown(r.content_md);
      document.getElementById('e4OverviewWrap').style.display = 'block';
      document.getElementById('e4DownloadFinalBtn').style.display = '';
      document.getElementById('e4FootNote').textContent = '本文件为工作草稿，每次点击重新生成，不做储存';
      downloadE4Content();
    } catch (e) {
      e4State.phase = 'error';
      const runningIdx = [1,2,3].findIndex(i => document.getElementById('e4Step'+i).classList.contains('running'));
      if (runningIdx >= 0) e4SetStep(runningIdx + 1, 'error');
      e4Detail(`<span class="err">失败：${e.message}</span>`);
      document.getElementById('e4FootNote').textContent = '可关闭弹层检查网络/映射后重试';
    }
    btn.disabled = false; btn.textContent = '下载 E4 协议';
  }

  function downloadE4Content() {
    if (!e4State.content_md) return;
    downloadBlob(e4State.content_md, e4State.fname);
  }

  function setStatus(state, text) {
    const bar = document.getElementById('statusBar');
    bar.className = `lab-status ${state}`;
    document.getElementById('statusText').textContent = text;
  }

  // Simple markdown render
  function renderMarkdown(text) {
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    // Headings
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Bullet lists
    html = html.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.+<\/li>\n?)+/g, '<ul>$&</ul>');
    // Numbered lists
    html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  async function runInterpretation() {
    if (isRunning) return;
    if (!currentReportId) { alert('请先选择学生和报告'); return; }
    isRunning = true;
    updateRunBtn();
    setStatus('running', 'AI 解读中（按报告）...');
    showAiSection('解读中…', { running: true });
    document.getElementById('outputArea').innerHTML = '<div class="empty-state">等待 AI 响应...</div>';
    document.getElementById('outputMetaBar').style.display = 'none';

    try {
      const resp = await fetch(`/api/reports/${currentReportId}/interpret`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: collectEvalPayload() }),
      });
      const data = await resp.json();

      if (data.ok) {
        lastOutput = data.reply;
        if (currentReport) currentReport.interpretation = data.reply;

        document.getElementById('outputArea').innerHTML =
          `<div class="output-content">${renderMarkdown(data.reply)}</div>`;
        document.getElementById('outputMetaBar').style.display = 'flex';
        document.getElementById('metaTokens').textContent = `已保存至报告`;
        document.getElementById('metaTime').textContent = '';

        showAiSection(`完成 · ${data.reply.length} 字`);
        setStatus('done', '完成');
      } else {
        document.getElementById('outputArea').innerHTML =
          `<div class="empty-state" style="color: var(--red);">${data.error || '解读失败'}</div>`;
        showAiSection('解读失败', { expand: true });
        setStatus('idle', '错误');
      }
    } catch (e) {
      document.getElementById('outputArea').innerHTML =
        `<div class="empty-state" style="color: var(--red);">网络错误: ${e.message}</div>`;
      showAiSection('网络错误', { expand: true });
      setStatus('idle', '错误');
    }

    isRunning = false;
    updateRunBtn();
  }
</script>
