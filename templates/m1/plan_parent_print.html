<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ plan.student_name }} · 情绪力阶段成长计划</title>
<link rel="stylesheet" href="{{ url_for('m1.m1_asset', filename='m1.css') }}">
<link rel="stylesheet" href="{{ url_for('m1.m1_asset', filename='plan_parent.css') }}">
</head>
<body class="m1 print-page pp-print">
{% from "m1/_parent_pages.html" import parent_pages %}
<div class="print-bar">
  <span>{{ plan.student_name }} · 家长版{% if wm %} · 草稿{% endif %}</span>
  <span class="sp"></span>
  <button class="btn" id="ppPrint">打印</button>
  <a class="btn" href="/m1/plans/{{ plan.id }}#step=parent">返回</a>
</div>

<div class="print-desk" id="ppPages">
  {{ parent_pages(parent_view, parent_fixed, plan, period, grade_text or '—', wm) }}
</div>

<script>
(function () {
  document.getElementById('ppPrint').addEventListener('click', function () {
    window.print();
  });
  {% if auto_print %}
  window.addEventListener('load', function () {
    setTimeout(function () { window.print(); }, 300);
  });
  {% endif %}
})();
</script>
</body>
</html>
