<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>综合测评报告 — Y4 报告生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* =========================== */
    /* Brand stripe + topbar       */
    /* =========================== */
    .brand-stripe { height: 3px; background: #1d4ed8; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      height: 28px;
      width: auto;
      max-height: 28px;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: #0f172a;
      letter-spacing: 0.2px;
    }
    .topbar-sub {
      color: #64748b;
      font-size: 12px;
    }

    /* =========================== */
    /* Layout: 33 / 67 split       */
    /* =========================== */
    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 33%) 1fr;
      gap: 0;
      min-height: 0;
      flex: 1;
    }

    /* =========================== */
    /* Left: Upload panel          */
    /* =========================== */
    .left-panel {
      padding: 24px 24px 32px;
      border-right: 1px solid #e2e8f0;
      background: #ffffff;
      overflow-y: auto;
      max-height: calc(100vh - 61px);
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .panel-subtitle {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .hint {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .hint strong { color: #1d4ed8; }

    /* Upload slots */
    .slots { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .slot {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 14px 16px;
      transition: all .15s ease;
      background: #fafbfc;
      cursor: pointer;
    }
    .slot:hover {
      border-color: #38bdf8;
      background: #f0f9ff;
      transform: translateY(-1px);
    }
    .slot.has-file {
      border-color: #1d4ed8;
      border-style: solid;
      background: #eff6ff;
    }
    .slot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .slot-tag {
      display: inline-block;
      background: #1d4ed8;
      color: #fff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .slot-sub {
      color: #64748b;
      font-size: 11px;
    }
    .slot-title {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
    }
    .slot-desc {
      color: #475569;
      font-size: 11px;
      margin-top: 2px;
    }
    .slot-fname {
      font-size: 12px;
      color: #1e40af;
      margin-top: 10px;
      word-break: break-all;
      min-height: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slot-placeholder {
      color: #94a3b8;
      font-style: italic;
      font-size: 12px;
      margin-top: 10px;
    }
    .slot input[type=file] { display: none; }

    /* Mindset score */
    .section-divider {
      border-top: 1px dashed #e2e8f0;
      margin: 18px 0;
    }
    .field-label {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .field-hint {
      color: #64748b;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .field-row input[type=number] {
      flex: 0 0 120px;
      padding: 9px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .field-row input[type=number]:focus {
      border-color: #2563eb;
    }
    .field-row span {
      color: #64748b;
      font-size: 12px;
    }

    /* Button */
    .gen-btn {
      width: 100%;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 20px;
      letter-spacing: 0.3px;
    }
    .gen-btn:hover:not(:disabled) {
      background: #1e40af;
    }
    .gen-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .gen-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      background: #94a3b8;
    }

    /* Status */
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      word-break: break-word;
    }
    .status.loading { display: block; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
    .status.error   { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .status.ok      { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #60a5fa;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================== */
    /* Right: AI Chat panel        */
    /* =========================== */
    .right-panel {
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: calc(100vh - 61px);
    }

    .chat-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-status {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
    }
    .chat-status.active .dot { background: #22c55e; }
    .chat-status.loading .dot { background: #f59e0b; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .btn {
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }
    .btn.secondary:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .btn.primary {
      background: #1d4ed8;
      color: #ffffff;
    }
    .btn.primary:hover:not(:disabled) {
      background: #1e40af;
    }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* Chat messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-message.assistant {
      align-self: flex-start;
    }
    .chat-message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .chat-message.assistant .chat-avatar {
      background: #dbeafe;
    }
    .chat-message.user .chat-avatar {
      background: #e2e8f0;
    }

    .chat-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      word-break: break-word;
    }
    .chat-message.assistant .chat-bubble {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-top-left-radius: 4px;
      color: #1e293b;
    }
    .chat-message.user .chat-bubble {
      background: #1d4ed8;
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    /* Markdown rendering inside chat */
    .chat-bubble h1, .chat-bubble h2, .chat-bubble h3 {
      margin: 10px 0 6px;
      font-weight: 700;
    }
    .chat-bubble h1 { font-size: 16px; }
    .chat-bubble h2 { font-size: 15px; }
    .chat-bubble h3 { font-size: 14px; }
    .chat-bubble p { margin: 6px 0; }
    .chat-bubble ul, .chat-bubble ol { margin: 6px 0 6px 20px; }
    .chat-bubble li { margin: 3px 0; }
    .chat-bubble strong { font-weight: 700; }
    .chat-bubble code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .chat-bubble pre {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .chat-bubble pre code {
      background: none;
      padding: 0;
    }
    .chat-bubble table {
      border-collapse: collapse;
      margin: 8px 0;
      width: 100%;
    }
    .chat-bubble th, .chat-bubble td {
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      text-align: left;
      font-size: 12px;
    }
    .chat-bubble th { background: #f8fafc; font-weight: 600; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Empty state */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 360px;
      margin: 0 auto;
    }
    .chat-empty .empty-icon {
      width: 64px; height: 64px;
      background: #e0e7ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 28px;
    }
    .chat-empty .empty-title {
      font-weight: 700;
      color: #1e293b;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .chat-empty .empty-sub {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Input area */
    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    .chat-input-area input:focus {
      border-color: #2563eb;
    }
    .chat-input-area input:disabled {
      background: #f8fafc;
      cursor: not-allowed;
    }

    /* =========================== */
    /* Responsive                  */
    /* =========================== */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
        max-height: none;
      }
      .right-panel {
        height: 70vh;
      }
      .topbar { padding: 12px 16px; }
      .chat-toolbar { padding: 10px 16px; }
      .chat-messages { padding: 16px; }
      .chat-input-area { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="品牌 Logo"
           onerror="this.style.display='none'" />
      <span class="brand-name">Y4 综合测评报告生成器</span>
    </div>
    <span class="topbar-sub">上传 PDF → AI 视觉解析 → 生成品牌报告 → AI 解读</span>
  </header>

  <main class="layout">
    <!-- ================================= -->
    <!-- LEFT: Upload panel                -->
    <!-- ================================= -->
    <aside class="left-panel">
      <div class="panel-title">上传报告</div>
      <div class="panel-subtitle">按报告标识上传对应 PDF，至少 1 份即可生成综合报告。</div>

      <div class="hint">
        <strong>上传说明</strong><br/>
        1. 每个上传框标有报告类型：<strong>A2</strong> · <strong>B3</strong> · <strong>B4</strong> · <strong>B6</strong>。请按标签上传。<br/>
        2. <strong style="color:#991b1c;">报告依赖视觉 OCR API</strong>，处理时间约 1-3 分钟，请耐心等待。
      </div>

      <div class="slots" id="slots"></div>

      <div class="section-divider"></div>

      <div class="field-label">思维模式分值（可选）</div>
      <div class="field-hint">如果 PDF 中思维模式数据提取不准确，可手动输入覆盖。</div>
      <div class="field-row">
        <input type="number" id="mindsetScore" min="0" max="100" step="0.1" placeholder="0 - 100"
               onchange="if(this.value !== '') this.value = Math.max(0, Math.min(100, Number(this.value)))">
        <span>分（0=固定型 · 50=混合型 · 100=成长型）</span>
      </div>

      <button class="gen-btn" id="genBtn" onclick="generate()" disabled>
        生成报告 + AI 解读
      </button>

      <div class="status" id="status"></div>
    </aside>

    <!-- ================================= -->
    <!-- RIGHT: AI Chat panel              -->
    <!-- ================================= -->
    <section class="right-panel">
      <!-- Toolbar: PDF download + AI status -->
      <div class="chat-toolbar">
        <div class="chat-toolbar-left">
          <button class="btn primary" id="downloadBtn" onclick="downloadPdf()" disabled>
            下载报告
          </button>
        </div>
        <div class="chat-status" id="chatStatus">
          <span class="dot"></span>
          <span id="chatStatusText">AI 解读师待命</span>
        </div>
      </div>

      <!-- Messages area -->
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <div class="empty-icon"></div>
          <div class="empty-title">AI 解读师</div>
          <div class="empty-sub">上传 PDF 并点击「生成报告 + AI 解读」后，<br/>AI 将自动解读测评结果，你也可以继续追问。</div>
        </div>
      </div>

      <!-- Input area -->
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="输入问题追问 AI..."
               onkeypress="if(event.key==='Enter')sendMessage()" disabled />
        <button class="btn primary" id="sendBtn" onclick="sendMessage()" disabled>发送</button>
      </div>
    </section>
  </main>

<script>
  // =====================================
  // Slot definitions
  // =====================================
  const SLOTS = [
    { key: "A2", title: "上传 A2 — 核心素养",
      sub: "认知能力 · 情绪稳定性 · 人格 · 依恋关系 · 体质健康" },
    { key: "B3", title: "上传 B3 — 核心学习能力",
      sub: "执行功能 · 学习动机 · 学习方法与策略" },
    { key: "B4", title: "上传 B4 — 核心认知能力 & 成长型思维",
      sub: "认知能力六项子指标 · 自驱力 · 思维模式" },
    { key: "B6", title: "上传 B6 — 职业发展",
      sub: "职业兴趣 Holland · 多元智能 · 职业价值观" },
  ];
  const files = {};
  let lastBlobUrl = null;
  let chatHistory = [];

  // =====================================
  // Brand logo: try several paths
  // =====================================
  (function setLogo() {
    const img = document.getElementById('brandLogo');
    const candidates = [
      '/output/branding/logo_color.png',
      '/branding/logo_color.png',
      '/static/branding/logo_color.png',
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= candidates.length) return;
      img.src = candidates[idx++];
    }
    img.addEventListener('error', tryNext, { once: true });
    tryNext();
  })();

  // =====================================
  // Render slots
  // =====================================
  function renderSlots() {
    const root = document.getElementById('slots');
    root.innerHTML = '';
    SLOTS.forEach(s => {
      const f = files[s.key];
      const slot = document.createElement('div');
      slot.className = 'slot' + (f ? ' has-file' : '');
      slot.innerHTML = `
        <div class="slot-head">
          <span class="slot-tag">${s.key}</span>
          <span class="slot-sub">点击选择 PDF</span>
        </div>
        <div class="slot-title">${s.title}</div>
        <div class="slot-desc">${s.sub}</div>
        ${f
          ? `<div class="slot-fname">${escapeHtml(f.name)}</div>`
          : `<div class="slot-placeholder">未选择文件 · 点击选择 ${s.key} 报告 PDF…</div>`
        }
        <input type="file" accept="application/pdf"
               onchange="onPickFile('${s.key}', this)" />
      `;
      slot.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        slot.querySelector('input[type=file]').click();
      });
      root.appendChild(slot);
    });
    const picked = Object.keys(files).length;
    document.getElementById('genBtn').disabled = picked < 1;
  }

  function onPickFile(key, input) {
    const f = input.files[0];
    if (f) files[key] = f;
    renderSlots();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // =====================================
  // Status helpers
  // =====================================
  function setStatus(text, type) {
    const el = document.getElementById('status');
    el.className = 'status ' + (type || '');
    if (type === 'loading') {
      el.innerHTML = '<span class="spinner"></span>' + escapeHtml(text);
    } else {
      el.textContent = text;
    }
  }
  function clearStatus() {
    const el = document.getElementById('status');
    el.className = 'status';
    el.innerHTML = '';
  }

  function setChatStatus(text, state) {
    const el = document.getElementById('chatStatus');
    el.className = 'chat-status' + (state ? ' ' + state : '');
    document.getElementById('chatStatusText').textContent = text;
  }

  // =====================================
  // Chat message helpers
  // =====================================
  function renderMarkdown(text) {
    // Minimal markdown rendering: headings, bold, lists, code, tables, paragraphs
    let html = escapeHtml(text);

    // Code blocks ```...```
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      return '<pre><code>' + code.trim() + '</code></pre>';
    });

    // Inline code `...`
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headings
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Unordered lists
    html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)/g, (m) => '<ul>' + m + '</ul>');
    // Fix nested ul
    html = html.replace(/<\/ul>\n<ul>/g, '');

    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

    // Tables (simple pipe tables)
    const lines = html.split('\n');
    let inTable = false;
    let tableHtml = '';
    const result = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith('|') && line.endsWith('|')) {
        const cells = line.split('|').slice(1, -1);
        if (cells.every(c => c.trim() === '' || /^[-: ]+$/.test(c.trim()))) {
          // separator row, skip
          continue;
        }
        if (!inTable) {
          inTable = true;
          tableHtml = '<table><thead><tr>';
          cells.forEach(c => tableHtml += '<th>' + c.trim() + '</th>');
          tableHtml += '</tr></thead><tbody>';
        } else {
          tableHtml += '<tr>';
          cells.forEach(c => tableHtml += '<td>' + c.trim() + '</td>');
          tableHtml += '</tr>';
        }
      } else {
        if (inTable) {
          tableHtml += '</tbody></table>';
          result.push(tableHtml);
          inTable = false;
          tableHtml = '';
        }
        result.push(lines[i]);
      }
    }
    if (inTable) {
      tableHtml += '</tbody></table>';
      result.push(tableHtml);
    }
    html = result.join('\n');

    // Paragraphs (split by double newline, wrap non-tag lines)
    const blocks = html.split(/\n\n+/);
    html = blocks.map(b => {
      const t = b.trim();
      if (!t) return '';
      if (t.startsWith('<')) return t;
      return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
  }

  function addMessage(role, content) {
    // Remove empty state if present
    const empty = document.getElementById('chatEmpty');
    if (empty) empty.remove();

    const container = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'chat-message ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'chat-avatar';
    avatar.textContent = role === 'assistant' ? 'AI' : 'Me';

    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble';

    if (role === 'assistant' && content === '__typing__') {
      bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    } else {
      bubble.innerHTML = renderMarkdown(content);
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg;
  }

  function updateLastMessage(role, content) {
    const container = document.getElementById('chatMessages');
    const messages = container.querySelectorAll('.chat-message.' + role);
    const last = messages[messages.length - 1];
    if (last) {
      const bubble = last.querySelector('.chat-bubble');
      bubble.innerHTML = renderMarkdown(content);
    }
    container.scrollTop = container.scrollHeight;
  }

  // =====================================
  // Generate action (upload PDFs + generate report)
  // =====================================
  async function generate() {
    const picked = Object.keys(files).length;
    if (picked < 1) { alert('请至少上传 1 份 PDF'); return; }

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    setStatus('上传并解析 ' + picked + ' 份 PDF，约需 1-3 分钟，请耐心等待…', 'loading');
    setChatStatus('报告生成中…', 'loading');

    // Show typing indicator in chat
    addMessage('assistant', '正在生成报告，完成后将自动解读，请稍候…');

    const fd = new FormData();
    SLOTS.forEach(s => {
      if (files[s.key]) fd.append(s.key, files[s.key], files[s.key].name);
    });
    const mindset = document.getElementById('mindsetScore');
    if (mindset && mindset.value.trim()) {
      fd.append('mindset_score', mindset.value.trim());
    }

    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 300000);

    try {
      const resp = await fetch('/api/generate', {
        method: 'POST', body: fd, signal: controller.signal
      });
      clearTimeout(tid);

      if (!resp.ok) {
        let msg = '生成失败 (HTTP ' + resp.status + ')';
        let detail = '';
        try {
          const err = await resp.json();
          if (err && err.error) {
            msg = err.error;
            if (err.trace) detail = '\n\n完整错误堆栈：\n' + err.trace;
          }
        } catch (_) {}
        setStatus(msg, 'error');
        updateLastMessage('assistant', '生成失败：' + msg);
        setChatStatus('生成失败', '');
        btn.disabled = Object.keys(files).length < 1;
        return;
      }

      // Save PDF blob for download
      const blob = await resp.blob();
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);

      // Enable download button
      document.getElementById('downloadBtn').disabled = false;

      const extra = resp.headers.get('X-Applied-Items') && resp.headers.get('X-Total-Items')
        ? '（回填了 ' + resp.headers.get('X-Applied-Items') + ' / ' + resp.headers.get('X-Total-Items') + ' 项数据）'
        : '';
      setStatus('报告已生成' + extra + '，AI 正在解读…', 'ok');

      // Auto-trigger AI interpretation
      await autoStartAIInterpretation();

    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('请求超时（超过 5 分钟），请稍后重试', 'error');
        updateLastMessage('assistant', '请求超时，请稍后重试。');
      } else {
        setStatus('网络错误: ' + err, 'error');
        updateLastMessage('assistant', '网络错误: ' + err);
      }
      setChatStatus('连接失败', '');
    } finally {
      btn.disabled = Object.keys(files).length < 1;
    }
  }

  // =====================================
  // Auto-start AI interpretation
  // =====================================
  async function autoStartAIInterpretation() {
    setChatStatus('AI 解读中…', 'loading');

    // Replace the "generating" message with typing indicator
    updateLastMessage('assistant', '__typing__');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          message: '请根据这份综合测评数据，生成一份完整的解读报告。',
          history: []
        })
      });

      const data = await resp.json();
      if (data.ok) {
        updateLastMessage('assistant', data.reply);
        chatHistory.push(
          { role: 'user', content: '请根据这份综合测评数据，生成一份完整的解读报告。' },
          { role: 'assistant', content: data.reply }
        );
        setChatStatus('AI 解读师就绪', 'active');
        // Enable input
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').focus();
      } else {
        updateLastMessage('assistant', '解读失败：' + data.error);
        setChatStatus('解读失败', '');
      }
    } catch (err) {
      updateLastMessage('assistant', '网络错误：' + err);
      setChatStatus('连接失败', '');
    }
  }

  // =====================================
  // Send message (user follow-up)
  // =====================================
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';

    // AI typing indicator
    addMessage('assistant', '__typing__');
    setChatStatus('AI 回复中…', 'loading');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          message: text,
          history: chatHistory.slice(-10)
        })
      });

      const data = await resp.json();
      if (data.ok) {
        updateLastMessage('assistant', data.reply);
        chatHistory.push(
          { role: 'user', content: text },
          { role: 'assistant', content: data.reply }
        );
      } else {
        updateLastMessage('assistant', '出错：' + data.error);
      }
    } catch (err) {
      updateLastMessage('assistant', '网络错误：' + err);
    }
    setChatStatus('AI 解读师就绪', 'active');
  }

  // =====================================
  // Download PDF
  // =====================================
  function downloadPdf() {
    if (!lastBlobUrl) return;
    const a = document.createElement('a');
    a.href = lastBlobUrl;
    a.download = '综合测评报告.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // =====================================
  // Init
  // =====================================
  renderSlots();
</script>
