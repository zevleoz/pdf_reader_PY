<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>综合测评报告 — Y4 报告生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* =========================== */
    /* Brand stripe + topbar       */
    /* =========================== */
    .brand-stripe { height: 3px; background: #1d4ed8; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      height: 28px;
      width: auto;
      max-height: 28px;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: #0f172a;
      letter-spacing: 0.2px;
    }
    .topbar-sub {
      color: #64748b;
      font-size: 12px;
    }

    /* =========================== */
    /* Layout: 33 / 67 split       */
    /* =========================== */
    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 33%) 1fr;
      gap: 0;
      min-height: 0;
      flex: 1;
    }

    /* =========================== */
    /* Left: Upload panel          */
    /* =========================== */
    .left-panel {
      padding: 24px 24px 32px;
      border-right: 1px solid #e2e8f0;
      background: #ffffff;
      overflow-y: auto;
      max-height: calc(100vh - 61px);
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .panel-subtitle {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .hint {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .hint strong { color: #1d4ed8; }

    /* Upload slots */
    .slots { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .slot {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 14px 16px;
      transition: all .15s ease;
      background: #fafbfc;
      cursor: pointer;
    }
    .slot:hover {
      border-color: #38bdf8;
      background: #f0f9ff;
      transform: translateY(-1px);
    }
    .slot.has-file {
      border-color: #1d4ed8;
      border-style: solid;
      background: #eff6ff;
    }
    .slot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .slot-tag {
      display: inline-block;
      background: #1d4ed8;
      color: #fff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .slot-sub {
      color: #64748b;
      font-size: 11px;
    }
    .slot-title {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
    }
    .slot-desc {
      color: #475569;
      font-size: 11px;
      margin-top: 2px;
    }
    .slot-fname {
      font-size: 12px;
      color: #1e40af;
      margin-top: 10px;
      word-break: break-all;
      min-height: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slot-placeholder {
      color: #94a3b8;
      font-style: italic;
      font-size: 12px;
      margin-top: 10px;
    }
    .slot input[type=file] { display: none; }

    /* Mindset score */
    .section-divider {
      border-top: 1px dashed #e2e8f0;
      margin: 18px 0;
    }
    .field-label {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .field-hint {
      color: #64748b;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .field-row input[type=number] {
      flex: 0 0 120px;
      padding: 9px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .field-row input[type=number]:focus {
      border-color: #2563eb;
    }
    .field-row span {
      color: #64748b;
      font-size: 12px;
    }

    /* Button */
    .gen-btn {
      width: 100%;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 20px;
      letter-spacing: 0.3px;
    }
    .gen-btn:hover:not(:disabled) {
      background: #1e40af;
    }
    .gen-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .gen-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      background: #94a3b8;
    }

    /* Status */
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      word-break: break-word;
    }
    .status.loading { display: block; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
    .status.error   { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .status.ok      { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #60a5fa;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Steps */
    .steps {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }
    .step.active { color: #1d4ed8; font-weight: 600; }
    .step.done { color: #16a34a; }
    .step .dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      flex-shrink: 0;
    }
    .step.active .dot { background: #1d4ed8; }
    .step.done .dot { background: #16a34a; content: '✓'; }
    .step.done .dot::before { content: '✓'; }

    /* =========================== */
    /* Right: Preview panel        */
    /* =========================== */
    .right-panel {
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: calc(100vh - 61px);
    }
    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      gap: 12px;
      flex-shrink: 0;
    }
    .pdf-info {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .pdf-filename {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 360px;
    }
    .pdf-filename.muted { color: #94a3b8; font-weight: 500; }
    .pdf-size { color: #64748b; font-size: 11px; flex-shrink: 0; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }
    .btn.secondary:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .btn.primary {
      background: #1d4ed8;
      color: #ffffff;
    }
    .btn.primary:hover:not(:disabled) {
      background: #1e40af;
    }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .pdf-preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
      padding: 24px;
    }
    .pdf-preview object,
    .pdf-preview iframe {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      max-width: 360px;
    }
    .empty-icon {
      width: 72px;
      height: 72px;
      background: #e0e7ff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .empty-icon svg { width: 36px; height: 36px; color: #4f46e5; }
    .empty-title {
      font-weight: 700;
      color: #1e293b;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .empty-sub {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      max-width: 360px;
    }
    .loading-big {
      width: 56px; height: 56px;
      border: 4px solid #c7d2fe;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }
    .loading-title {
      font-weight: 700;
      color: #1e293b;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .loading-sub {
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .loading-progress {
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .loading-progress-inner {
      height: 100%;
      background: linear-gradient(90deg, #1d4ed8, #6366f1);
      width: 30%;
      border-radius: 999px;
      animation: progress 2.4s ease-in-out infinite;
    }
    @keyframes progress {
      0% { width: 10%; margin-left: 0; }
      50% { width: 70%; margin-left: 10%; }
      100% { width: 10%; margin-left: 90%; }
    }

    /* =========================== */
    /* Responsive                  */
    /* =========================== */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
        max-height: none;
      }
      .right-panel {
        height: 70vh;
      }
      .topbar { padding: 12px 16px; }
      .pdf-toolbar { padding: 10px 16px; }
      .pdf-preview { padding: 16px; }
      .pdf-filename { max-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="品牌 Logo"
           onerror="this.style.display='none'" />
      <span class="brand-name">Y4 综合测评报告生成器</span>
    </div>
    <span class="topbar-sub">上传 PDF → AI 视觉解析 → 生成品牌报告</span>
  </header>

  <main class="layout">
    <!-- ================================= -->
    <!-- LEFT: Upload panel                -->
    <!-- ================================= -->
    <aside class="left-panel">
      <div class="panel-title">📄 上传报告</div>
      <div class="panel-subtitle">按报告标识上传对应 PDF，至少 1 份即可生成综合报告。</div>

      <div class="hint">
        <strong>上传说明</strong><br/>
        1. 每个上传框标有报告类型：<strong>A2</strong> · <strong>B3</strong> · <strong>B4</strong> · <strong>B6</strong>。请按标签上传。<br/>
        2. <strong style="color:#991b1c;">报告依赖视觉 OCR API</strong>，处理时间约 1-3 分钟，请耐心等待。
      </div>

      <div class="slots" id="slots"></div>

      <div class="section-divider"></div>

      <div class="field-label">思维模式分值（可选）</div>
      <div class="field-hint">如果 PDF 中思维模式数据提取不准确，可手动输入覆盖。</div>
      <div class="field-row">
        <input type="number" id="mindsetScore" min="0" max="100" step="0.1" placeholder="0 - 100"
               onchange="if(this.value !== '') this.value = Math.max(0, Math.min(100, Number(this.value)))">
        <span>分（0=固定型 · 50=混合型 · 100=成长型）</span>
      </div>

      <button class="gen-btn" id="genBtn" onclick="generate()" disabled>
        🚀 生成并预览报告
      </button>

      <div class="status" id="status"></div>
    </aside>

    <!-- ================================= -->
    <!-- RIGHT: PDF preview                -->
    <!-- ================================= -->
    <section class="right-panel">
      <div class="pdf-toolbar">
        <div class="pdf-info">
          <span class="pdf-filename muted" id="pdfFilename">综合测评报告.pdf</span>
          <span class="pdf-size" id="pdfSize"></span>
        </div>
        <div class="actions">
          <button class="btn secondary" id="openBtn" onclick="openInNewTab()" disabled>↗ 新窗口打开</button>
          <button class="btn primary" id="downloadBtn" onclick="downloadPdf()" disabled>⬇ 下载 PDF</button>
        </div>
      </div>
      <div class="pdf-preview" id="pdfPreview">
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="15" x2="15" y2="15"></line>
              <line x1="9" y1="11" x2="15" y2="11"></line>
            </svg>
          </div>
          <div class="empty-title">报告预览</div>
          <div class="empty-sub">在左侧上传 PDF 并点击「生成并预览报告」后，<br/>综合测评报告将在此处预览和下载。</div>
        </div>
      </div>
    </section>
  </main>

<script>
  // =====================================
  // Slot definitions
  // =====================================
  const SLOTS = [
    { key: "A2", title: "上传 A2 — 核心素养",
      sub: "认知能力 · 情绪稳定性 · 人格 · 依恋关系 · 体质健康" },
    { key: "B3", title: "上传 B3 — 核心学习能力",
      sub: "执行功能 · 学习动机 · 学习方法与策略" },
    { key: "B4", title: "上传 B4 — 核心认知能力 & 成长型思维",
      sub: "认知能力六项子指标 · 自驱力 · 思维模式" },
    { key: "B6", title: "上传 B6 — 职业发展",
      sub: "职业兴趣 Holland · 多元智能 · 职业价值观" },
  ];
  const files = {};
  let lastBlobUrl = null;
  let lastFilename = null;

  // =====================================
  // Brand logo: try several paths
  // =====================================
  (function setLogo() {
    const img = document.getElementById('brandLogo');
    const candidates = [
      '/output/branding/logo_color.png',
      '/branding/logo_color.png',
      '/static/branding/logo_color.png',
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= candidates.length) return;
      img.src = candidates[idx++];
    }
    img.addEventListener('error', tryNext, { once: true });
    tryNext();
  })();

  // =====================================
  // Render slots
  // =====================================
  function renderSlots() {
    const root = document.getElementById('slots');
    root.innerHTML = '';
    SLOTS.forEach(s => {
      const f = files[s.key];
      const slot = document.createElement('div');
      slot.className = 'slot' + (f ? ' has-file' : '');
      slot.innerHTML = `
        <div class="slot-head">
          <span class="slot-tag">${s.key}</span>
          <span class="slot-sub">点击选择 PDF</span>
        </div>
        <div class="slot-title">${s.title}</div>
        <div class="slot-desc">${s.sub}</div>
        ${f
          ? `<div class="slot-fname">📎 ${escapeHtml(f.name)}</div>`
          : `<div class="slot-placeholder">📁 未选择文件 · 点击选择 ${s.key} 报告 PDF…</div>`
        }
        <input type="file" accept="application/pdf"
               onchange="onPickFile('${s.key}', this)" />
      `;
      slot.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        slot.querySelector('input[type=file]').click();
      });
      root.appendChild(slot);
    });
    const picked = Object.keys(files).length;
    document.getElementById('genBtn').disabled = picked < 1;
  }

  function onPickFile(key, input) {
    const f = input.files[0];
    if (f) files[key] = f;
    renderSlots();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // =====================================
  // Right panel states
  // =====================================
  function showEmpty() {
    const p = document.getElementById('pdfPreview');
    p.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="9" y1="15" x2="15" y2="15"></line>
            <line x1="9" y1="11" x2="15" y2="11"></line>
          </svg>
        </div>
        <div class="empty-title">报告预览</div>
        <div class="empty-sub">在左侧上传 PDF 并点击「生成并预览报告」后，<br/>综合测评报告将在此处预览和下载。</div>
      </div>
    `;
    setToolbar(false);
  }

  function showGenerating() {
    const p = document.getElementById('pdfPreview');
    p.innerHTML = `
      <div class="loading-state">
        <div class="loading-big" aria-hidden="true"></div>
        <div class="loading-title">正在生成综合测评报告</div>
        <div class="loading-sub">视觉 OCR 解析通常需要 30-120 秒，请耐心等待。<br/>请不要关闭或刷新此页面。</div>
        <div class="loading-progress" aria-hidden="true">
          <div class="loading-progress-inner"></div>
        </div>
        <div class="steps" id="genSteps">
          <div class="step active" id="step1"><span class="dot">1</span>提取数据中…（30-120s）</div>
          <div class="step" id="step2"><span class="dot">2</span>校验完整性…（<5s）</div>
          <div class="step" id="step3"><span class="dot">3</span>渲染 PDF 报告…（5-15s）</div>
        </div>
      </div>
    `;
    setToolbar(false);
    // Approximate step transitions (polling based on elapsed time)
    const start = Date.now();
    const stepTimer = setInterval(() => {
      const elapsed = Date.now() - start;
      const s1 = document.getElementById('step1');
      const s2 = document.getElementById('step2');
      const s3 = document.getElementById('step3');
      if (!s1) { clearInterval(stepTimer); return; }
      if (elapsed > 130000) {
        s1.className = 'step done'; s2.className = 'step done'; s3.className = 'step active';
      } else if (elapsed > 120000) {
        s1.className = 'step done'; s2.className = 'step done'; s3.className = 'step';
      } else if (elapsed > 15000) {
        s1.className = 'step active';
      }
    }, 1000);
    window._genStepTimer = stepTimer;
  }

  function setToolbar(enabled, sizeBytes) {
    document.getElementById('openBtn').disabled = !enabled;
    document.getElementById('downloadBtn').disabled = !enabled;
    const fn = document.getElementById('pdfFilename');
    const sz = document.getElementById('pdfSize');
    if (enabled) {
      fn.classList.remove('muted');
      if (sizeBytes != null) {
        sz.textContent = formatBytes(sizeBytes);
      }
    } else {
      fn.classList.add('muted');
      sz.textContent = '';
    }
  }

  function formatBytes(b) {
    if (!b && b !== 0) return '';
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    return (b/1024/1024).toFixed(2) + ' MB';
  }

  function showPdfObject(blob) {
    if (window._genStepTimer) {
      clearInterval(window._genStepTimer);
      window._genStepTimer = null;
    }
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl = URL.createObjectURL(blob);
    lastFilename = '综合测评报告.pdf';
    const p = document.getElementById('pdfPreview');
    const randomQ = '?_=' + Date.now();
    // Use <object> first; if the browser can't embed, <iframe> or a fallback will be used
    p.innerHTML = '';
    const obj = document.createElement('object');
    obj.type = 'application/pdf';
    obj.data = lastBlobUrl + randomQ;
    obj.setAttribute('aria-label', '综合测评报告 PDF');
    // Fallback content for browsers that don't support <object> PDF
    obj.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon" style="background:#fee2e2;"><svg viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg></div>
        <div class="empty-title">浏览器不支持内嵌 PDF 预览</div>
        <div class="empty-sub">请点击右侧「⬇ 下载 PDF」或「↗ 新窗口打开」查看报告。</div>
      </div>
    `;
    p.appendChild(obj);
    setToolbar(true, blob.size);
  }

  // =====================================
  // Status
  // =====================================
  function setStatus(text, type) {
    const el = document.getElementById('status');
    el.className = 'status ' + (type || '');
    if (type === 'loading') {
      el.innerHTML = '<span class="spinner"></span>' + escapeHtml(text);
    } else {
      el.textContent = text;
    }
  }
  function clearStatus() {
    const el = document.getElementById('status');
    el.className = 'status';
    el.innerHTML = '';
  }

  // =====================================
  // Generate action
  // =====================================
  async function generate() {
    const picked = Object.keys(files).length;
    if (picked < 1) { alert('请至少上传 1 份 PDF'); return; }

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    setStatus('上传并解析 ' + picked + ' 份 PDF，约需 1-3 分钟，请耐心等待…', 'loading');
    showGenerating();

    const fd = new FormData();
    SLOTS.forEach(s => {
      if (files[s.key]) fd.append(s.key, files[s.key], files[s.key].name);
    });
    const mindset = document.getElementById('mindsetScore');
    if (mindset && mindset.value.trim()) {
      fd.append('mindset_score', mindset.value.trim());
    }

    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 300000);

    try {
      const resp = await fetch('/api/generate', {
        method: 'POST', body: fd, signal: controller.signal
      });
      clearTimeout(tid);

      if (!resp.ok) {
        let msg = '生成失败 (HTTP ' + resp.status + ')';
        let detail = '';
        try {
          const err = await resp.json();
          if (err && err.error) {
            msg = err.error;
            if (err.trace) detail = '\n\n完整错误堆栈：\n' + err.trace;
          }
        } catch (_) {}
        setStatus('❌ ' + msg, 'error');
        showEmpty();
        alert('❌ 生成失败：\n\n' + msg + detail);
        btn.disabled = Object.keys(files).length < 1;
        return;
      }

      const blob = await resp.blob();
      lastFilename = '综合测评报告.pdf';
      const cd = resp.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
      if (m) { try { lastFilename = decodeURIComponent(m[1]); } catch(_){} }
      document.getElementById('pdfFilename').textContent = lastFilename;
      showPdfObject(blob);

      const extra = resp.headers.get('X-Applied-Items') && resp.headers.get('X-Total-Items')
        ? '（回填了 ' + resp.headers.get('X-Applied-Items') + ' / ' + resp.headers.get('X-Total-Items') + ' 项数据）'
        : '';
      setStatus('✅ 完成！综合测评报告已生成' + extra, 'ok');

    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('❌ 请求超时（超过 5 分钟），请稍后重试', 'error');
      } else {
        setStatus('❌ 网络错误: ' + err, 'error');
      }
      showEmpty();
    } finally {
      btn.disabled = Object.keys(files).length < 1;
    }
  }

  // =====================================
  // Toolbar actions
  // =====================================
  function downloadPdf() {
    if (!lastBlobUrl) return;
    const a = document.createElement('a');
    a.href = lastBlobUrl;
    a.download = lastFilename || '综合测评报告.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function openInNewTab() {
    if (!lastBlobUrl) return;
    window.open(lastBlobUrl, '_blank', 'noopener');
  }

  // =====================================
  // Init
  // =====================================
  renderSlots();
</script>
</body>
</html>
