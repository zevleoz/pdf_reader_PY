<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>预约管理 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #0f172a; font-size: 14px; }
    .brand-stripe { height: 3px; background: #1d4ed8; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .brand-name { font-weight: 700; font-size: 15px; }
    .topbar a { color: #1d4ed8; text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 16px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; background: #fff; border: 1.5px solid #e2e8f0; }
    .tab.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #64748b; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.pending { background: #fef3c7; color: #b45309; }
    .badge.completed { background: #dcfce7; color: #16a34a; }
    .badge.cancelled { background: #f1f5f9; color: #64748b; }
    .btn { background: #1d4ed8; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px; }
    .btn:hover { background: #1e40af; }
    .btn.small { padding: 4px 10px; font-size: 11px; }
    .btn.danger { background: #fff; color: #dc2626; border: 1px solid #dc2626; }
    .btn.danger:hover { background: #fef2f2; }
    .empty { text-align: center; padding: 48px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <div class="topbar">
    <div class="brand-name">凭远教育 · Y4 预约管理</div>
    <div>
      <a href="/">← 返回首页</a>
      <a href="/students">学生档案</a>
      <a href="/booking">预约页面</a>
    </div>
  </div>
  <div class="container">
    <h1>预约管理</h1>
    <p class="subtitle">管理所有测评预约，完成预约后学生信息将自动录入档案。</p>
    <div class="tabs">
      <div class="tab active" data-status="" onclick="loadBookings('')">全部</div>
      <div class="tab" data-status="pending" onclick="loadBookings('pending')">待完成</div>
      <div class="tab" data-status="completed" onclick="loadBookings('completed')">已完成</div>
      <div class="tab" data-status="cancelled" onclick="loadBookings('cancelled')">已取消</div>
    </div>
    <div id="bookingList"></div>
  </div>
  <script>
    let currentStatus = '';

    async function loadBookings(status) {
      currentStatus = status;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.status === status);
      });
      const url = status ? `/api/bookings?status=${status}` : '/api/bookings';
      const resp = await fetch(url);
      const data = await resp.json();
      const el = document.getElementById('bookingList');
      if (!data.bookings || data.bookings.length === 0) {
        el.innerHTML = '<div class="empty">暂无预约</div>';
        return;
      }
      let html = '<table><thead><tr><th>学生姓名</th><th>联系方式</th><th>预约时间</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>';
      for (const b of data.bookings) {
        const t = b.appointment_time ? new Date(b.appointment_time).toLocaleString('zh-CN') : '-';
        const badge = `<span class="badge ${b.status}">${b.status === 'pending' ? '待完成' : b.status === 'completed' ? '已完成' : '已取消'}</span>`;
        let actions = '';
        if (b.status === 'pending') {
          actions = `<button class="btn small" onclick="completeBooking(${b.id})">完成</button>
                     <button class="btn danger small" onclick="cancelBooking(${b.id})">取消</button>`;
        }
        actions += `<button class="btn danger small" onclick="deleteBooking(${b.id})">删除</button>`;
        html += `<tr>
          <td><strong>${b.student_name}</strong></td>
          <td>${b.student_email || '-'}<br>${b.student_phone || ''}</td>
          <td>${t}</td>
          <td>${badge}</td>
          <td>${b.notes || '-'}</td>
          <td>${actions}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    async function completeBooking(id) {
      if (!confirm('确认完成此预约？学生信息将录入档案。')) return;
      await fetch(`/api/booking/${id}/complete`, { method: 'POST' });
      loadBookings(currentStatus);
    }

    async function cancelBooking(id) {
      if (!confirm('确认取消此预约？')) return;
      await fetch(`/api/booking/${id}/cancel`, { method: 'POST' });
      loadBookings(currentStatus);
    }

    async function deleteBooking(id) {
      if (!confirm('确认彻底删除此预约？此操作不可撤销。')) return;
      const resp = await fetch(`/api/booking/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        loadBookings(currentStatus);
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    loadBookings('');
  </script>
</body>
</html>
