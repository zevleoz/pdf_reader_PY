<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>预约管理 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="brand-stripe"></div>
  <div class="topbar">
    <div class="brand">
      <div class="brand-name">凭远教育</div>
      <div class="brand-name">Y4<span class="red">测评</span></div>
    </div>
    <div class="topbar-nav">
      <a href="/">← 主页</a>
      <a href="/booking">预约</a>
      <a href="/students">学生档案</a>
      <a href="/generate">报告生成</a>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">预约管理</h1>
    <p class="page-subtitle">管理所有测评预约，完成预约后学生信息将自动录入档案。</p>

    <div class="tabs">
      <div class="tab active" data-status="" onclick="loadBookings('')">全部</div>
      <div class="tab" data-status="pending" onclick="loadBookings('pending')">待完成</div>
      <div class="tab" data-status="completed" onclick="loadBookings('completed')">已完成</div>
      <div class="tab" data-status="cancelled" onclick="loadBookings('cancelled')">已取消</div>
    </div>

    <div id="bookingList"></div>

    <div class="card" id="availabilityCard" style="margin-top: 28px;">
      <h2 class="card-title">可用时间管理</h2>
      <p class="card-subtitle">管理员可设置本周可预约的时间段，点击时间段切换可用性。</p>
      <div id="availabilityContent">
        <div class="status loading" id="availabilityStatus">加载可用时间中…</div>
      </div>
    </div>
  </div>

  <script>
    let currentStatus = '';

    async function loadBookings(status) {
      currentStatus = status;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.status === status);
      });
      const url = status ? `/api/bookings?status=${status}` : '/api/bookings';
      const resp = await fetch(url);
      const data = await resp.json();
      const el = document.getElementById('bookingList');
      if (!data.bookings || data.bookings.length === 0) {
        el.innerHTML = '<div class="empty">暂无预约</div>';
        return;
      }
      let html = '<table><thead><tr><th>学生姓名</th><th>联系方式</th><th>预约时间</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>';
      for (const b of data.bookings) {
        const t = b.appointment_time ? new Date(b.appointment_time).toLocaleString('zh-CN') : '-';
        let badgeClass = 'badge-pending';
        let badgeText = '待完成';
        if (b.status === 'completed') { badgeClass = 'badge-completed'; badgeText = '已完成'; }
        else if (b.status === 'cancelled') { badgeClass = 'badge-cancelled'; badgeText = '已取消'; }
        const badge = `<span class="badge ${badgeClass}">${badgeText}</span>`;
        let actions = '';
        if (b.status === 'pending') {
          actions = `<button class="btn btn-sm btn-primary" onclick="completeBooking(${b.id})">完成</button>
                     <button class="btn btn-sm btn-secondary" onclick="cancelBooking(${b.id})">取消</button>`;
        }
        actions += `<button class="btn btn-sm btn-secondary" style="color:var(--red);border-color:var(--red);" onclick="deleteBooking(${b.id})">删除</button>`;
        html += `<tr>
          <td><strong>${b.student_name}</strong></td>
          <td>${b.student_email || '-'}<br>${b.student_phone || ''}</td>
          <td>${t}</td>
          <td>${badge}</td>
          <td>${b.notes || '-'}</td>
          <td>${actions}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    async function completeBooking(id) {
      if (!confirm('确认完成此预约？学生信息将录入档案。')) return;
      await fetch(`/api/booking/${id}/complete`, { method: 'POST' });
      loadBookings(currentStatus);
    }

    async function cancelBooking(id) {
      if (!confirm('确认取消此预约？')) return;
      await fetch(`/api/booking/${id}/cancel`, { method: 'POST' });
      loadBookings(currentStatus);
    }

    async function deleteBooking(id) {
      if (!confirm('确认彻底删除此预约？此操作不可撤销。')) return;
      const resp = await fetch(`/api/booking/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        loadBookings(currentStatus);
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
      }
    }

    async function loadAvailability() {
      const content = document.getElementById('availabilityContent');
      const status = document.getElementById('availabilityStatus');

      try {
        const resp = await fetch('/api/availability');
        const data = await resp.json();

        if (!data.slots || data.slots.length === 0) {
          status.className = 'status';
          status.style.display = 'block';
          status.textContent = '本周暂无可预约时间';
          status.style.background = 'var(--paper-2)';
          status.style.border = '1px solid var(--line)';
          status.style.color = 'var(--ink-2)';
          return;
        }

        status.style.display = 'none';

        const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        const startOfWeek = new Date();
        const day = startOfWeek.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        startOfWeek.setDate(startOfWeek.getDate() + diff);
        startOfWeek.setHours(0, 0, 0, 0);

        let html = '';
        const slotsByDay = {};
        for (const slot of data.slots) {
          const date = new Date(slot.date);
          const dayKey = date.toISOString().split('T')[0];
          if (!slotsByDay[dayKey]) slotsByDay[dayKey] = [];
          slotsByDay[dayKey].push({ ...slot, time: date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) });
        }

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(startOfWeek);
          dayDate.setDate(dayDate.getDate() + i);
          const dayKey = dayDate.toISOString().split('T')[0];
          const daySlots = slotsByDay[dayKey] || [];

          html += `<div style="margin-bottom:18px;">
            <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase;">${weekDays[i]} · ${dayKey.slice(5)}</div>
            <div class="time-slots">`;

          if (daySlots.length === 0) {
            html += `<div style="color:var(--muted);font-size:13px;padding:8px 0;">无可用时间</div>`;
          } else {
            for (const s of daySlots) {
              const available = s.available !== false;
              html += `<div class="time-slot admin-available ${available ? '' : 'disabled'}"
                        data-slot-id="${s.id || ''}"
                        onclick="toggleAvailability(${JSON.stringify(dayKey).replace(/"/g, '&quot;')}, '${s.time}', this)">
                ${s.time}${available ? '' : ' (不可用)'}
              </div>`;
            }
          }

          html += `</div></div>`;
        }

        html += `<div style="margin-top:20px;display:flex;gap:10px;">
          <button class="btn btn-sm btn-primary" onclick="saveAvailability()">保存更改</button>
          <button class="btn btn-sm btn-secondary" onclick="loadAvailability()">重置</button>
        </div>`;

        content.innerHTML = html;
        window._availabilityData = data;

      } catch (err) {
        status.className = 'status error';
        status.textContent = '加载可用时间失败：' + err.message;
      }
    }

    function toggleAvailability(date, time, el) {
      el.classList.toggle('disabled');
      const available = !el.classList.contains('disabled');
      el.textContent = time + (available ? '' : ' (不可用)');
      el.dataset.available = available ? 'true' : 'false';
    }

    async function saveAvailability() {
      const content = document.getElementById('availabilityContent');
      const slots = content.querySelectorAll('.time-slot.admin-available');
      const updates = [];

      slots.forEach(el => {
        const date = el.getAttribute('onclick').match(/'([^']+)'/);
        if (date) {
          updates.push({
            date: date[1],
            time: el.textContent.trim().replace(' (不可用)', ''),
            available: !el.classList.contains('disabled')
          });
        }
      });

      try {
        const resp = await fetch('/api/availability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ updates })
        });
        const data = await resp.json();
        if (data.ok) {
          const status = document.getElementById('availabilityStatus');
          status.className = 'status ok';
          status.textContent = '已保存可用时间';
          status.style.display = 'block';
          setTimeout(() => { status.style.display = 'none'; }, 3000);
        } else {
          alert('保存失败：' + (data.error || '未知错误'));
        }
      } catch (err) {
        alert('保存失败：' + err.message);
      }
    }

    loadBookings('');
    loadAvailability();
  </script>
</body>
</html>
