<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>解读会会议纪要生成 — Y4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    textarea {
      width: 100%;
      min-height: 300px;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      line-height: 1.8;
      background: var(--white);
      color: var(--ink);
      transition: border-color .2s var(--ease);
    }
    textarea:focus { border-color: var(--red); }
    .file-input-row {
      display: flex; align-items: center; gap: 12px; margin-top: 12px;
    }
    .btn-row { display: flex; gap: 12px; margin-top: 16px; }
    .result {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px;
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink);
    }
    .result h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      margin: 18px 0 8px;
      color: var(--red);
      font-weight: 600;
    }
    .result h3:first-child { margin-top: 0; }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .file-name { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="brand-stripe"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">凭远教育</span>
      <span class="brand-name" style="font-size:13px;font-weight:500;">Y4<span style="color:var(--red)">测评</span></span>
    </div>
    <nav class="topbar-nav">
      <a href="/generate">← 报告生成</a>
      <a href="/booking">预约</a>
      <a href="/students">学生档案</a>
    </nav>
  </header>

  <div class="container">
    <h1 class="page-title">解读会会议纪要生成</h1>
    <p class="page-subtitle">上传解读会逐字稿，AI 将根据 Y4 报告结构自动生成个性化会议纪要。</p>

    <div class="hint">
      <strong>使用说明：</strong>
      在学生完成 Y4 测评后，进行 1 对 1 解读会时录音并转写为文字。将转写文本粘贴到下方，系统会结合测评数据生成结构化的会议纪要。
    </div>

    <div class="card">
      <div class="section-label">学生信息</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
        <div class="field">
          <label class="field-label" for="studentName">学生姓名</label>
          <input type="text" id="studentName" placeholder="张三" />
        </div>
        <div class="field">
          <label class="field-label" for="studentGrade">年级</label>
          <input type="text" id="studentGrade" placeholder="高一" />
        </div>
        <div class="field">
          <label class="field-label" for="studentGender">性别</label>
          <input type="text" id="studentGender" placeholder="男/女" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">逐字稿</div>
      <textarea id="transcript" placeholder="在此粘贴解读会逐字稿文本...

例如：
顾问：你觉得这次测评结果和你自己的感受符合吗？
学生：基本上符合，特别是情绪那块，我确实有时候会很焦虑。
顾问：能具体说说吗？
学生：..."></textarea>
      <div class="file-input-row">
        <input type="file" id="fileInput" accept=".txt,.md" style="display:none" />
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">选择文本文件</button>
        <span id="fileName" class="file-name"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generateBtn" onclick="generateSummary()" disabled>
          生成会议纪要
        </button>
        <button class="btn btn-secondary" id="copyBtn" onclick="copyResult()" style="display:none">
          复制结果
        </button>
        <button class="btn btn-secondary" id="downloadTxtBtn" onclick="downloadTxt()" style="display:none">
          下载 TXT
        </button>
        <button class="btn btn-primary" id="downloadDocxBtn" onclick="downloadDocx()" style="display:none">
          下载 DOCX
        </button>
      </div>
      <div id="status" class="status" style="display:none"></div>
    </div>

    <div id="result" class="result" style="display:none"></div>
  </div>

  <script>
    const transcriptEl = document.getElementById('transcript');
    const generateBtn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const fileInput = document.getElementById('fileInput');
    const fileNameEl = document.getElementById('fileName');
    const copyBtn = document.getElementById('copyBtn');
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const downloadDocxBtn = document.getElementById('downloadDocxBtn');
    let lastResult = '';

    // ===== Session persistence =====
    const SESSION_KEY = 'y4_transcript_state';

    function saveToSession() {
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          transcript: transcriptEl.value,
          studentName: document.getElementById('studentName').value,
          studentGrade: document.getElementById('studentGrade').value,
          studentGender: document.getElementById('studentGender').value,
          summary: lastResult,
        }));
      } catch (e) { /* ignore quota */ }
    }

    function restoreFromSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.transcript) transcriptEl.value = data.transcript;
        if (data.studentName) document.getElementById('studentName').value = data.studentName;
        if (data.studentGrade) document.getElementById('studentGrade').value = data.studentGrade;
        if (data.studentGender) document.getElementById('studentGender').value = data.studentGender;
        if (data.summary) {
          lastResult = data.summary;
          resultEl.innerHTML = renderMinutesMarkdown(data.summary);
          resultEl.style.display = 'block';
          copyBtn.style.display = 'inline-block';
          downloadTxtBtn.style.display = 'inline-block';
          downloadDocxBtn.style.display = 'inline-block';
        }
        if (transcriptEl.value.trim().length >= 50) {
          generateBtn.disabled = false;
        }
      } catch (e) { /* ignore */ }
    }

    // ===== Minimal markdown renderer for minutes (bullet-point focused) =====
    function renderMinutesMarkdown(text) {
      // Escape first, then selectively re-add formatting
      let html = escapeHtml(text);

      // Block separators ---  → thin red divider
      html = html.replace(/^(\s*[\-\=━]{3,}\s*\n?)/gm,
        '<hr style="border:none;border-top:1px dashed var(--line);margin:16px 0;">');

      // Headings: **一、xxx**（yyy）
      html = html.replace(/^\*\*(.+?)\*\*(?:（(.+?)）)?\s*$/gm, (m, title, sub) => {
        const subPart = sub ? `<span style="color:var(--muted);font-size:0.85em;font-weight:500;">（${sub}）</span>` : '';
        return `<h3>${title}${subPart}</h3>`;
      });

      // Inline bold **text**
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--ink);">$1</strong>');

      // Quote > lines
      html = html.replace(/^&gt;\s*(.+?)$/gm,
        '<div style="border-left:3px solid var(--red);padding:4px 12px;color:var(--ink-2);font-style:italic;margin:6px 0;font-size:0.95em;">$1</div>');

      // Checkbox bullets: • [ ] item or - [x] item
      html = html.replace(/^\s*(?:[-•·\*])\s*\[\s*([xX\s]?)\s*\]\s*(.+?)$/gm,
        (m, check, content) => {
          const box = (check === 'x' || check === 'X') ? '☑' : '☐';
          return `<div style="padding:3px 0 3px 1em;text-indent:-1em;line-height:1.75;">
            <span style="color:var(--red);font-weight:700;">${box} • </span>${content.trim()}</div>`;
        });

      // Standard bullet lines: •, -, *, ·
      html = html.replace(/^\s*(?:[-•·\*])\s*(.+?)$/gm, (m, content) => {
        return `<div style="padding:3px 0 3px 1em;text-indent:-1em;line-height:1.75;">
          <span style="color:var(--red);font-weight:700;">• </span>${content.trim()}</div>`;
      });

      // Non-heading lines that start with **xxx** (subheading, no bullet)
      html = html.replace(/^<strong[^>]*>(.+?)<\/strong>\s*$/gm,
        '<div style="font-weight:700;margin-top:10px;color:var(--ink);">$1</div>');

      // Line breaks for remaining newlines
      html = html.replace(/\n{2,}/g, '<br><br>');
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ===== URL params =====
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('name')) {
      document.getElementById('studentName').value = urlParams.get('name');
    }
    if (urlParams.get('grade')) {
      document.getElementById('studentGrade').value = urlParams.get('grade');
    }

    // ===== Input listeners =====
    transcriptEl.addEventListener('input', () => {
      generateBtn.disabled = transcriptEl.value.trim().length < 50;
      saveToSession();
    });
    ['studentName', 'studentGrade', 'studentGender'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveToSession);
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileNameEl.textContent = file.name;
      const text = await file.text();
      transcriptEl.value = text;
      generateBtn.disabled = text.trim().length < 50;
      saveToSession();
    });

    function setStatus(msg, type) {
      statusEl.style.display = 'block';
      statusEl.className = 'status' + (type ? ' ' + type : '');
      statusEl.innerHTML = msg;
    }

    async function generateSummary() {
      const text = transcriptEl.value.trim();
      const name = document.getElementById('studentName').value.trim();
      const grade = document.getElementById('studentGrade').value.trim();
      const gender = document.getElementById('studentGender').value.trim();

      if (!text || text.length < 50) return;

      generateBtn.disabled = true;
      setStatus('<span class="spinner"></span>正在生成精简、可执行的会议纪要，请稍候...', 'loading');
      resultEl.style.display = 'none';
      copyBtn.style.display = 'none';
      downloadTxtBtn.style.display = 'none';
      downloadDocxBtn.style.display = 'none';

      try {
        const resp = await fetch('/api/transcript', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            transcript: text,
            student_name: name,
            student_grade: grade,
            student_gender: gender,
          }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || '生成失败');
        }

        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || '生成失败');

        lastResult = data.summary;
        resultEl.innerHTML = renderMinutesMarkdown(data.summary);
        resultEl.style.display = 'block';
        copyBtn.style.display = 'inline-block';
        downloadTxtBtn.style.display = 'inline-block';
        downloadDocxBtn.style.display = 'inline-block';
        setStatus('会议纪要已生成！要点清晰、行动可执行。', 'ok');
        saveToSession();
      } catch (e) {
        setStatus('生成失败：' + e.message, 'error');
      } finally {
        generateBtn.disabled = false;
      }
    }

    function copyResult() {
      if (!lastResult) return;
      navigator.clipboard.writeText(lastResult).then(() => {
        copyBtn.textContent = '已复制 ✓';
        setTimeout(() => copyBtn.textContent = '复制结果', 2000);
      });
    }

    function downloadTxt() {
      if (!lastResult) return;
      const name = document.getElementById('studentName').value.trim() || '学生';
      const blob = new Blob([lastResult], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `凭远Y4解读会纪要_${name}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function downloadDocx() {
      if (!lastResult) return;
      const name = document.getElementById('studentName').value.trim();
      const grade = document.getElementById('studentGrade').value.trim();
      const gender = document.getElementById('studentGender').value.trim();

      // Use temporary loading state on the button
      const oldText = downloadDocxBtn.textContent;
      downloadDocxBtn.disabled = true;
      downloadDocxBtn.textContent = '生成中…';

      try {
        const resp = await fetch('/api/transcript/docx', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            summary: lastResult,
            student_name: name,
            student_grade: grade,
            student_gender: gender,
          }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || 'DOCX 生成失败');
        }
        const blob = await resp.blob();
        // Extract filename from Content-Disposition if possible
        const disp = resp.headers.get('Content-Disposition') || '';
        let filename = `凭远Y4解读会纪要_${name || '学生'}.docx`;
        const match = disp.match(/filename\*=UTF-8''([^;]+)/);
        if (match) {
          try { filename = decodeURIComponent(match[1]); } catch { /* use default */ }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('下载 DOCX 失败：' + e.message);
      } finally {
        downloadDocxBtn.disabled = false;
        downloadDocxBtn.textContent = oldText;
      }
    }

    // Restore session state on load
    restoreFromSession();
  </script>
</body>
</html>
