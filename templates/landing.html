<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>凭远教育 · Y4 综合测评</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="凭远教育 Y4 综合测评系统 — 四维测评,AI 视觉解析,生成可行动的学生发展报告。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #FAF7F2;
      --paper-2: #F2EDE3;
      --ink: #141414;
      --ink-2: #4A4A4A;
      --muted: #8A8A8A;
      --line: #D9D2C5;
      --line-soft: #E8E2D5;
      --red: #B33A3A;
      --red-deep: #8C2828;
      --white: #FFFFFF;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-precise: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      font-feature-settings: "ss01", "cv11";
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { max-width: 100%; display: block; }
    ::selection { background: var(--red); color: var(--white); }

    /* ========== Reusable type ========== */
    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ========== NAV ========== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: padding 0.4s var(--ease), background 0.4s var(--ease),
                  border-color 0.4s var(--ease);
      border-bottom: 1px solid transparent;
    }
    .nav.scrolled {
      padding: 14px 40px;
      background: rgba(250, 247, 242, 0.86);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      border-bottom-color: var(--line-soft);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .nav-brand img {
      height: 30px;
      width: auto;
      transition: opacity 0.2s;
    }
    .nav-brand .brand-text {
      font-family: "Noto Serif SC", serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      letter-spacing: 0.04em;
    }
    .nav-brand .brand-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding-left: 11px;
      margin-left: 4px;
      border-left: 1px solid var(--line);
      text-transform: uppercase;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-link {
      position: relative;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink-2);
      border-radius: 2px;
      transition: color 0.2s var(--ease-precise);
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 18px; right: 18px;
      bottom: 4px;
      height: 1px;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s var(--ease);
    }
    .nav-link:hover { color: var(--ink); }
    .nav-link:hover::after { transform: scaleX(1); }
    .nav-link.is-primary { color: var(--red); }
    .nav-link.is-primary::after { background: var(--red); }

    /* ========== STAGE ========== */
    .stage {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
      align-items: stretch;
      max-width: 1440px;
      margin: 0 auto;
      padding: 120px 40px 64px;
      gap: 48px;
      position: relative;
    }
    /* Center vertical hairline dividing the two columns */
    .stage::before {
      content: "";
      position: absolute;
      top: 120px;
      bottom: 64px;
      left: calc((5 / 9) * (100% - 48px - 80px) + 24px);
      width: 1px;
      background: var(--line-soft);
      pointer-events: none;
    }

    /* ========== LEFT: editorial ========== */
    .stage-left {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 20px;
      padding-right: 24px;
      position: relative;
    }
    .index-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.7s var(--ease) 0.05s forwards;
    }
    .index-mark .num {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--red);
    }
    .index-mark .rule {
      width: 28px;
      height: 1px;
      background: var(--ink);
    }
    .index-mark .label {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--ink-2);
      text-transform: uppercase;
    }

    .headline {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1.08;
      letter-spacing: -0.012em;
      color: var(--ink);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.85s var(--ease) 0.15s forwards;
    }
    .headline .red {
      color: var(--red);
      font-style: italic;
      font-weight: 600;
    }
    .headline .line2 {
      display: block;
      font-weight: 500;
      color: var(--ink-2);
      font-size: 0.62em;
      letter-spacing: 0.02em;
      margin-top: 6px;
    }

    .lede {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--ink-2);
      max-width: 440px;
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.85s var(--ease) 0.28s forwards;
    }
    .lede em {
      font-style: normal;
      color: var(--ink);
      font-weight: 500;
      border-bottom: 1px solid var(--red);
      padding-bottom: 1px;
    }

    /* Actions */
    .actions {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.85s var(--ease) 0.42s forwards;
    }
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 28px 15px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: 2px;
      transition: transform 0.25s var(--ease), background 0.2s, color 0.2s;
      will-change: transform;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--ink);
      color: var(--paper);
    }
    .btn-primary:hover {
      background: var(--red);
    }
    .btn-primary .arrow {
      width: 18px; height: 1px; background: currentColor; position: relative;
      transition: width 0.25s var(--ease);
    }
    .btn-primary .arrow::after {
      content: ""; position: absolute; right: 0; top: 50%;
      width: 7px; height: 7px;
      border-right: 1px solid currentColor;
      border-top: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    .btn-primary:hover .arrow { width: 26px; }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      padding-left: 4px;
      padding-right: 4px;
      border-bottom: 1px solid var(--ink);
      border-radius: 0;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    .btn-ghost:hover {
      color: var(--red);
      border-bottom-color: var(--red);
    }
    .btn-ghost .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red);
      display: inline-block;
    }

    /* Footer meta strip inside left column */
    .meta-strip {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      gap: 40px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.85s var(--ease) 0.55s forwards;
    }
    .meta-item .k {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .meta-item .v {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .meta-item .v small {
      font-family: "Inter", sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
      letter-spacing: 0.04em;
    }

    /* ========== RIGHT: specimen ========== */
    .stage-right {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
      padding-left: 24px;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s var(--ease) 0.35s forwards;
    }

    .specimen {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 210 / 297;
    }
    /* Corner crop marks — like a film specimen */
    .specimen .crop {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--ink);
      border-style: solid;
      border-width: 0;
    }
    .specimen .crop.tl { top: -10px; left: -10px; border-top-width: 1px; border-left-width: 1px; }
    .specimen .crop.tr { top: -10px; right: -10px; border-top-width: 1px; border-right-width: 1px; }
    .specimen .crop.bl { bottom: -10px; left: -10px; border-bottom-width: 1px; border-left-width: 1px; }
    .specimen .crop.br { bottom: -10px; right: -10px; border-bottom-width: 1px; border-right-width: 1px; }

    .specimen .frame {
      width: 100%;
      height: 100%;
      background: var(--white);
      overflow: hidden;
      box-shadow:
        0 1px 2px rgba(20, 20, 20, 0.04),
        0 18px 48px rgba(20, 20, 20, 0.08);
      position: relative;
    }
    .specimen .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transition: transform 0.6s var(--ease);
    }
    .specimen:hover .frame img { transform: scale(1.015); }

    /* Red accent line on the right edge of the specimen */
    .specimen .accent-line {
      position: absolute;
      top: 12%;
      bottom: 12%;
      right: -22px;
      width: 2px;
      background: var(--red);
    }
    .specimen .accent-line::before,
    .specimen .accent-line::after {
      content: "";
      position: absolute;
      left: -3px;
      width: 8px; height: 1px;
      background: var(--red);
    }
    .specimen .accent-line::before { top: 0; }
    .specimen .accent-line::after { bottom: 0; }

    /* Specimen caption — like a museum label */
    .caption {
      margin-top: 36px;
      width: 100%;
      max-width: 360px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: baseline;
      padding-top: 14px;
      border-top: 1px solid var(--ink);
    }
    .caption .id {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--red);
    }
    .caption .title {
      font-family: "Noto Serif SC", serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .caption .title small {
      display: block;
      font-family: "Inter", sans-serif;
      font-size: 10.5px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-top: 3px;
    }
    .caption .page {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* ========== Bottom bar ========== */
    .bottombar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      z-index: 50;
      pointer-events: none;
      background: linear-gradient(to top, var(--paper) 30%, transparent);
    }
    .bottombar > * { pointer-events: auto; }
    .bottombar a:hover { color: var(--red); }

    /* ========== Animations ========== */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
      .index-mark, .headline, .lede, .actions, .meta-strip, .stage-right {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* ========== Responsive ========== */
    @media (max-width: 960px) {
      .nav { padding: 16px 22px; }
      .nav.scrolled { padding: 12px 22px; }
      .nav-brand .brand-tag { display: none; }
      .nav-link { padding: 8px 12px; font-size: 13px; }

      .stage {
        grid-template-columns: 1fr;
        gap: 56px;
        padding: 100px 22px 100px;
      }
      .stage::before { display: none; }
      .stage-left { padding-right: 0; }
      .stage-right { padding-left: 0; order: -1; }
      .specimen { max-width: 280px; }
      .caption { max-width: 280px; }

      .headline { font-size: 38px; }
      .lede { font-size: 15px; }
      .meta-strip { gap: 28px; margin-top: 48px; }
      .meta-item .v { font-size: 16px; }
      .bottombar { padding: 12px 22px; font-size: 9.5px; }
    }
    @media (max-width: 480px) {
      .meta-strip { flex-wrap: wrap; gap: 20px 28px; }
      .actions { gap: 18px; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <a href="/" class="nav-brand">
    <img src="/branding/logo_color.png" alt="凭远教育" onerror="this.style.display='none'" />
    <span class="brand-text">凭远教育</span>
    <span class="brand-tag">Y4 / Assessment</span>
  </a>
  <div class="nav-actions">
    <a href="/generate" class="nav-link is-primary">生成报告</a>
    <a href="/booking" class="nav-link">预约测评</a>
    <a href="/admin/bookings" class="nav-link">预约管理</a>
    <a href="/students" class="nav-link">学生档案</a>
    <a href="/transcript" class="nav-link">解读会</a>
  </div>
</nav>

<!-- STAGE -->
<section class="stage">

  <!-- LEFT -->
  <div class="stage-left">
    <div class="index-mark">
      <span class="num">01</span>
      <span class="rule"></span>
      <span class="label">凭远教育</span>
    </div>

    <h1 class="headline">
      Y4<span class="red">测评</span>
      <span class="line2">学生发展报告</span>
    </h1>

    <div class="actions">
      <a href="/generate" class="btn btn-primary">
        生成报告
        <span class="arrow"></span>
      </a>
      <a href="/booking" class="btn btn-ghost">
        <span class="dot"></span>
        预约测评
      </a>
    </div>
  </div>

  <!-- RIGHT: specimen -->
  <div class="stage-right">
    <div class="specimen">
      <span class="crop tl"></span>
      <span class="crop tr"></span>
      <span class="crop bl"></span>
      <span class="crop br"></span>
      <div class="frame">
        <img src="/output/report_title_page.png" alt="Y4 评测报告 · 标题页样例" />
      </div>
      <span class="accent-line"></span>
    </div>

    <div class="caption">
      <span class="id">Y4 — 001</span>
      <span class="title">
        Y4测评报告
        <small>标题页 / Title Page · 样例</small>
      </span>
      <span class="page">P.01</span>
    </div>
  </div>

</section>

<!-- BOTTOM BAR -->
<div class="bottombar">
  <span>© 2025 凭远教育</span>
  <span>Internal Use · Y4 Assessment Platform</span>
</div>

<script>
  // Nav scroll state
  (function() {
    const nav = document.getElementById('nav');
    let ticking = false;
    function update() {
      if (window.scrollY > 24) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(update); ticking = true; }
    }, { passive: true });
  })();

  // Keyboard focus visibility for nav links
  (function() {
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        // let normal navigation happen; just ensure focus ring visible on keyboard use
      });
    });
  })();
</script>

</body>
</html>
