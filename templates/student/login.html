{% extends "student/base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="s-login">
  <h1 class="s-h1">我的问卷</h1>
  <p class="s-muted s-intro">使用顾问发给你的账号和密码登录。</p>
  {% if error %}
  <div id="s-login-error" class="s-alert" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('questionnaires.student_login') }}" class="s-login-form">
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="s-field">
      <label for="s-username">账号</label>
      <input class="s-input" id="s-username" name="username" autocomplete="username" required
             value="{{ username|default('') }}" autocapitalize="none" autocorrect="off" spellcheck="false"
             {% if error %}aria-describedby="s-login-error"{% endif %} />
    </div>
    <div class="s-field">
      <label for="s-password">密码</label>
      <div class="s-password-field">
        <input class="s-input" id="s-password" name="password" type="password"
               autocomplete="current-password" required
               autocapitalize="none" autocorrect="off" spellcheck="false"
               {% if error %}aria-describedby="s-login-error"{% endif %} />
        <button type="button" class="s-password-toggle" aria-controls="s-password"
                onclick="const password = document.getElementById('s-password'); const show = password.type === 'password'; password.type = show ? 'text' : 'password'; this.textContent = show ? '隐藏密码' : '显示密码';">显示密码</button>
      </div>
    </div>
    <button type="submit" class="s-btn s-btn-primary">登录</button>
  </form>
  <p class="s-muted s-login-help">忘记密码？请联系你的顾问重置。</p>
</div>
{% endblock %}
